<script>
/* =========================================================================
   My Notebook — core.js
   The store, the item model, the librarian's two brains, and the brief.
   No build step, no dependencies. window.NB is the app's spine.
   ========================================================================= */
(function () {
  'use strict';

  const NB = (window.NB = {});

  /* ---------------- dates ---------------- */
  const DAY = 86400000;
  const WEEKDAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];

  function pad(n) { return String(n).padStart(2, '0'); }
  function toKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function fromKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
  function todayKey() { return toKey(new Date()); }
  function addDays(key, n) { const d = fromKey(key); d.setDate(d.getDate() + n); return toKey(d); }
  function monthKey(key) { return key.slice(0, 7); }
  function dayName(key, short) {
    const d = fromKey(key);
    const name = d.toLocaleDateString('en-US', { weekday: short ? 'short' : 'long' });
    return name;
  }
  function niceDate(key) {
    const d = fromKey(key);
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }
  /* Monday-start week containing `key` */
  function weekOf(key) {
    const d = fromKey(key);
    const dow = (d.getDay() + 6) % 7; // Mon=0
    d.setDate(d.getDate() - dow);
    const days = [];
    for (let i = 0; i < 7; i++) { days.push(toKey(d)); d.setDate(d.getDate() + 1); }
    return days;
  }
  function daysUntil(key) { return Math.round((fromKey(key) - fromKey(todayKey())) / DAY); }

  NB.dates = { toKey, fromKey, todayKey, addDays, monthKey, dayName, niceDate, weekOf, daysUntil, pad };

  /* ---------------- store ---------------- */
  const STORE_KEY = 'notebook-v1';

  const DEFAULT_STATE = () => ({
    v: 1,
    items: [],
    settings: { theme: 'auto', plainHand: false, apiKey: '', model: 'claude-opus-4-8' },
    meta: { lastOpen: null, seeded: false, firstDumpDone: false, briefFoldedFor: null },
  });

  let state = load();
  let saveTimer = null;

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return DEFAULT_STATE();
      const parsed = JSON.parse(raw);
      const base = DEFAULT_STATE();
      return {
        ...base, ...parsed,
        settings: { ...base.settings, ...(parsed.settings || {}) },
        meta: { ...base.meta, ...(parsed.meta || {}) },
        items: Array.isArray(parsed.items) ? parsed.items : [],
      };
    } catch (e) {
      try { const bad = localStorage.getItem(STORE_KEY); if (bad) localStorage.setItem(STORE_KEY + '-corrupt', bad); } catch (_) {}
      return DEFAULT_STATE();
    }
  }
  function flush() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); NB.storageError = false; }
    catch (e) { NB.storageError = true; if (NB.onStorageError) NB.onStorageError(); }
  }
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 150); }
  NB.flush = () => { clearTimeout(saveTimer); flush(); };
  function wipe() { localStorage.removeItem(STORE_KEY); state = DEFAULT_STATE(); undoSnap = null; }

  NB.state = () => state;
  NB.save = save;
  NB.wipe = wipe;

  /* ---------------- items ---------------- */
  let idc = Date.now() % 1e7;
  function uid() { return 'i' + (idc++).toString(36) + Math.random().toString(36).slice(2, 6); }

  /* kinds: task · bill · goal · idea · person · renewal · debt · health · routine · scrap */
  function makeItem(partial) {
    return {
      id: uid(), kind: 'task', text: '', ink: true, date: null, time: null,
      bucket: 'day',           /* day | week | next-week | someday | goals | ideas */
      done: false, doneAt: null, carried: 0, sample: false,
      source: null,            /* {quote, at, via} */
      question: null,          /* {q, options:[{label, act}]} — parked sticky */
      bill: null, person: null, renewal: null, debt: null, goal: null,
      ...partial,
    };
  }
  NB.makeItem = makeItem;

  function addItem(partial) { const it = makeItem(partial); state.items.push(it); save(); return it; }
  function getItem(id) { return state.items.find((i) => i.id === id) || null; }
  function removeItem(id) { state.items = state.items.filter((i) => i.id !== id); save(); }
  NB.addItem = addItem; NB.getItem = getItem; NB.removeItem = removeItem;

  /* Clear watermark samples the moment real life arrives. */
  function clearSamples() {
    if (state.items.some((i) => i.sample)) {
      state.items = state.items.filter((i) => !i.sample);
    }
    state.meta.firstDumpDone = true; save();
  }
  NB.clearSamples = clearSamples;

  /* ---------------- undo (6s whisper) ---------------- */
  let undoSnap = null;
  function withUndo(label, fn) {
    undoSnap = JSON.stringify(state.items);
    fn();
    save();
    if (NB.onWhisper) NB.onWhisper(label);
  }
  function undo() {
    if (!undoSnap) return false;
    state.items = JSON.parse(undoSnap);
    undoSnap = null; save();
    return true;
  }
  NB.withUndo = withUndo; NB.undo = undo;

  /* ---------------- day rollover: carry-forward, routine reset ---------------- */
  function rollover() {
    const today = todayKey();
    const last = state.meta.lastOpen;
    state.meta.lastOpen = today;
    if (last === today) { save(); return; }

    for (const it of state.items) {
      if (it.done && it.kind === 'routine') { it.done = false; it.doneAt = null; } // routines reset daily
      if (it.kind === 'task' && !it.done && it.bucket === 'day' && it.date && it.date < today) {
        it.carried = (it.carried || 0) + 1;
        it.date = today;
        if (it.carried >= 3 && !it.question) {
          it.ink = false;
          it.question = {
            q: 'Still a thing — or handled some other way? Either answer is fine.',
            options: [
              { label: 'keep it', act: 'keep' },
              { label: 'someday', act: 'someday' },
              { label: 'toss', act: 'toss' },
            ],
          };
        }
      }
    }
    state.meta.briefFoldedFor = null; // fresh brief each morning
    save();
  }
  NB.rollover = rollover;

  /* ---------------- selectors ---------------- */
  function billCycleKey() { return monthKey(todayKey()); }
  function billPaid(it, cycle) { return !!(it.bill && it.bill.paid && it.bill.paid[cycle || billCycleKey()]); }
  function billDueDate(it) {
    /* the next REAL due date: this cycle's if unpaid, else next cycle's */
    if (!it.bill || !it.bill.dueDay) return null;
    let [y, m] = billCycleKey().split('-').map(Number);
    if (billPaid(it, `${y}-${pad(m)}`)) { m += 1; if (m > 12) { m = 1; y += 1; } }
    const day = Math.min(it.bill.dueDay, new Date(y, m, 0).getDate());
    return `${y}-${pad(m)}-${pad(day)}`;
  }
  NB.billCycleKey = billCycleKey; NB.billPaid = billPaid; NB.billDueDate = billDueDate;

  function itemsFor(pred) { return state.items.filter(pred); }
  NB.itemsFor = itemsFor;

  /* Everything that belongs on a given day column (front-of-book + echoes). */
  function dayItems(key) {
    const out = { timed: [], tasks: [], echoes: [], carried: [] };
    for (const it of state.items) {
      if (it.done && it.kind !== 'routine') continue;
      if ((it.kind === 'task' || it.kind === 'scrap') && it.bucket === 'day' && it.date === key) {
        if (it.carried > 0) out.carried.push(it);
        else if (it.time) out.timed.push(it);
        else out.tasks.push(it);
      }
      /* echoes — one object, two faces */
      if (it.kind === 'bill' && it.bill && it.bill.dueDay && !billPaid(it)) {
        const due = billDueDate(it);
        /* on its due day — and an overdue bill rides Today until handled */
        if (due === key || (key === todayKey() && due < key)) out.echoes.push({ echo: 'bill', item: it });
      }
      if (it.kind === 'person' && it.person && it.person.birthday) {
        const mo = Number(it.person.birthday.slice(0, 2)), da = Number(it.person.birthday.slice(3));
        const dim = new Date(Number(key.slice(0, 4)), mo, 0).getDate();
        if (key.slice(5) === `${pad(mo)}-${pad(Math.min(da, dim))}`) out.echoes.push({ echo: 'bday', item: it });
      }
      if (it.kind === 'renewal' && it.renewal && it.renewal.expires === key) {
        out.echoes.push({ echo: 'renewal', item: it });
      }
      if (it.kind === 'health' && it.date === key && !it.done) {
        out.echoes.push({ echo: 'health', item: it });
      }
    }
    out.timed.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    return out;
  }
  NB.dayItems = dayItems;

  /* ---------------- the local brain (offline heuristics) ---------------- */
  const VERBS = 'call text email message buy get grab book pay renew pick send fix clean schedule cancel return finish submit order drop take bring check ask water walk feed read write plan visit sign print wash move update reply remind'.split(' ');
  const GOAL_RE = /\b(finally|some ?day|this year|next year|bucket list|dream of|want to|we should really|life goal|one day)\b/i;
  const HEDGE_RE = /\b(idk|maybe|might|possibly|thinking about|not sure|kinda|sorta|perhaps)\b|\?\s*$/i;
  const OWE_RE = /\b(owes? (me|you|us)|i owe|lent|borrowed|pay (me|you) back|paid for me)\b/i;
  const BDAY_RE = /\b(birthday|bday|b-day|turns \d+)\b/i;
  const BILL_WORDS = /\b(rent|bill|electricity|electric|water bill|internet|wifi|phone bill|subscription|insurance|utilities|gas bill)\b/i;
  const RENEWAL_RE = /\b(passport|licen[cs]e|registration|rego|visa|lease|insurance) .*\b(expires?|renewal?|due|runs out)\b|\b(expires?|renew)\b.*\b(passport|licen[cs]e|registration|rego|visa|lease)\b/i;
  const HEALTH_RE = /\b(doctor|dentist|dr\.?\s|appointment|prescription|refill|check-?up|physio|therapist|meds)\b/i;
  const ROUTINE_RE = /\bevery (day|morning|night|week|sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b|\bdaily\b/i;

  function parseWhen(text) {
    const t = text.toLowerCase();
    const today = todayKey();
    let date = null, time = null;

    const tm = t.match(/\b(?:at |by )?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/) || t.match(/\bat (\d{1,2})(?::(\d{2}))?\b/);
    if (tm) {
      let h = Number(tm[1]); const min = tm[2] ? Number(tm[2]) : 0; const ap = tm[3];
      if (ap === 'pm' && h < 12) h += 12;
      if (ap === 'am' && h === 12) h = 0;
      if (!ap && h <= 7) h += 12; // "at 5" → 17:00, notebook optimism
      if (h < 24 && min < 60) time = `${pad(h)}:${pad(min)}`;
    }

    if (/\btoday\b|\btonight\b/.test(t)) date = today;
    else if (/\btomorrow\b|\btmrw\b/.test(t)) date = addDays(today, 1);
    else {
      const wd = t.match(/\b(?:on |this |next )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
      if (wd) {
        const target = WEEKDAYS.indexOf(wd[1]);
        const now = fromKey(today).getDay();
        const base = (target - now + 7) % 7; /* 0 = that day is today */
        const diff = /\bnext /.test(wd[0]) ? (base === 0 ? 7 : base + 7) : base;
        date = addDays(today, diff);
      }
      const md = t.match(/\b(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sept|sep|oct|nov|dec)\.?\s+(\d{1,2})\b/);
      if (!date && md) {
        const m = MONTHS.findIndex((x) => x.startsWith(md[1]));
        const dayN = Number(md[2]);
        const dim = (yy) => new Date(yy, m + 1, 0).getDate();
        if (m >= 0 && dayN >= 1) {
          let y = new Date().getFullYear();
          if (dayN <= dim(y)) {
            let d2 = new Date(y, m, dayN);
            if (toKey(d2) < today && dayN <= dim(y + 1)) d2 = new Date(y + 1, m, dayN);
            date = toKey(d2);
          }
        }
      }
      const nth = t.match(/\bthe (\d{1,2})(?:st|nd|rd|th)\b/);
      if (!date && nth) {
        const n = Number(nth[1]);
        const now = new Date();
        let y = now.getFullYear(), m2 = now.getMonth();
        if (n < now.getDate()) { m2 += 1; if (m2 > 11) { m2 = 0; y += 1; } }
        const dimT = new Date(y, m2 + 1, 0).getDate();
        if (n >= 1 && n <= dimT) date = toKey(new Date(y, m2, n));
      }
    }
    return { date, time };
  }
  NB.parseWhen = parseWhen;

  /* Money, the way people actually dump it. A literal $ is the strongest signal,
     but almost nobody types one — "electric bill 142.50", "dave owes me 60 bucks",
     "rent 1200". Bare numbers are only trusted in a bill/debt sentence, and only
     once the date words are out of the way, so "due the 8th" isn't read as $8. */
  function parseAmount(seg, moneyish) {
    const num = (s) => Number(s.replace(/,/g, ''));
    const dollar = seg.match(/\$\s?([\d,]+(?:\.\d+)?)/);
    if (dollar) return num(dollar[1]);
    const worded = seg.match(/\b([\d,]+(?:\.\d+)?)\s*(?:bucks?|dollars?|quid|euros?|pounds?|usd)\b/i);
    if (worded) return num(worded[1]);
    const cents = seg.match(/\b(\d[\d,]*\.\d{2})\b/);
    if (cents) return num(cents[1]);
    if (!moneyish) return null;
    const bare = seg
      .replace(/\b(?:on|by|due)?\s*the\s+\d{1,2}(?:st|nd|rd|th)?\b/gi, ' ')
      .replace(/\b\d{1,2}(?:st|nd|rd|th)\b/gi, ' ')
      .replace(/\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}\b/gi, ' ')
      .replace(/\b\d{1,2}\s*[:.]\s*\d{2}\s*(?:am|pm)?\b/gi, ' ')
      .replace(/\b\d{1,2}\s*(?:am|pm)\b/gi, ' ')
      .match(/\b\d[\d,]*(?:\.\d+)?\b/g);
    /* one number left and nothing to confuse it with — that's the money */
    return bare && bare.length === 1 ? num(bare[0]) : null;
  }
  NB.parseAmount = parseAmount;

  function localExtract(text) {
    const segs = text
      .replace(/([.!?])\s+/g, '$1\n')                 /* sentence break — no lookbehind (iOS Safari) */
      .split(/\n+|(?:,\s*)?\b(?:also|and then|btw|oh and)\b/i)
      .map((s) => s && s.trim()).filter((s) => s && s.length > 2);

    const items = [];
    for (const seg of segs.slice(0, 12)) {
      if (items.length >= 6) break;
      const { date, time } = parseWhen(seg);
      const amount = parseAmount(seg, BILL_WORDS.test(seg) || OWE_RE.test(seg));
      const lower = seg.toLowerCase();
      const firstWord = lower.replace(/^(i |we |you |please |gotta |need to |have to |don't forget to |remember to )+/, '').split(/\s+/)[0];
      const imperative = VERBS.includes(firstWord);
      const clean = seg.replace(/^[-•*\s]+/, '').replace(/[.,;:?!\s]+$/, '');
      const title = clean.length > 64 ? clean.slice(0, 61) + '…' : clean;

      if (BDAY_RE.test(seg)) {
        const who = (seg.match(/\b([A-Z][a-z]+)(?:'s)?\s+(?:birthday|bday|b-day)/) || seg.match(/\b(mom|dad|mum|grandma|grandpa)\b/i) || [])[1] || null;
        items.push({ kind: 'person', text: who ? `${cap(who)} — birthday` : title, quote: seg, date, time: null, amount: null, confidence: who && date ? 'sure' : 'unsure', question: date ? null : 'When is it?' });
        continue;
      }
      if (OWE_RE.test(seg)) {
        /* "dave owes me 60" says which way round it goes — only ask when it doesn't. */
        const iOwe = /\b(i owe|i borrowed|i still owe|lent me|paid for me)\b/i.test(seg);
        const theyOwe = /\b(owes? (me|us)|i lent|pay me back|borrowed from me)\b/i.test(seg);
        const clear = iOwe !== theyOwe;
        items.push({ kind: 'debt', text: title, quote: seg, date: null, time: null, amount, confidence: clear ? 'sure' : 'unsure', question: clear ? null : 'Who owes whom?', dir: iOwe ? 'me' : 'they' });
        continue;
      }
      /* "insurance" is both a renewal and a bill word. With money attached it's a
         bill ("insurance 340 due the 15th"); without, it's a thing that expires. */
      if (RENEWAL_RE.test(seg) && !(amount != null && BILL_WORDS.test(seg))) {
        items.push({ kind: 'renewal', text: title, quote: seg, date, time: null, amount: null, confidence: date ? 'sure' : 'unsure', question: date ? null : 'When does it expire?' });
        continue;
      }
      if (BILL_WORDS.test(seg) && (amount || /\bdue\b/i.test(seg))) {
        let name = title.replace(/\s*\$[\d,.]+/g, '')
          .replace(/\s+(?:is\s+|was\s+)?(?:due|going up|goes up|up to|now)\b.*$/i, '')
          .replace(/^(?:the|my|our)\s+/i, '').replace(/[.,;:?!\s]+$/, '').trim();
        if (!name) name = (seg.match(BILL_WORDS) || ['bill'])[0];
        name = name[0].toUpperCase() + name.slice(1);
        items.push({ kind: 'bill', text: name, quote: seg, date, time: null, amount, confidence: amount && date ? 'sure' : 'unsure', question: amount ? (date ? null : 'When is it due?') : 'How much is it?' });
        continue;
      }
      if (HEALTH_RE.test(seg) && (date || time)) {
        items.push({ kind: 'health', text: title, quote: seg, date, time, amount: null, confidence: 'sure', question: null });
        continue;
      }
      if (GOAL_RE.test(seg)) {
        items.push({ kind: 'goal', text: title, quote: seg, date: null, time: null, amount: null, confidence: 'sure', question: null });
        continue;
      }
      if (HEDGE_RE.test(seg)) {
        if (imperative || date) items.push({ kind: 'task', text: title, quote: seg, date, time, amount, confidence: 'unsure', question: 'To-do, or just a thought?' });
        continue; // pure musing → let it stay a scrap
      }
      if (imperative || (date && seg.split(' ').length <= 10)) {
        const routine = ROUTINE_RE.test(seg);
        items.push({ kind: routine ? 'routine' : 'task', text: title, quote: seg, date, time, amount, confidence: 'sure', question: null });
        continue;
      }
      if (/\b(idea|what if|should try|would be cool)\b/i.test(seg)) {
        items.push({ kind: 'idea', text: title, quote: seg, date: null, time: null, amount: null, confidence: 'sure', question: null });
      }
      /* everything else is chatter — the librarian files nothing rather than junk */
    }
    return items;
  }
  function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }
  NB.localExtract = localExtract;

  /* ---------------- the Claude brain (BYOK, direct from browser) ---------------- */
  const EXTRACT_SCHEMA = {
    type: 'object', additionalProperties: false,
    properties: {
      items: {
        type: 'array',
        items: {
          type: 'object', additionalProperties: false,
          properties: {
            kind: { type: 'string', enum: ['task', 'routine', 'bill', 'goal', 'idea', 'person', 'renewal', 'debt', 'health'] },
            text: { type: 'string', description: 'Short imperative label for the notebook, ≤60 chars.' },
            quote: { type: 'string', description: 'The verbatim source span this came from.' },
            date: { type: ['string', 'null'], description: 'YYYY-MM-DD, or MM-DD for birthdays, or null.' },
            time: { type: ['string', 'null'], description: '24h HH:MM or null.' },
            amount: { type: ['number', 'null'] },
            dir: { type: ['string', 'null'], enum: ['they', 'me', null], description: 'debt only: they owe user, or user owes them.' },
            confidence: { type: 'string', enum: ['sure', 'unsure'] },
            question: { type: ['string', 'null'], description: 'ONE short question if unsure, else null.' },
          },
          required: ['kind', 'text', 'quote', 'date', 'time', 'amount', 'dir', 'confidence', 'question'],
        },
      },
    },
    required: ['items'],
  };

  const EXTRACT_SYSTEM = (today) => `You are the librarian of a personal notebook. The user pastes messy real life — chats, thoughts, threads. You extract ONLY genuinely actionable or file-worthy items and nothing else.

Rules, non-negotiable:
- Be conservative. Fewer, higher-confidence items. Past-tense chatter, jokes, and social filler produce NOTHING. Cap at 6 items.
- Never invent details. Every item cites the verbatim source span in "quote". Missing facts stay null — never guessed.
- Resolve relative dates against today: ${today} (${dayName(today)}). Output dates as YYYY-MM-DD. Birthdays (kind person) use MM-DD.
- kinds: task (a one-off to-do) · routine (recurring keep-up, "every sunday") · bill (money due: amount and/or due date) · goal (aspiration: "finally", "this year") · idea (someday thought, not actionable now) · person (a birthday/occasion) · renewal (passport/rego/insurance/lease expiry) · debt (who owes whom, money or favours) · health (appointment/meds — keep text plain and kind).
- Hedged or ambiguous ("idk maybe talk to Dana?") → confidence "unsure" with ONE short question ("To-do, or just a thought?"). Never confidently file a guess.
- "text" is a clean, short label in the user's own words where possible.`;

  async function claudeExtract(text) {
    const key = state.settings.apiKey;
    const body = {
      model: state.settings.model || 'claude-opus-4-8',
      max_tokens: 2000,
      output_config: { effort: 'low', format: { type: 'json_schema', schema: EXTRACT_SCHEMA } },
      system: EXTRACT_SYSTEM(todayKey()),
      messages: [{ role: 'user', content: text.slice(0, 8000) }],
    };
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error((err.error && err.error.message) || `API ${res.status}`);
    }
    const msg = await res.json();
    if (msg.stop_reason === 'refusal') throw new Error('The librarian declined that one.');
    const textBlock = (msg.content || []).find((b) => b.type === 'text');
    if (!textBlock || !textBlock.text) throw new Error('Empty reply — try a shorter dump.');
    let parsed;
    try { parsed = JSON.parse(textBlock.text); } catch (e) { throw new Error('Couldn\'t read the reply — try again.'); }
    return (parsed.items || []).slice(0, 6);
  }

  /* One front door: Claude if a key is set, the local brain otherwise (or on failure). */
  async function extract(text) {
    if (state.settings.apiKey) {
      try {
        const items = await claudeExtract(text);
        return { items, brain: 'claude' };
      } catch (e) {
        return { items: localExtract(text), brain: 'local', note: e.message };
      }
    }
    return { items: localExtract(text), brain: 'local' };
  }
  NB.extract = extract;

  /* File extraction results into real notebook items. Returns {filed:[], parked:[]} */
  function fileExtraction(raw, via) {
    const filed = [], parked = [];
    const today = todayKey();
    for (const r of raw) {
      const src = { quote: r.quote || '', at: new Date().toISOString(), via: via || 'paste' };
      const unsure = r.confidence === 'unsure';
      let it = null;
      const norm = (d) => (d && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : null);

      if (r.kind === 'bill') {
        const due = norm(r.date);
        it = addItem({
          kind: 'bill', text: r.text, ink: !unsure && r.amount != null, source: src, bucket: 'day', date: null,
          bill: { amount: r.amount, estimated: r.amount == null || unsure, dueDay: due ? Number(due.slice(8)) : null, autopay: false, cadence: 'monthly', paid: {} },
        });
      } else if (r.kind === 'person') {
        const bd = r.date && /^\d{2}-\d{2}$/.test(r.date) ? r.date : (norm(r.date) ? r.date.slice(5) : null);
        it = addItem({ kind: 'person', text: r.text, ink: !unsure, source: src, bucket: 'day', person: { birthday: bd, notes: [] } });
      } else if (r.kind === 'renewal') {
        it = addItem({ kind: 'renewal', text: r.text, ink: !unsure, source: src, bucket: 'day', renewal: { expires: norm(r.date) } });
      } else if (r.kind === 'debt') {
        it = addItem({ kind: 'debt', text: r.text, ink: !unsure, source: src, bucket: 'day', debt: { dir: r.dir === 'me' ? 'me' : 'they', amount: r.amount || null } });
      } else if (r.kind === 'goal') {
        it = addItem({ kind: 'goal', text: r.text, ink: !unsure, source: src, bucket: 'goals' });
      } else if (r.kind === 'idea') {
        it = addItem({ kind: 'idea', text: r.text, ink: !unsure, source: src, bucket: 'ideas' });
      } else if (r.kind === 'health') {
        it = addItem({ kind: 'health', text: r.text, ink: !unsure, source: src, bucket: 'day', date: norm(r.date), time: r.time || null });
      } else if (r.kind === 'routine') {
        it = addItem({ kind: 'routine', text: r.text.replace(ROUTINE_RE, '').trim() || r.text, ink: !unsure, source: src, bucket: 'day' });
      } else {
        const d = norm(r.date);
        it = addItem({
          kind: 'task', text: r.text, ink: !unsure, source: src,
          bucket: d ? 'day' : 'week', date: d || null, time: r.time || null,
        });
        if (d && d < today) { it.date = today; }
      }

      if (unsure) {
        it.ink = false;
        it.question = { q: r.question || 'File this — or let it go?', options: defaultQuestionOptions(it) };
        parked.push(it);
      } else {
        filed.push(it);
      }
    }
    save();
    return { filed, parked };
  }
  function defaultQuestionOptions(it) {
    if (it.kind === 'task') return [
      { label: 'to-do', act: 'keep' }, { label: 'just a thought', act: 'idea' }, { label: 'toss', act: 'toss' },
    ];
    if (it.kind === 'debt') return [
      { label: 'they owe me', act: 'owe-they' }, { label: 'I owe them', act: 'owe-me' }, { label: 'toss', act: 'toss' },
    ];
    return [{ label: 'keep it', act: 'keep' }, { label: 'toss', act: 'toss' }];
  }
  NB.fileExtraction = fileExtraction;

  /* Answer a parked sticky. */
  function answerQuestion(id, act) {
    const it = getItem(id); if (!it) return;
    withUndo(actLabel(act), () => {
      it.question = null;
      if (act === 'keep') { it.ink = true; it.carried = 0; if (it.kind === 'task' && !it.date && it.bucket === 'day') it.date = todayKey(); }
      else if (act === 'idea') { it.kind = 'idea'; it.bucket = 'ideas'; it.ink = true; it.date = null; }
      else if (act === 'someday') { it.bucket = 'someday'; it.ink = true; it.date = null; it.carried = 0; }
      else if (act === 'owe-they') { it.ink = true; if (it.debt) it.debt.dir = 'they'; }
      else if (act === 'owe-me') { it.ink = true; if (it.debt) it.debt.dir = 'me'; }
      else if (act === 'toss') { removeItem(it.id); }
    });
  }
  function actLabel(act) {
    return {
      keep: 'Kept — inked in.', idea: 'Filed to Ideas.', someday: 'Resting in Later.',
      'owe-they': 'Noted — they owe you.', 'owe-me': 'Noted — you owe them.',
      toss: 'Tossed. (30 days in the drawer, in spirit.)',
    }[act] || 'Done.';
  }
  NB.answerQuestion = answerQuestion;

  /* ---------------- the morning brief (ladder + wit budget) ---------------- */
  function brief() {
    const today = todayKey();
    const d = dayItems(today);
    const openCount = d.timed.length + d.tasks.length + d.carried.length;

    /* line 1 — the shape of the day */
    let l1;
    const timedN = d.timed.length;
    if (openCount === 0) l1 = pick([
      'The page is blank and I refuse to apologise for it.',
      'Nothing on the page. Suspicious, but I\'ll allow it.',
      'A clean spread. Do something nice with it.',
    ]);
    else if (openCount <= 2) l1 = pick([
      `Just ${openCount === 1 ? 'one thing' : 'two things'} today. Small day — that's allowed.`,
      `${cap(numWord(openCount))} ${openCount === 1 ? 'thing' : 'things'} today, and the rest is yours.`,
    ]);
    else l1 = pick([
      `${cap(numWord(openCount))} things today${timedN ? `, ${numWord(timedN)} with ${timedN === 1 ? 'a clock' : 'clocks'} on ${timedN === 1 ? 'it' : 'them'}` : ''}.`,
      `A full page: ${numWord(openCount)} things${timedN ? `, first clock at ${fmtTime(d.timed[0].time)}` : ''}.`,
    ]);

    /* line 2 — THE heads-up, by the ladder. Wit OFF here. */
    let l2 = null;
    const cycle = billCycleKey();
    const healthSoon = state.items.find((i) => i.kind === 'health' && !i.done && i.date && daysUntil(i.date) >= 0 && daysUntil(i.date) <= 1);
    const billSoon = state.items
      .filter((i) => i.kind === 'bill' && i.bill && !i.bill.autopay && !billPaid(i, cycle) && i.bill.dueDay)
      .map((i) => ({ i, du: daysUntil(billDueDate(i)) }))
      .filter((x) => x.du <= 3).sort((a, b) => a.du - b.du)[0];
    const bdaySoon = state.items
      .filter((i) => i.kind === 'person' && i.person && i.person.birthday)
      .map((i) => ({ i, du: bdayDaysAway(i.person.birthday) }))
      .filter((x) => x.du >= 0 && x.du <= 7).sort((a, b) => a.du - b.du)[0];
    const renewalSoon = state.items
      .filter((i) => i.kind === 'renewal' && i.renewal && i.renewal.expires)
      .map((i) => ({ i, du: daysUntil(i.renewal.expires) }))
      .filter((x) => x.du >= 0 && x.du <= 42).sort((a, b) => a.du - b.du)[0];

    if (healthSoon) l2 = `${healthSoon.text} — ${daysUntil(healthSoon.date) === 0 ? 'today' : 'tomorrow'}${healthSoon.time ? ` at ${fmtTime(healthSoon.time)}` : ''}.`;
    else if (billSoon) l2 = `${billSoon.i.text}${billSoon.i.bill.amount ? `, $${fmtAmt(billSoon.i.bill.amount)}` : ''}, ${dueWord(billSoon.du)} — not on autopay, so it needs you.`;
    else if (bdaySoon) l2 = `${bdaySoon.i.text} ${bdaySoon.du === 0 ? 'is today.' : bdaySoon.du === 1 ? 'is tomorrow.' : `in ${bdaySoon.du} days — enough runway to plan something.`}`;
    else if (renewalSoon) l2 = `${renewalSoon.i.text} — ${renewalSoon.du} days out. Time to start.`;
    else if (d.timed[0]) l2 = `First up: ${d.timed[0].text} at ${fmtTime(d.timed[0].time)}.`;
    else l2 = 'Nothing is due. I checked twice.';

    /* line 3 — one gentle nudge */
    let l3 = null;
    const goal = state.items.find((i) => i.kind === 'goal' && !i.done);
    const carriedOne = d.carried[0];
    const debtOwed = state.items.find((i) => i.kind === 'debt' && !i.done && i.debt && i.debt.dir === 'they');
    const idea = state.items.find((i) => i.kind === 'idea' && !i.done);
    const dayN = fromKey(today).getDate();
    const rot = dayN % 4;
    if (rot === 0 && goal) l3 = pick([`"${goal.text}" is still on the horizon. One small move counts.`, `The ${goal.text.toLowerCase()} page is patient, not gone.`]);
    else if (rot === 1 && carriedOne) l3 = `"${carriedOne.text}" came along again. No judgement — just noticing.`;
    else if (rot === 2 && debtOwed) l3 = `${debtOwed.text} — a nudge isn't rude, it's bookkeeping.`;
    else if (idea) l3 = pick([`"${idea.text}" has been sitting in Ideas, whistling innocently.`, `Ideas holds "${idea.text}" whenever you're ready.`]);
    else if (goal) l3 = `"${goal.text}" is still on the horizon. One small move counts.`;
    else l3 = pick(['Tick something and watch it arrive in Done, proud.', 'The dump box is open all day. I\'ll sort.']);

    return { l1, l2, l3 };
  }
  function bdayDaysAway(mmdd) {
    const today = fromKey(todayKey());
    const mo = Number(mmdd.slice(0, 2)) - 1, da = Number(mmdd.slice(3));
    const mk = (yy) => { const dim = new Date(yy, mo + 1, 0).getDate(); return new Date(yy, mo, Math.min(da, dim)); };
    let d = mk(today.getFullYear());
    if (d < today) d = mk(today.getFullYear() + 1);
    return Math.round((d - today) / DAY);
  }
  function dueWord(du) { return du < 0 ? 'still open' : du === 0 ? 'due today' : du === 1 ? 'due tomorrow' : `due in ${du} days`; }
  function fmtTime(t) {
    if (!t) return '';
    let [h, m] = t.split(':').map(Number);
    const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
    return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`;
  }
  function fmtAmt(n) { return Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function numWord(n) { return ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'][n] || String(n); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  NB.brief = brief; NB.fmtTime = fmtTime; NB.fmtAmt = fmtAmt; NB.bdayDaysAway = bdayDaysAway;

  /* ---------------- flip to… (search) ---------------- */
  function search(q) {
    const needle = q.trim().toLowerCase();
    if (!needle) return [];
    const scored = [];
    for (const it of state.items) {
      const hay = `${it.text} ${(it.source && it.source.quote) || ''}`.toLowerCase();
      if (hay.includes(needle)) scored.push(it);
    }
    return scored.slice(0, 12);
  }
  NB.search = search;

  /* ---------------- the Desk (ask the book) ---------------- */
  function notebookDigest() {
    const cyc = billCycleKey();
    const compact = state.items.filter((i) => !i.sample).map((i) => {
      const o = { kind: i.kind, text: i.text };
      if (i.date) o.date = i.date;
      if (i.time) o.time = i.time;
      if (i.done) o.done = true;
      if (i.bucket && !['day'].includes(i.bucket)) o.where = i.bucket;
      if (i.bill) { o.amount = i.bill.amount; o.dueDay = i.bill.dueDay; o.autopay = i.bill.autopay; o.paidThisMonth = billPaid(i, cyc); }
      if (i.person) o.birthday = i.person.birthday;
      if (i.renewal) o.expires = i.renewal.expires;
      if (i.debt) o.direction = i.debt.dir === 'they' ? 'they owe user' : 'user owes them';
      return o;
    });
    return JSON.stringify(compact);
  }

  async function askDesk(question) {
    const matches = search(question);
    if (!state.settings.apiKey) {
      return {
        reply: matches.length ? 'Here\'s what the book has on that.' : 'Nothing in the book about that. (Give me a Claude key in the flyleaf and I\'ll get chattier.)',
        matches, brain: 'local',
      };
    }
    const body = {
      model: state.settings.model || 'claude-opus-4-8',
      max_tokens: 300,
      system: `You are the librarian of the user's personal notebook — sharp, dry, warm underneath. Answer in AT MOST two short sentences, first person. Wit lands on things, never the user; go plain and kind on health, money stress, or anything missed. Today is ${todayKey()} (${dayName(todayKey())}). Answer ONLY from the notebook JSON below; if it isn't in the book, say so plainly. Never invent dates or amounts.\n\nNOTEBOOK: ${notebookDigest()}`,
      messages: [{ role: 'user', content: question.slice(0, 500) }],
    };
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': state.settings.apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify(body),
      });
      if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error((err.error && err.error.message) || `API ${res.status}`); }
      const msg = await res.json();
      const textBlock = (msg.content || []).find((b) => b.type === 'text');
      return { reply: (textBlock && textBlock.text) || '…', matches, brain: 'claude' };
    } catch (e) {
      return { reply: `I couldn't get to the shelves just now (${e.message}). Nothing was lost — try me again in a moment.`, matches, brain: 'local' };
    }
  }
  NB.askDesk = askDesk;

  /* ---------------- export / import ---------------- */
  /* Export never carries the API key — it stays on this device. */
  NB.exportJSON = () => JSON.stringify({ ...state, settings: { ...state.settings, apiKey: '' } }, null, 2);
  NB.importJSON = (raw) => {
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.items)) throw new Error('That doesn\'t look like a notebook.');
    /* Regenerate ids and vet option acts — an imported file is untrusted input. */
    parsed.items.forEach((it) => {
      it.id = uid();
      if (it.question && Array.isArray(it.question.options)) {
        it.question.options = it.question.options
          .filter((o) => o && typeof o.act === 'string' && /^[a-z-]{1,20}$/.test(o.act))
          .map((o) => ({ label: String(o.label || o.act).slice(0, 40), act: o.act }));
      }
    });
    const base = DEFAULT_STATE();
    state = { ...base, ...parsed, settings: { ...base.settings, ...(parsed.settings || {}), apiKey: state.settings.apiKey } };
    undoSnap = null;
    save();
  };

  /* ---------------- first-run seed (watermarked, self-erasing) ---------------- */
  function seed() {
    if (state.meta.seeded || state.items.length) return;
    state.meta.seeded = true;
    const t = todayKey();
    const mk = (p) => addItem({ ...p, sample: true });
    mk({ kind: 'task', text: 'Tick me — I\'m a sample', date: t, bucket: 'day', source: { quote: 'Page one, written in the librarian\'s hand.', at: new Date().toISOString(), via: 'librarian' } });
    mk({ kind: 'task', text: 'Paste a conversation. Watch it sort itself.', date: t, bucket: 'day', source: { quote: 'Try the ＋ dump button.', at: new Date().toISOString(), via: 'librarian' } });
    mk({ kind: 'bill', text: 'Sample bill — rent', bucket: 'day', bill: { amount: 1200, estimated: false, dueDay: 1, autopay: false, cadence: 'monthly', paid: {} }, source: { quote: 'Bills live in the Back Pages.', at: new Date().toISOString(), via: 'librarian' } });
    mk({ kind: 'goal', text: 'A sample goal — replace me with a real one', bucket: 'goals', source: { quote: 'Goals get a page of their own.', at: new Date().toISOString(), via: 'librarian' } });
    save();
  }
  NB.seed = seed;
})();

</script>
<script>
/* =========================================================================
   My Notebook — ui.js
   Everything you see: the week spread, Today, the sort, the Back Pages,
   the Desk, and the flyleaf. Renders from NB (core.js).
   ========================================================================= */
(function () {
  'use strict';
  const $ = (sel, el) => (el || document).querySelector(sel);
  const D = NB.dates;

  /* ---------------- ui state ---------------- */
  let view = 'today';                 /* today | week | goals | ideas | done | back */
  let backTab = 'bills';              /* bills | people | renewals | owed | health */
  let expandedId = null;
  let whisperTimer = null;

  /* ---------------- helpers ---------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function ord(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

  /* ---------------- theme ---------------- */
  function applyTheme() {
    const s = NB.state().settings;
    const auto = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
    document.documentElement.dataset.theme = s.theme === 'auto' ? auto : s.theme;
    document.body.classList.toggle('plain-hand', !!s.plainHand);
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  /* ---------------- whisper (6s undo) ---------------- */
  NB.onWhisper = (label) => {
    const w = $('#whisper');
    w.hidden = false;
    w.innerHTML = `<span class="hand">${esc(label)}</span><button class="undo-btn" data-act="undo" type="button">undo</button><span class="undo-bar"><span class="undo-fill"></span></span>`;
    requestAnimationFrame(() => { const f = $('.undo-fill', w); if (f) f.style.width = '0%'; });
    clearTimeout(whisperTimer);
    whisperTimer = setTimeout(() => { w.hidden = true; }, 6000);
  };
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-act="undo"]')) {
      if (NB.undo()) { $('#whisper').hidden = true; render(); }
    }
  });

  /* ---------------- tabs ---------------- */
  const TABS = [
    { id: 'today', label: 'Today', wash: 't-today' },
    { id: 'week', label: 'Week', wash: 't-week' },
    { id: 'goals', label: 'Goals', wash: 't-goals' },
    { id: 'ideas', label: 'Ideas', wash: 't-ideas' },
    { id: 'done', label: 'Done', wash: 't-done' },
    { id: 'back', label: 'Back Pages', wash: 't-back' },
  ];
  function renderTabs() {
    const dot = NB.itemsFor((i) => i.question && ['bill', 'person', 'renewal', 'debt', 'health'].includes(i.kind)).length > 0;
    $('#tabs').innerHTML = TABS.map((t) =>
      `<button type="button" class="tab ${t.wash} ${view === t.id ? 'on' : ''} ${t.id === 'back' ? 'kraft' : ''}" data-view="${t.id}">${t.label}${t.id === 'back' && dot ? '<span class="tab-dot"></span>' : ''}</button>`
    ).join('');
  }

  /* ---------------- item rows ---------------- */
  function rowHTML(it, opts) {
    opts = opts || {};
    const open = expandedId === it.id;
    const pencil = !it.ink ? 'pencil' : '';
    const sample = it.sample ? 'sample' : '';
    const carried = it.carried > 0 ? `<span class="carry" title="carried ${it.carried}×">↪</span>` : '';
    const time = it.time ? `<span class="timechip fig">${esc(NB.fmtTime(it.time))}</span>` : '';
    const money = it.bill && it.bill.amount != null ? `<span class="moneytag fig">$${esc(NB.fmtAmt(it.bill.amount))}</span>` : '';
    const glyph = { goal: '★ ', idea: '✎ ', routine: '⟲ ' }[it.kind] || '';
    const tickCls = it.done ? 'checked' : '';
    return `
    <div class="row ${pencil} ${sample} ${it.done ? 'is-done' : ''}" data-id="${it.id}">
      <div class="row-main">
        ${carried}
        <button class="tick ${tickCls}" data-act="tick" type="button" aria-label="tick">${it.done ? '✓' : ''}</button>
        ${time}
        <span class="row-text hand" data-act="open">${glyph}${esc(it.text)}</span>
        ${money}
        ${it.sample ? '<span class="sampletag">sample</span>' : ''}
      </div>
      ${it.question ? stickyHTML(it) : ''}
      ${open ? detailHTML(it) : ''}
    </div>`;
  }

  function stickyHTML(it) {
    return `
    <div class="sticky" data-id="${it.id}">
      <div class="sticky-q hand">${esc(it.question.q)}</div>
      <div class="sticky-chips">
        ${it.question.options.map((o) => `<button type="button" class="chip" data-act="answer" data-answer="${o.act}">${esc(o.label)}</button>`).join('')}
      </div>
    </div>`;
  }

  function detailHTML(it) {
    const src = it.source;
    const viaGlyph = { paste: '⌨', share: '📱', librarian: '✒︎', manual: '✎' }[src && src.via] || '⌨';
    const receipt = src && src.quote
      ? `<div class="receipt fig">${viaGlyph} ${src.via === 'librarian' ? '' : 'you wrote: '}<span class="q hand">“${esc(src.quote)}”</span></div>`
      : `<div class="receipt fig">✎ added by hand</div>`;
    const when = ['task', 'scrap', 'health'].includes(it.kind) ? `
      <div class="whenpill">
        <span class="when-label fig">When?</span>
        ${['Today', 'Tomorrow', 'This week', 'Next week', 'Someday'].map((w) => `<button type="button" class="chip" data-act="when" data-when="${w}">${w}</button>`).join('')}
      </div>` : '';
    const billBits = it.kind === 'bill' && it.bill ? `
      <div class="bill-edit fig">
        <label>amount $<input data-edit="amount" type="number" step="0.01" value="${it.bill.amount != null ? it.bill.amount : ''}" placeholder="?"></label>
        <label>due day <input data-edit="dueDay" type="number" min="1" max="31" value="${it.bill.dueDay || ''}" placeholder="?"></label>
        <label class="autolabel"><input data-edit="autopay" type="checkbox" ${it.bill.autopay ? 'checked' : ''}> autopay</label>
      </div>` : '';
    const bdayBits = it.kind === 'person' && it.person ? `
      <div class="bill-edit fig"><label>birthday (MM-DD) <input data-edit="birthday" value="${esc(it.person.birthday || '')}" placeholder="03-14"></label></div>` : '';
    const renewalBits = it.kind === 'renewal' && it.renewal ? `
      <div class="bill-edit fig"><label>expires <input data-edit="expires" type="date" value="${esc(it.renewal.expires || '')}"></label></div>` : '';
    return `
    <div class="detail">
      ${receipt}
      <div class="edit-line"><input class="edit-text hand" data-edit="text" value="${esc(it.text)}" aria-label="Edit text"></div>
      ${billBits}${bdayBits}${renewalBits}
      ${when}
      <div class="detail-acts fig">
        <button type="button" class="linky" data-act="toss">toss</button>
        ${it.done ? '<button type="button" class="linky" data-act="restore">restore</button>' : ''}
      </div>
    </div>`;
  }

  /* ---------------- views ---------------- */
  function pageTitle(t, sub) {
    return `<div class="pagehead"><h1 class="pagetitle">${t}<span class="underline"></span></h1>${sub ? `<span class="pagesub fig">${sub}</span>` : ''}</div>`;
  }

  function todayView() {
    const t = D.todayKey();
    const d = NB.dayItems(t);
    const meta = NB.state().meta;
    const folded = meta.briefFoldedFor === t;
    const b = NB.brief();
    const routines = NB.itemsFor((i) => i.kind === 'routine');
    const parked = NB.itemsFor((i) => i.question && ['task', 'scrap', 'idea', 'goal'].includes(i.kind)
      && !((i.kind === 'task' || i.kind === 'scrap') && i.bucket === 'day' && i.date === t));

    const brief = folded
      ? `<button type="button" class="brief-fold hand" data-act="unfold">✳ this morning</button>`
      : `<div class="brief">
          <span class="brief-date fig">${esc(D.niceDate(t))}</span>
          <p class="hand">${esc(b.l1)}</p>
          <p class="hand plain">${esc(b.l2)}</p>
          <p class="hand">${esc(b.l3)}</p>
          <span class="flourish">✳</span>
          <button type="button" class="brief-x fig" data-act="fold" aria-label="fold the note">fold</button>
        </div>`;

    const echoes = d.echoes.map(echoHTML).join('');
    return `
      ${pageTitle('Today', esc(D.dayName(t)) )}
      ${brief}
      <div class="rows">
        ${d.timed.map((i) => rowHTML(i)).join('')}
        ${echoes}
        ${d.tasks.map((i) => rowHTML(i)).join('')}
        ${d.carried.map((i) => rowHTML(i)).join('')}
      </div>
      ${d.timed.length + d.tasks.length + d.carried.length + d.echoes.length === 0 ? emptyLine('Nothing on the page. Dump something — I\'ll sort it.') : ''}
      ${routines.length ? `<div class="routines"><span class="r-label fig">keeping up</span>${routines.map((r) => `<button type="button" class="rchip hand ${r.done ? 'rdone' : ''}" data-id="${r.id}" data-act="tick">${r.done ? '●' : '○'} ${esc(r.text)}</button>`).join('')}</div>` : ''}
      ${parked.length ? `<div class="tray"><span class="tray-label hand">✎ a quick word?</span>${parked.map((i) => rowHTML(i)).join('')}</div>` : ''}
    `;
  }

  function echoHTML(e) {
    const it = e.item;
    const cls = { bill: 'e-bill', bday: 'e-bday', renewal: 'e-renewal', health: 'e-health' }[e.echo];
    const tick = e.echo === 'bill' ? `<button class="tick small" data-act="paybill" type="button" aria-label="mark paid"></button>`
      : e.echo === 'health' ? `<button class="tick small" data-act="tick" type="button"></button>` : '';
    const label = e.echo === 'bday' ? `☼ ${esc(it.text)}` : esc(it.text);
    const amt = it.bill && it.bill.amount != null ? `<span class="fig e-amt">· $${NB.fmtAmt(it.bill.amount)}</span>` : '';
    const auto = it.bill && it.bill.autopay ? `<span class="autotag fig">auto</span>` : '';
    return `<div class="echo ${cls}" data-id="${it.id}">${tick}<span class="hand e-text" data-act="goback">${label}</span>${amt}${auto}<span class="dogear" title="lives in the Back Pages" data-act="goback"></span></div>`;
  }

  function weekView() {
    const t = D.todayKey();
    const week = D.weekOf(t);
    const weekBand = NB.itemsFor((i) => !i.done && i.bucket === 'week');
    const later = NB.itemsFor((i) => !i.done && i.bucket === 'someday');
    const upcoming = NB.itemsFor((i) => !i.done && (i.kind === 'task' || i.kind === 'scrap') && i.bucket === 'day' && i.date && i.date > week[6]);
    const cols = week.map((key) => {
      const d = NB.dayItems(key);
      const isToday = key === t;
      const isPast = key < t;
      const all = [...d.timed, ...d.echoes.map((e) => e), ...d.tasks, ...d.carried];
      const rows = [
        ...d.timed.map((i) => rowHTML(i)),
        ...d.echoes.map(echoHTML),
        ...d.tasks.map((i) => rowHTML(i)),
        ...d.carried.map((i) => rowHTML(i)),
      ].join('');
      return `
      <section class="day ${isToday ? 'is-today' : ''} ${isPast ? 'is-past' : ''}">
        <header class="dayhead"><span class="dayname fig">${esc(D.dayName(key, true))}</span>${isToday ? '<span class="todaytag fig">today</span>' : ''}<span class="daynum hand">${Number(key.slice(8))}</span></header>
        <div class="rows small">${rows || '<div class="dayempty"></div>'}</div>
        <button type="button" class="addday fig" data-act="addday" data-date="${key}">+</button>
      </section>`;
    }).join('');

    return `
      ${pageTitle('This Week', `${esc(D.niceDate(week[0]))} – ${esc(D.niceDate(week[6]))}`)}
      <div class="weekscroll"><div class="week">${cols}</div></div>
      ${weekBand.length ? `<div class="band"><span class="band-label fig">this week, no day yet</span><div class="rows">${weekBand.map((i) => rowHTML(i)).join('')}</div></div>` : ''}
      ${upcoming.length ? `<div class="band"><span class="band-label fig">next up</span><div class="rows">${upcoming.sort((a, b) => (a.date || '').localeCompare(b.date || '')).map((i) => `<div class="row" data-id="${i.id}"><div class="row-main"><button class="tick" data-act="tick" type="button" aria-label="tick"></button><span class="row-text hand" data-act="open">${esc(i.text)}</span><span class="bwhen fig">${esc(D.niceDate(i.date))}</span></div></div>`).join('')}</div></div>` : ''}
      ${later.length ? `<div class="band later"><span class="band-label fig">later</span><div class="rows">${later.map((i) => rowHTML(i)).join('')}</div></div>` : ''}
    `;
  }

  function goalsView() {
    const goals = NB.itemsFor((i) => i.kind === 'goal' && !i.done);
    const doneGoals = NB.itemsFor((i) => i.kind === 'goal' && i.done);
    return `
      ${pageTitle('Goals', 'the long horizon')}
      <div class="rows">${goals.map((i) => rowHTML(i)).join('')}</div>
      ${goals.length === 0 ? emptyLine('No goals on the page yet. Dump one — "finally do X this year" is my cue.') : ''}
      ${doneGoals.length ? `<div class="band"><span class="band-label fig">reached</span><div class="rows">${doneGoals.map((i) => rowHTML(i)).join('')}</div></div>` : ''}
    `;
  }

  function ideasView() {
    const ideas = NB.itemsFor((i) => (i.kind === 'idea' || i.kind === 'scrap') && !i.done);
    return `
      ${pageTitle('Ideas', 'the loose-pages pocket')}
      <div class="rows">${ideas.map((i) => rowHTML(i)).join('')}</div>
      ${ideas.length === 0 ? emptyLine('Empty pocket. Half-thoughts land here — no dates, no pressure.') : ''}
    `;
  }

  function doneView() {
    const done = NB.itemsFor((i) => i.done && i.kind !== 'routine').sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
    const groups = {};
    for (const it of done) {
      const k = it.doneKey || (it.doneAt || '').slice(0, 10) || 'earlier';
      (groups[k] = groups[k] || []).push(it);
    }
    const keys = Object.keys(groups).sort().reverse();
    return `
      ${pageTitle('Done', 'look what you did')}
      ${keys.map((k) => `
        <div class="doneday">
          <span class="band-label fig">${k === D.todayKey() ? 'today' : esc(k)}</span>
          <div class="rows">${groups[k].map((i) => rowHTML(i)).join('')}</div>
        </div>`).join('')}
      ${done.length === 0 ? emptyLine('Nothing finished yet — that\'s the point. Tick something and watch it arrive here, proud.') : ''}
    `;
  }

  /* ---------------- back pages ---------------- */
  const BACK_TABS = [
    { id: 'bills', label: 'Bills' }, { id: 'people', label: 'People' }, { id: 'renewals', label: 'Renewals' },
    { id: 'owed', label: 'Owed' }, { id: 'health', label: 'Health' },
  ];
  function backView() {
    const sub = BACK_TABS.map((b) => `<button type="button" class="bthumb b-${b.id} ${backTab === b.id ? 'on' : ''}" data-backtab="${b.id}">${b.label}</button>`).join('');
    const body = { bills: billsPage, people: peoplePage, renewals: renewalsPage, owed: owedPage, health: healthPage }[backTab]();
    return `<div class="backwrap"><div class="bthumbs">${sub}</div><div class="backpage bp-${backTab}">${body}</div></div>`;
  }

  function billsPage() {
    const cyc = NB.billCycleKey();
    const bills = NB.itemsFor((i) => i.kind === 'bill' && i.bill);
    const withAmt = bills.filter((b) => b.bill.amount != null);
    const total = withAmt.reduce((s, b) => s + b.bill.amount, 0);
    const paid = withAmt.filter((b) => NB.billPaid(b, cyc)).reduce((s, b) => s + b.bill.amount, 0);
    const coming = total - paid;
    const needsHand = withAmt.filter((b) => !NB.billPaid(b, cyc) && !b.bill.autopay).reduce((s, b) => s + b.bill.amount, 0);
    const auto = coming - needsHand;
    const pct = total > 0 ? Math.round((paid / total) * 100) : 0;
    const unpaid = bills.filter((b) => !NB.billPaid(b, cyc));
    const next = unpaid.filter((b) => b.bill.dueDay).sort((a, b) => D.daysUntil(NB.billDueDate(a)) - D.daysUntil(NB.billDueDate(b)))[0];
    const paidRows = bills.filter((b) => NB.billPaid(b, cyc));

    const row = (b) => {
      const due = b.bill.dueDay ? NB.billDueDate(b) : null;
      const du = due ? D.daysUntil(due) : null;
      const open = expandedId === b.id;
      const amber = du != null && du <= 0 ? 'due-now' : du != null && du <= 3 ? 'due-soon' : '';
      const dueTxt = due ? (du < 0 ? `was due ${esc(D.dayName(due, true))} — still open` : du === 0 ? 'due today' : `${esc(D.dayName(due, true))} ${Number(due.slice(8))}`) : '—';
      return `
      <div class="brow ${amber} ${b.bill.autopay ? 'is-auto' : ''} ${!b.ink ? 'pencil' : ''}" data-id="${b.id}">
        <div class="row-main">
          ${du != null && du <= 0 && !b.bill.autopay ? '<span class="flag">⚑</span>' : ''}
          <button class="tick" data-act="paybill" type="button" aria-label="mark paid"></button>
          <span class="row-text hand" data-act="open">${esc(b.text)}${b.bill.autopay ? '<span class="autotag fig">AUTOPAY</span>' : ''}${b.sample ? '<span class="sampletag">sample</span>' : ''}</span>
          <span class="bamt fig ${b.bill.estimated ? 'est' : ''}">${b.bill.amount != null ? (b.bill.estimated ? '~' : '') + '$' + NB.fmtAmt(b.bill.amount) : '$?'}</span>
        </div>
        ${due ? `<div class="bmeta"><span class="bwhen fig">${dueTxt}</span></div>` : ''}
        ${b.question ? stickyHTML(b) : ''}
        ${open ? detailHTML(b) : ''}
      </div>`;
    };

    return `
      ${pageTitle('Bills', new Date().toLocaleDateString('en-US', { month: 'long' }))}
      <div class="money">
        <div class="money-line fig">
          <div class="mfig"><span class="n">$${NB.fmtAmt(total)}</span><span class="l">due this month</span></div>
          <div class="mfig paid"><span class="n">$${NB.fmtAmt(paid)}</span><span class="l">paid</span></div>
          <div class="mfig"><span class="n">$${NB.fmtAmt(coming)}</span><span class="l">still coming</span></div>
        </div>
        <div class="prog"><span class="ink" style="width:${pct}%"></span></div>
        ${coming > 0 ? `<div class="money-sub hand"><span class="fig">$${NB.fmtAmt(needsHand)}</span> needs your hand · <span class="fig">$${NB.fmtAmt(auto)}</span> handles itself.</div>` : `<div class="money-sub hand">All settled. The ledger and I are both relaxed.</div>`}
        ${next ? `<div class="nextup hand">Next up: ${esc(next.text.toLowerCase())}, ${esc(D.dayName(NB.billDueDate(next)))}.</div>` : ''}
      </div>
      <div class="band-label fig">still coming</div>
      <div class="rows">${unpaid.sort((a, b) => (a.bill.dueDay || 99) - (b.bill.dueDay || 99)).map(row).join('') || emptyLine('No bills on the ledger. Either you\'re very lucky, or they\'re hiding — jot one below.')}</div>
      ${paidRows.length ? `<div class="band-label fig" style="margin-top:14px">handled</div><div class="rows handled">${paidRows.map(row).join('')}</div>` : ''}
      <form class="addform fig" data-form="bill">
        <input name="name" placeholder="add a bill — name" required>
        <input name="amount" type="number" step="0.01" placeholder="$">
        <input name="day" type="number" min="1" max="31" placeholder="day">
        <label class="autolabel"><input name="autopay" type="checkbox"> auto</label>
        <button type="submit" class="chip">rule the line</button>
      </form>
    `;
  }

  function peoplePage() {
    const people = NB.itemsFor((i) => i.kind === 'person');
    const row = (p) => {
      const bd = p.person && p.person.birthday;
      const du = bd ? NB.bdayDaysAway(bd) : null;
      return `
      <div class="brow ${!p.ink ? 'pencil' : ''}" data-id="${p.id}">
        <div class="row-main">
          <span class="monogram hand">${esc((p.text || '?')[0].toUpperCase())}</span>
          <span class="row-text hand" data-act="open">${esc(p.text)}</span>
          <span class="bwhen fig">${bd ? (du === 0 ? '☼ today' : `in ${du} day${du === 1 ? '' : 's'}`) : '—'}</span>
        </div>
        ${p.question ? stickyHTML(p) : ''}
        ${expandedId === p.id ? detailHTML(p) : ''}
      </div>`;
    };
    return `
      ${pageTitle('People & Birthdays', 'everyone you\'d hate to forget')}
      <div class="rows">${people.sort((a, b) => (a.person && a.person.birthday ? NB.bdayDaysAway(a.person.birthday) : 999) - (b.person && b.person.birthday ? NB.bdayDaysAway(b.person.birthday) : 999)).map(row).join('') || emptyLine('Nobody back here yet. Mention a human in a dump and I\'ll start a card.')}</div>
      <form class="addform fig" data-form="person">
        <input name="name" placeholder="add someone — name" required>
        <input name="bday" placeholder="MM-DD">
        <button type="submit" class="chip">add</button>
      </form>
    `;
  }

  function renewalsPage() {
    const rs = NB.itemsFor((i) => i.kind === 'renewal' && !i.done);
    const row = (r) => {
      const ex = r.renewal && r.renewal.expires;
      const du = ex ? D.daysUntil(ex) : null;
      const stateTxt = du == null ? 'no date yet' : du <= 0 ? 'expired — on your week now' : du <= 42 ? `${du} days — time to start` : `quiet 'til ${esc(D.niceDate(D.addDays(ex, -42)))}`;
      return `
      <div class="brow ${du != null && du <= 42 ? 'due-soon' : ''} ${!r.ink ? 'pencil' : ''}" data-id="${r.id}">
        <div class="row-main">
          <button class="tick" data-act="tick" type="button" aria-label="handled"></button>
          <span class="row-text hand" data-act="open">${esc(r.text)}</span>
          <span class="bwhen fig">${ex ? esc(D.niceDate(ex)) : ''}</span>
        </div>
        <div class="whisperline hand">${stateTxt}</div>
        ${r.question ? stickyHTML(r) : ''}
        ${expandedId === r.id ? detailHTML(r) : ''}
      </div>`;
    };
    return `
      ${pageTitle('Renewals & Deadlines', 'the quiet ones — I watch them so you don\'t have to')}
      <div class="rows">${rs.sort((a, b) => ((a.renewal && a.renewal.expires) || '9999').localeCompare((b.renewal && b.renewal.expires) || '9999')).map(row).join('') || emptyLine('Nothing back here can sneak past me. That\'s the whole point of me.')}</div>
      <form class="addform fig" data-form="renewal">
        <input name="name" placeholder="add one — passport, rego, lease…" required>
        <input name="date" type="date">
        <button type="submit" class="chip">watch it</button>
      </form>
    `;
  }

  function owedPage() {
    const debts = NB.itemsFor((i) => i.kind === 'debt' && !i.done);
    const they = debts.filter((d) => d.debt && d.debt.dir === 'they');
    const me = debts.filter((d) => d.debt && d.debt.dir !== 'they');
    const col = (list, empty) => list.map((d) => `
      <div class="brow ${!d.ink ? 'pencil' : ''}" data-id="${d.id}">
        <div class="row-main">
          <button class="tick" data-act="tick" type="button" aria-label="settled"></button>
          <span class="row-text hand" data-act="open">${esc(d.text)}</span>
          ${d.debt.amount != null ? `<span class="bamt fig">$${NB.fmtAmt(d.debt.amount)}</span>` : ''}
        </div>
        ${d.question ? stickyHTML(d) : ''}
        ${expandedId === d.id ? detailHTML(d) : ''}
      </div>`).join('') || `<div class="dayempty hand">${empty}</div>`;
    return `
      ${pageTitle('Who Owes What', 'money and favours, both directions')}
      <div class="owed-cols">
        <div class="owed-col"><div class="band-label fig">owed to you</div>${col(they, 'nothing — generous friends')}</div>
        <div class="owed-col"><div class="band-label fig">you owe</div>${col(me, 'clean slate')}</div>
      </div>
      <form class="addform fig" data-form="debt">
        <input name="what" placeholder="add — e.g. Sam owes me $60" required>
        <button type="submit" class="chip">note it</button>
      </form>
    `;
  }

  function healthPage() {
    const hs = NB.itemsFor((i) => i.kind === 'health' && !i.done);
    return `
      ${pageTitle('Health & Appointments', '')}
      <div class="rows">${hs.map((i) => rowHTML(i)).join('') || emptyLine('Nothing here right now. When something comes up, I\'ll keep it in order — and keep it between us.')}</div>
      <form class="addform fig" data-form="health">
        <input name="name" placeholder="add — dentist, refill…" required>
        <input name="date" type="date">
        <input name="time" type="time">
        <button type="submit" class="chip">add</button>
      </form>
      <p class="pageplain fig">This page stays plain on purpose.</p>
    `;
  }

  function emptyLine(text) { return `<p class="empty hand">${esc(text)}</p>`; }

  /* ---------------- render ---------------- */
  function render() {
    applyTheme();
    renderTabs();
    const v = { today: todayView, week: weekView, goals: goalsView, ideas: ideasView, done: doneView, back: backView }[view];
    $('#page').innerHTML = v();
    $('#page').dataset.view = view;
  }

  /* ---------------- dump & sort ---------------- */
  function openDump(prefill) {
    const ov = $('#overlay');
    ov.hidden = false;
    ov.innerHTML = `
      <div class="sheet dump-sheet">
        <button type="button" class="sheet-x fig" data-act="close">✕</button>
        <h2 class="sheet-title hand">Empty your head here.</h2>
        <p class="sheet-sub fig">Lists, worries, whole conversations — I don't need it tidy. Sorting is literally my job.</p>
        <textarea id="dump-text" class="dump-text hand" placeholder="paste or scribble…">${esc(prefill || '')}</textarea>
        <div class="sheet-acts">
          <button type="button" class="pbtn primary" data-act="sort">Sort it</button>
          <button type="button" class="pbtn" data-act="scrap">Just keep it</button>
        </div>
        <div id="sort-stage" class="sort-stage" hidden></div>
      </div>`;
    setTimeout(() => { const ta = $('#dump-text'); if (ta) ta.focus(); }, 50);
  }

  async function runSort(via) {
    const ta = $('#dump-text');
    const text = (ta && ta.value.trim()) || '';
    if (!text) return;
    const stage = $('#sort-stage');
    stage.hidden = false;
    stage.innerHTML = `<div class="penline"><span class="pen">✒︎</span><span class="hand">reading…</span></div>`;
    const btns = document.querySelectorAll('.sheet-acts .pbtn');
    btns.forEach((b) => (b.disabled = true));

    const { items: raw, brain, note } = await NB.extract(text);
    NB.clearSamples();

    if (!raw.length) {
      NB.withUndo('Kept as a scrap — nothing jumped out at me.', () => {
        NB.addItem({ kind: 'idea', text: text.length > 60 ? text.slice(0, 57) + '…' : text, ink: false, bucket: 'ideas', source: { quote: text.slice(0, 200), at: new Date().toISOString(), via } });
      });
      closeOverlay(); render(); return;
    }

    let result = null;
    NB.withUndo(tallyLabel(raw), () => { result = NB.fileExtraction(raw, via); });

    /* overlay was closed mid-sort — still land the items, just re-render the page */
    if (!document.querySelector('#sort-stage')) { closeOverlay(); render(); return; }

    const tabOf = (it) => it.kind === 'bill' ? 'Bills' : it.kind === 'person' ? 'People' : it.kind === 'renewal' ? 'Renewals' : it.kind === 'debt' ? 'Owed' : it.kind === 'health' ? 'Health' : it.kind === 'goal' ? 'Goals' : it.kind === 'idea' ? 'Ideas' : it.date ? D.dayName(it.date, true) : 'This week';
    stage.innerHTML = `
      <div class="sorted">
        ${result.filed.map((it, i) => `<div class="sorted-row" style="animation-delay:${i * 120}ms"><span class="hand">${esc(it.text)}</span><span class="fig sorted-tab">→ ${esc(tabOf(it))}</span></div>`).join('')}
        ${result.parked.map((it, i) => `<div class="sorted-row parked" style="animation-delay:${(result.filed.length + i) * 120}ms"><span class="hand">${esc(it.text)}</span><span class="fig sorted-tab">✎ a quick word</span></div>`).join('')}
        <div class="sorted-tally hand">${esc(tallyLabel(raw))}${brain === 'local' ? ' <span class="fig">(sorted offline' + (note ? ' — ' + esc(note) : '') + ')</span>' : ''}</div>
        <button type="button" class="pbtn primary" data-act="close-rerender">Lovely</button>
      </div>`;
  }
  function tallyLabel(raw) {
    const sure = raw.filter((r) => r.confidence !== 'unsure').length;
    const unsure = raw.length - sure;
    if (!sure) return `Parked ${unsure} — ${unsure === 1 ? 'it needs' : 'they need'} a quick word.`;
    return `Filed ${sure}.${unsure ? ` ${unsure} need${unsure === 1 ? 's' : ''} a quick word.` : ''}`;
  }

  /* ---------------- the Desk ---------------- */
  function openDesk() {
    const ov = $('#overlay');
    ov.hidden = false;
    ov.innerHTML = `
      <div class="sheet desk-sheet">
        <button type="button" class="sheet-x fig" data-act="close">✕</button>
        <div class="desk-cap fig">THE DESK</div>
        <div id="desk-log" class="desk-log">
          <p class="lib-line hand">Ask me anything I've filed. "When's rent due?" "What's my week look like?" I did the reading — it's sort of my whole thing.</p>
        </div>
        <form id="desk-form" class="desk-input">
          <input id="desk-q" class="desk-q hand" placeholder="Ask the book. It's been paying attention." autocomplete="off">
        </form>
      </div>`;
    setTimeout(() => { const q = $('#desk-q'); if (q) q.focus(); }, 50);
  }

  async function deskAsk(q) {
    const log = $('#desk-log');
    log.insertAdjacentHTML('beforeend', `<p class="you-line hand">${esc(q)}</p><p class="lib-line hand thinking">…</p>`);
    log.scrollTop = log.scrollHeight;
    const res = await NB.askDesk(q);
    const th = $('.thinking', log);
    if (th) th.remove();
    const pins = res.matches.slice(0, 3).map((m) => `
      <div class="pin" data-id="${m.id}">
        <span class="clip">📎</span>
        <span class="hand">${esc(m.text)}</span>
        ${m.date ? `<span class="fig pin-when">${esc(D.niceDate(m.date))}</span>` : ''}
        ${m.done ? '<span class="fig pin-when">done ✓</span>' : ''}
      </div>`).join('');
    log.insertAdjacentHTML('beforeend', `<p class="lib-line hand">${esc(res.reply)}</p>${pins}`);
    log.scrollTop = log.scrollHeight;
  }

  /* ---------------- flyleaf (settings) ---------------- */
  function openSettings() {
    const s = NB.state().settings;
    const ov = $('#overlay');
    ov.hidden = false;
    ov.innerHTML = `
      <div class="sheet settings-sheet">
        <button type="button" class="sheet-x fig" data-act="close">✕</button>
        <h2 class="sheet-title hand">The flyleaf</h2>
        <div class="set fig">
          <label>Paper
            <select data-set="theme">
              <option value="auto" ${s.theme === 'auto' ? 'selected' : ''}>match the room</option>
              <option value="day" ${s.theme === 'day' ? 'selected' : ''}>daylight</option>
              <option value="night" ${s.theme === 'night' ? 'selected' : ''}>lamplight</option>
            </select>
          </label>
          <label class="autolabel"><input type="checkbox" data-set="plainHand" ${s.plainHand ? 'checked' : ''}> My handwriting, but make it print</label>
          <label>Librarian's brain — Claude API key <span class="hint">(optional · stays on this device only)</span>
            <input type="password" data-set="apiKey" value="${esc(s.apiKey)}" placeholder="sk-ant-…">
          </label>
          <p class="hint">No key? I still sort with my offline brain — just less cleverly. Keys come from console.anthropic.com; a sort costs about a cent.</p>
          <div class="set-acts">
            <button type="button" class="pbtn" data-act="export">Export notebook</button>
            <label class="pbtn filebtn">Import<input type="file" accept=".json" data-act="import" hidden></label>
          </div>
          <div class="set-acts">
            <button type="button" class="pbtn danger" data-act="closebook">Close the notebook</button>
          </div>
          <p class="hint">Close = wipe this device. Export first if you want to carry it. Nothing is left behind — frankly, it was never any of this machine's business.</p>
        </div>
      </div>`;
  }

  function closeOverlay() { const ov = $('#overlay'); ov.hidden = true; ov.innerHTML = ''; }

  /* ---------------- actions ---------------- */
  function tick(it) {
    if (it.kind === 'routine') {
      NB.withUndo(it.done ? 'Un-filled. It happens.' : 'Kept up. Quietly noted.', () => { it.done = !it.done; it.doneAt = it.done ? new Date().toISOString() : null; });
      return;
    }
    if (it.done) { NB.withUndo('Back on the page.', () => { it.done = false; it.doneAt = null; }); return; }
    NB.withUndo(tickLabel(it), () => { it.done = true; it.doneAt = new Date().toISOString(); it.doneKey = D.todayKey(); it.question = null; });
  }
  function tickLabel(it) {
    if (it.kind === 'goal') return 'A goal, reached. Look at you.';
    if (it.kind === 'debt') return 'Settled and crossed out.';
    if (it.kind === 'health') return 'Done. Kindly noted.';
    if (it.kind === 'renewal') return 'Handled. One less quiet thing.';
    const lines = ['Done and inked.', 'Struck through, with feeling.', 'One down.', 'Into Done it goes, proud.'];
    return lines[Math.floor(Math.random() * lines.length)];
  }

  function payBill(it) {
    const cyc = NB.billCycleKey();
    const paid = NB.billPaid(it, cyc);
    NB.withUndo(paid ? 'Un-paid. Bills do come back.' : `Paid. ${it.text} and I have no further business this month.`, () => {
      it.bill.paid = it.bill.paid || {};
      if (paid) delete it.bill.paid[cyc]; else it.bill.paid[cyc] = true;
    });
  }

  function whenAct(it, w) {
    const t = D.todayKey();
    NB.withUndo(`Moved to ${w}.`, () => {
      it.carried = 0;
      if (w === 'Today') { it.bucket = 'day'; it.date = t; }
      else if (w === 'Tomorrow') { it.bucket = 'day'; it.date = D.addDays(t, 1); }
      else if (w === 'This week') { it.bucket = 'week'; it.date = null; }
      else if (w === 'Next week') { it.bucket = 'day'; it.date = D.addDays(D.weekOf(t)[0], 7); }
      else if (w === 'Someday') { it.bucket = 'someday'; it.date = null; }
    });
    expandedId = null;
  }

  /* ---------------- event wiring ---------------- */
  document.addEventListener('click', (e) => {
    const tabBtn = e.target.closest('button[data-view]');
    if (tabBtn) { view = tabBtn.dataset.view; expandedId = null; render(); return; }
    const bt = e.target.closest('[data-backtab]');
    if (bt) { backTab = bt.dataset.backtab; expandedId = null; render(); return; }

    if (e.target.closest('#btn-dump')) { openDump(''); return; }
    if (e.target.closest('#btn-settings')) { openSettings(); return; }
    if (e.target.closest('#ribbon')) { openDesk(); return; }

    const act = e.target.closest('[data-act]');
    if (!act) return;
    const a = act.dataset.act;
    const rowEl = act.closest('[data-id]');
    const it = rowEl ? NB.getItem(rowEl.dataset.id) : null;

    if (a === 'close') { closeOverlay(); return; }
    if (a === 'close-rerender') { closeOverlay(); render(); return; }
    if (a === 'sort') { runSort('paste'); return; }
    if (a === 'scrap') {
      const ta = $('#dump-text'); const text = (ta && ta.value.trim()) || '';
      if (text) {
        NB.clearSamples();
        NB.withUndo('Caught it. It\'ll wait in Ideas.', () => {
          NB.addItem({ kind: 'idea', text: text.length > 60 ? text.slice(0, 57) + '…' : text, ink: false, bucket: 'ideas', source: { quote: text.slice(0, 200), at: new Date().toISOString(), via: 'paste' } });
        });
      }
      closeOverlay(); render(); return;
    }
    if (a === 'fold') { NB.state().meta.briefFoldedFor = D.todayKey(); NB.save(); render(); return; }
    if (a === 'unfold') { NB.state().meta.briefFoldedFor = null; NB.save(); render(); return; }
    if (a === 'addday') {
      const date = act.dataset.date;
      const text = window.prompt('Jot it:');
      if (text && text.trim()) {
        NB.withUndo('Inked in.', () => {
          const { time } = NB.parseWhen(text);
          NB.addItem({ kind: 'task', text: text.trim(), date, time, bucket: 'day', source: { quote: text.trim(), at: new Date().toISOString(), via: 'manual' } });
        });
        render();
      }
      return;
    }
    if (a === 'export') {
      const blob = new Blob([NB.exportJSON()], { type: 'application/json' });
      const aEl = document.createElement('a');
      aEl.href = URL.createObjectURL(blob);
      aEl.download = `notebook-${D.todayKey()}.json`;
      aEl.click();
      return;
    }
    if (a === 'closebook') {
      if (act.dataset.armed) { NB.wipe(); closeOverlay(); location.reload(); }
      else { act.dataset.armed = '1'; act.textContent = 'Tap again — this clears the desk'; }
      return;
    }
    if (a === 'goback') { view = 'back'; backTab = 'bills'; render(); return; }

    if (!it) return;
    if (a === 'tick') { tick(it); render(); return; }
    if (a === 'paybill') { payBill(it); render(); return; }
    if (a === 'open') { expandedId = expandedId === it.id ? null : it.id; render(); return; }
    if (a === 'toss') { NB.withUndo('Tossed.', () => NB.removeItem(it.id)); expandedId = null; render(); return; }
    if (a === 'restore') { NB.withUndo('Back on the page.', () => { it.done = false; it.doneAt = null; }); render(); return; }
    if (a === 'answer') { NB.answerQuestion(it.id, act.dataset.answer); render(); return; }
    if (a === 'when') { whenAct(it, act.dataset.when); render(); return; }
  });

  /* edits inside detail cards */
  document.addEventListener('change', (e) => {
    const ed = e.target.closest('[data-edit]');
    if (ed) {
      const rowEl = ed.closest('[data-id]');
      const it = rowEl && NB.getItem(rowEl.dataset.id);
      if (!it) return;
      const f = ed.dataset.edit;
      if (f === 'text') { it.text = ed.value.trim() || it.text; if (it.source) it.source.edited = true; }
      if (f === 'amount' && it.bill) { it.bill.amount = ed.value === '' ? null : Number(ed.value); it.bill.estimated = false; it.ink = true; }
      if (f === 'dueDay' && it.bill) { it.bill.dueDay = ed.value === '' ? null : Math.max(1, Math.min(31, Number(ed.value))); }
      if (f === 'autopay' && it.bill) { it.bill.autopay = ed.checked; }
      if (f === 'birthday' && it.person) { it.person.birthday = /^\d{2}-\d{2}$/.test(ed.value) ? ed.value : it.person.birthday; it.ink = true; it.question = null; }
      if (f === 'expires' && it.renewal) { it.renewal.expires = ed.value || null; it.ink = true; it.question = null; }
      NB.save();
      if (f !== 'text') render();   /* don't tear down the DOM while the text field has focus */
      return;
    }
    const st = e.target.closest('[data-set]');
    if (st) {
      const s = NB.state().settings;
      const k = st.dataset.set;
      s[k] = st.type === 'checkbox' ? st.checked : st.value;
      NB.save(); applyTheme();
      return;
    }
    const imp = e.target.closest('[data-act="import"]');
    if (imp && imp.files && imp.files[0]) {
      imp.files[0].text().then((raw) => {
        try { NB.importJSON(raw); closeOverlay(); render(); NB.onWhisper('Notebook restored.'); }
        catch (err) { NB.onWhisper(err.message); }
      });
    }
  });

  /* live-save the flyleaf as you type, so a half-typed API key survives Escape */
  document.addEventListener('input', (e) => {
    const st = e.target.closest('[data-set]');
    if (!st) return;
    const s = NB.state().settings;
    s[st.dataset.set] = st.type === 'checkbox' ? st.checked : st.value;
    NB.save();
  });

  /* back-page add forms + desk form */
  document.addEventListener('submit', (e) => {
    const form = e.target.closest('form');
    if (!form) return;
    e.preventDefault();
    if (form.id === 'desk-form') {
      const q = $('#desk-q');
      if (q && q.value.trim()) { deskAsk(q.value.trim()); q.value = ''; }
      return;
    }
    const kind = form.dataset.form;
    const fd = new FormData(form);
    const src = { quote: '', at: new Date().toISOString(), via: 'manual' };
    NB.withUndo('One down. Got more? I\'ll rule the lines.', () => {
      if (kind === 'bill') NB.addItem({ kind: 'bill', text: fd.get('name'), source: src, bill: { amount: fd.get('amount') ? Number(fd.get('amount')) : null, estimated: !fd.get('amount'), dueDay: fd.get('day') ? Number(fd.get('day')) : null, autopay: !!fd.get('autopay'), cadence: 'monthly', paid: {} } });
      if (kind === 'person') NB.addItem({ kind: 'person', text: fd.get('name'), source: src, person: { birthday: /^\d{2}-\d{2}$/.test(fd.get('bday') || '') ? fd.get('bday') : null, notes: [] } });
      if (kind === 'renewal') NB.addItem({ kind: 'renewal', text: fd.get('name'), source: src, renewal: { expires: fd.get('date') || null } });
      if (kind === 'debt') {
        const what = fd.get('what') || '';
        const amt = what.match(/\$\s?([\d,]+(?:\.\d{2})?)/);
        NB.addItem({ kind: 'debt', text: what, source: src, debt: { dir: /\bi owe\b/i.test(what) ? 'me' : 'they', amount: amt ? Number(amt[1].replace(/,/g, '')) : null } });
      }
      if (kind === 'health') NB.addItem({ kind: 'health', text: fd.get('name'), source: src, date: fd.get('date') || null, time: fd.get('time') || null });
    });
    render();
  });

  /* close overlay on backdrop click / Escape */
  $('#overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeOverlay(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOverlay(); });

  /* ---------------- boot ---------------- */
  function boot() {
    NB.rollover();
    NB.seed();

    /* share-target / shared text → fire-and-forget capture */
    const params = new URLSearchParams(location.search);
    const sharedText = [params.get('title'), params.get('text'), params.get('url')].filter(Boolean).join('\n');
    if (sharedText) {
      history.replaceState(null, '', location.pathname);
      openDump(sharedText);
    }

    render();

    /* the day can turn while the app stays open (installed PWAs live for days) */
    NB.onStorageError = () => NB.onWhisper('Out of room on this device — export to be safe.');
    window.addEventListener('pagehide', () => NB.flush && NB.flush());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { NB.flush && NB.flush(); return; }
      if (NB.state().meta.lastOpen !== D.todayKey()) { NB.rollover(); render(); }
    });
    setInterval(() => {
      if (!document.hidden && NB.state().meta.lastOpen !== D.todayKey()) { NB.rollover(); render(); }
    }, 60000);

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      Promise.reject().catch(() => {});
    }
  }
  boot();
})();

</script>
