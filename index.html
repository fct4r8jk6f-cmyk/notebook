  --desk: #1D1710; --paper: #292217; --paper-1: #322A1D; --paper-2: #3B3223;
  --back-paper: #251F15; --line: #4A4030;
  --ink: #EDE4CF; --pencil: #B0A692; --pencil-l: #8E8570;
  --amber-soft: #C9995B; --amber-firm: #E4B166; --amber-deep: #F0C784;
  --amber-wash: rgba(228, 177, 102, .14);
  --green: #8FBE97; --green-wash: rgba(143, 190, 151, .14);
  --ochre: #CFB264; --sticky: #4A4128; --sticky-ink: #E8DDB8;
  --kraft: #8A6E44;
  --a-bills: #5E8F72; --a-people: #9C6B83; --a-renewals: #6B8395; --a-owes: #C68A5C; --a-health: #609F96;
  --shadow: rgba(0, 0, 0, .5); --shadow-soft: rgba(0, 0, 0, .3);
}

/* ---------------- base ---------------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--desk); color: var(--ink);
  font-family: var(--fig); font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
:root[data-theme="night"] body { background:
  radial-gradient(ellipse 90% 50% at 50% -10%, rgba(255, 214, 150, .08), transparent 60%), var(--desk); }

/* Author `display` beats the UA sheet's [hidden]{display:none} — say it explicitly,
   or #overlay/#whisper stay on screen (blurring the page and swallowing taps). */
[hidden] { display: none !important; }

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--paper-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px dashed currentColor; outline-offset: 2px; }

.hand { font-family: var(--hand); }
.fig { font-family: var(--fig); font-variant-numeric: tabular-nums lining-nums; }
body.plain-hand .hand, body.plain-hand .pagetitle, body.plain-hand .sheet-title { font-family: var(--fig); }

.app { max-width: 760px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; position: relative; }

.grain {
  position: fixed; inset: 0; pointer-events: none; opacity: .045; mix-blend-mode: multiply; z-index: 50;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}
:root[data-theme="night"] .grain { mix-blend-mode: screen; opacity: .035; }

/* ---------------- chrome ---------------- */
.chrome {
  display: flex; justify-content: space-between; align-items: center;
  /* right padding clears the fixed .ribbon (26px wide, ~18px inset). Without it
     the ribbon sits over the dump button at a higher z-index and eats its taps. */
  padding: 12px 48px 8px 16px; position: sticky; top: 0; z-index: 20;
  background: linear-gradient(var(--desk) 75%, transparent);
}
.brand { font-family: var(--fig); font-weight: 600; font-size: 14px; letter-spacing: .02em; }
.chrome-right { display: flex; gap: 10px; align-items: center; }
.ghost-btn { font-size: 17px; opacity: .7; padding: 4px 6px; }
.dump-btn {
  font-family: var(--fig); font-weight: 600; font-size: 14px;
  color: var(--paper); background: var(--ink); border-radius: 20px; padding: 8px 16px;
  box-shadow: 0 2px 0 var(--shadow);
}
:root[data-theme="night"] .dump-btn { color: var(--desk); }

/* the ribbon */
.ribbon {
  position: fixed; top: 0; right: max(18px, calc(50% - 360px)); width: 26px; height: 48px; z-index: 30;
  background: var(--ribbon);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
  box-shadow: 0 3px 6px var(--shadow);
}
.ribbon::before { content: ''; position: absolute; inset: 3px 3px 10px; border: 1px dashed rgba(240, 235, 215, .4); }
.ribbon:hover { height: 56px; }

/* ---------------- page ---------------- */
.page {
  flex: 1; margin: 6px 12px 0; padding: 18px 16px 28px;
  background: var(--paper); border-radius: 10px 10px 0 0;
  box-shadow: 0 8px 30px var(--shadow-soft);
  background-image: radial-gradient(color-mix(in srgb, var(--line) 55%, transparent) 1px, transparent 1.2px);
  background-size: 22px 22px;
}
.page[data-view="back"] { background: var(--back-paper);
  background-image: repeating-linear-gradient(to bottom, transparent 0 27px, color-mix(in srgb, var(--line) 60%, transparent) 27px 28px); padding: 14px 10px 28px; }

.pagehead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.pagetitle { font-family: var(--disp); font-weight: 700; font-size: 30px; margin: 0; transform: rotate(-.6deg); }
.pagetitle .underline { display: block; width: 54px; height: 2.5px; background: var(--ink); border-radius: 2px; transform: rotate(-1.2deg); }
.pagesub { font-size: 13px; color: var(--pencil-l); }

.empty { color: var(--pencil); font-size: 16px; margin: 18px 4px; }

/* ---------------- the brief ---------------- */
.brief {
  position: relative; background: var(--paper-2); border-radius: 4px;
  padding: 14px 16px 12px; margin: 4px 2px 16px; transform: rotate(-.5deg);
  box-shadow: 0 5px 14px var(--shadow-soft);
}
.brief::before, .brief::after {
  content: ''; position: absolute; top: -7px; width: 44px; height: 15px;
  background: color-mix(in srgb, var(--kraft) 40%, transparent); transform: rotate(-4deg);
}
.brief::after { right: 22px; transform: rotate(3deg); } .brief::before { left: 22px; }
.brief p { margin: 0 0 7px; font-size: 16.5px; line-height: 1.55; }
.brief p.plain { font-size: 17.5px; letter-spacing: .012em; }
.brief-date { position: absolute; top: 9px; right: 12px; font-size: 11px; color: var(--pencil-l); }
.flourish { position: absolute; bottom: 6px; right: 12px; font-family: var(--disp); font-size: 19px; color: var(--pencil-l); }
.brief-x { position: absolute; bottom: 8px; left: 12px; font-size: 11px; color: var(--pencil-l); border-bottom: 1px dashed var(--pencil-l); }
.brief-fold { display: inline-block; margin: 2px 0 12px; font-size: 15px; color: var(--pencil); border-bottom: 1px dashed var(--line); }

/* ---------------- rows ---------------- */
.rows { display: flex; flex-direction: column; }
.row, .brow { border-bottom: 1px solid var(--line); padding: 9px 0 8px; }
.row-main { display: flex; align-items: center; gap: 9px; min-height: 26px; }
.row-text { font-size: 16.5px; line-height: 1.3; flex: 1; cursor: pointer; }
.rows.small .row-text { font-size: 15px; }
.pencil .row-text, .pencil .bamt, .pencil .bwhen { color: var(--pencil); font-weight: 400; }
.sample { opacity: .62; }
.sampletag { font-family: var(--fig); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--pencil-l); border: 1px solid var(--line); border-radius: 8px; padding: 1px 6px; }

.tick {
  flex: 0 0 auto; width: 21px; height: 21px; border: 2px solid var(--pencil);
  border-radius: 50%; transform: rotate(-4deg);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fig); font-weight: 700; font-size: 13px; color: var(--green);
  transition: border-color .2s;
}
.tick.small { width: 17px; height: 17px; border-width: 1.5px; }
.tick.checked, .rows .is-done .tick { border-color: var(--green); }
.is-done .row-text { color: var(--pencil-l); text-decoration: line-through; text-decoration-color: var(--green); text-decoration-thickness: 1.5px; }

.timechip { font-size: 11.5px; font-weight: 700; color: var(--amber-firm); border: 1px solid var(--amber-soft); border-radius: 7px; padding: 1px 6px; }
.moneytag { font-size: 12px; font-weight: 600; color: var(--green); background: var(--green-wash); border-radius: 8px; padding: 1px 7px; }
.carry { color: var(--pencil-l); font-size: 14px; }
.autotag { font-size: 9px; font-weight: 600; letter-spacing: .1em; color: var(--a-renewals); border: 1px solid var(--a-renewals); border-radius: 3px; padding: 0 4px; margin-left: 6px; transform: rotate(-2deg); display: inline-block; vertical-align: 2px; }

/* stickies (parked questions) */
.sticky {
  margin: 8px 0 2px 30px; max-width: 340px; background: var(--sticky); color: var(--sticky-ink);
  padding: 10px 12px; border-radius: 2px; transform: rotate(-1deg);
  box-shadow: 0 1px 2px var(--shadow), 0 6px 14px var(--shadow-soft);
  position: relative;
}
.sticky::after { content: ''; position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; background: linear-gradient(315deg, var(--shadow-soft), transparent 55%); }
.sticky-q { font-size: 14.5px; line-height: 1.4; }
.sticky-chips { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.chip {
  font-family: var(--fig); font-size: 12.5px; font-weight: 600;
  border: 1.5px solid currentColor; border-radius: 10px; padding: 3px 11px; transform: rotate(-.5deg);
}
.chip:nth-child(2n) { transform: rotate(.5deg); }

/* detail / receipt card */
.detail {
  margin: 9px 0 2px 30px; background: var(--paper-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 10px 12px; box-shadow: 0 3px 7px var(--shadow-soft);
  display: flex; flex-direction: column; gap: 9px;
}
.receipt { font-size: 12.5px; color: var(--pencil); line-height: 1.45; }
.receipt .q { color: var(--ink); font-size: 13.5px; }
.edit-line .edit-text { width: 100%; font-size: 15px; background: transparent; border: none; border-bottom: 1px dashed var(--line); border-radius: 0; padding: 2px 0; }
.bill-edit { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--pencil); align-items: center; }
.bill-edit input[type="number"], .bill-edit input:not([type]) { width: 90px; padding: 3px 7px; }
.autolabel { display: flex; gap: 6px; align-items: center; }
.whenpill { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.when-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--pencil-l); }
.detail-acts { display: flex; gap: 14px; }
.linky { font-size: 12.5px; color: var(--pencil); border-bottom: 1px dashed var(--pencil-l); }
.linky:hover { color: var(--ink); }

/* echoes */
.echo {
  display: flex; align-items: center; gap: 8px; padding: 7px 0 7px 10px;
  border-left: double 4px currentColor; margin: 2px 0; min-height: 24px;
}
.echo .e-text { font-size: 15px; cursor: pointer; flex: 1; }
.echo .e-amt { font-size: 13px; font-weight: 600; }
.e-bill { color: var(--a-bills); } .e-bday { color: var(--a-people); }
.e-renewal { color: var(--a-renewals); } .e-health { color: var(--a-health); }
.dogear { width: 11px; height: 11px; opacity: .55; cursor: pointer; background: linear-gradient(135deg, transparent 52%, currentColor 52%); }

/* routines strip */
.routines { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 16px; padding-top: 10px; border-top: 1px dashed var(--line); }
.r-label { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--pencil-l); margin-right: 3px; }
.rchip { font-size: 14px; color: var(--ochre); background: color-mix(in srgb, var(--ochre) 12%, transparent); border-radius: 10px; padding: 3px 11px; }
.rchip.rdone { opacity: .55; text-decoration: line-through; }

/* tray */
.tray { margin-top: 18px; border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; background: var(--amber-wash); }
.tray-label { display: block; font-size: 14.5px; margin-bottom: 4px; }
.tray .row { border-bottom: none; }

/* ---------------- week ---------------- */
/* The week stacks. It used to be a 7-across grid with min-width:940px, but .app
   caps at 760px — so the spread overflowed its column at every viewport size,
   permanently hiding Sunday behind a scrollbar phones don't draw. */
.weekscroll { padding: 4px 0 8px; }
.week { display: grid; grid-template-columns: 1fr; gap: 7px; align-items: start; }
.day { background: color-mix(in srgb, var(--paper-1) 55%, transparent); border-radius: 7px; padding: 7px 9px 8px; min-height: 0; position: relative; }
.day.is-past { opacity: .62; }
.day.is-today { background: var(--paper-1); box-shadow: 0 8px 18px var(--shadow); z-index: 2; }
/* an amber tick on the spine. (It hung above the card as a bookmark when the
   days sat side by side; stacked, that landed on the day above and on the date.) */
.day.is-today::before { content: ''; position: absolute; top: 9px; left: -2px; width: 4px; height: 24px; border-radius: 2px; background: var(--amber-soft); }
.dayhead { display: flex; align-items: baseline; gap: 6px; border-bottom: 1.5px solid var(--line); padding-bottom: 4px; margin-bottom: 7px; }
.dayname { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--pencil-l); }
.is-today .dayname { color: var(--amber-firm); }
.todaytag { font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--amber-firm); }
.daynum { font-family: var(--disp); font-size: 20px; margin-left: auto; }
.day .row { padding: 5px 0 4px; }
.day .tick { width: 16px; height: 16px; border-width: 1.5px; }
.day .echo { padding: 4px 0 4px 7px; } .day .echo .e-text { font-size: 13.5px; }
.dayempty { min-height: 8px; }
/* in flow, not absolute — the day no longer keeps 26px of bottom padding for it */
.addday { display: block; margin-top: 2px; padding: 2px 4px; color: var(--pencil-l); font-size: 15px; line-height: 1; opacity: 0; transition: opacity .15s; }
.day:hover .addday { opacity: .8; }
.addday:focus-visible { opacity: .8; }

.band { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 8px; }
.band.later { opacity: .8; }
.band-label { display: block; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--pencil-l); margin-bottom: 3px; }
.doneday { margin-bottom: 10px; }

/* ---------------- tabs ---------------- */
.tabs {
  position: sticky; bottom: 0; z-index: 20; display: flex; gap: 6px;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, var(--desk) 30%);
  overflow-x: auto;
}
.tab {
  font-family: var(--fig); font-size: 12px; font-weight: 600; color: #33322C; white-space: nowrap;
  padding: 7px 11px; border-radius: 3px; transform: rotate(-1deg); opacity: .82;
  clip-path: polygon(2% 8%, 100% 0, 98% 92%, 0 100%);
  box-shadow: 0 2px 5px var(--shadow);
}
.tab:nth-child(2n) { transform: rotate(.8deg); }
.tab.on { opacity: 1; font-weight: 700; outline: 2px solid var(--shadow-soft); transform: translateY(-3px); }
.t-today { background: #E9C6A6; } .t-week { background: #BFD8C4; } .t-goals { background: #CBD3E6; }
.t-ideas { background: #E7C7D2; } .t-done { background: #D8D2C0; }
.tab.kraft { background: var(--kraft); color: #F7F1E1; margin-left: auto; border-left: 2px dashed #F2E9D4; position: relative; }
:root[data-theme="night"] .tab { filter: saturate(.75) brightness(.9); }
.tab-dot { position: absolute; top: -3px; right: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber-soft); }

/* ---------------- back pages ---------------- */
.backwrap { display: flex; gap: 8px; }
.bthumbs { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; flex: 0 0 auto; }
.bthumb {
  writing-mode: vertical-rl; font-family: var(--fig); font-size: 11px; font-weight: 600;
  color: var(--paper-2); padding: 10px 6px; border-radius: 3px; opacity: .6; transform: rotate(0.5deg);
  clip-path: polygon(0 2%, 100% 0, 100% 98%, 8% 100%);
}
.bthumb.on { opacity: 1; font-weight: 700; }
.b-bills { background: var(--a-bills); } .b-people { background: var(--a-people); }
.b-renewals { background: var(--a-renewals); } .b-owed, .b-owes { background: var(--a-owes); }
.b-health { background: var(--a-health); }
.backpage { flex: 1; min-width: 0; padding-left: 4px; border-left: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.bp-bills { border-left-color: color-mix(in srgb, var(--a-bills) 30%, transparent); }
.bp-people { border-left-color: color-mix(in srgb, var(--a-people) 30%, transparent); }
.bp-renewals { border-left-color: color-mix(in srgb, var(--a-renewals) 30%, transparent); }
.bp-owed { border-left-color: color-mix(in srgb, var(--a-owes) 30%, transparent); }
.bp-health { border-left-color: color-mix(in srgb, var(--a-health) 30%, transparent); }

/* money picture */
.money { margin: 4px 0 16px; }
.money-line { display: flex; }
.mfig { flex: 1; }
.mfig .n { font-size: 21px; font-weight: 600; display: block; }
.mfig.paid .n { color: var(--green); }
.mfig .l { font-size: 11.5px; color: var(--pencil-l); }
.prog { height: 3px; margin-top: 8px; border-radius: 2px; background: repeating-linear-gradient(to right, var(--pencil-l) 0 5px, transparent 5px 9px); position: relative; overflow: hidden; }
.prog .ink { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 2px; transition: width .6s ease; }
.money-sub { margin-top: 8px; font-size: 14px; color: var(--pencil); }
.money-sub .fig { font-weight: 600; color: var(--pencil); }
.nextup { margin-top: 5px; font-size: 15px; }

/* bill / back rows */
.brow .bwhen { font-size: 12px; color: var(--pencil-l); text-align: right; }
/* the bill's due line, sitting under the name (indented past the tick) */
.bmeta { margin: 1px 0 0 29px; }
.bmeta .bwhen { text-align: left; }
.brow .bamt { font-size: 15.5px; font-weight: 600; min-width: 70px; text-align: right; }
.brow .bamt.est { color: var(--pencil); font-weight: 400; }
.brow.due-soon .bwhen { color: var(--amber-firm); font-weight: 600; }
.brow.due-now { background: linear-gradient(to right, var(--amber-wash), transparent 70%); }
.brow.due-now .bwhen { color: var(--amber-deep); font-weight: 700; }
.brow.due-now .row-text { font-weight: 700; }
.brow.is-auto { opacity: .72; }
.flag { color: var(--amber-deep); font-size: 14px; animation: softpulse 2.4s ease-in-out infinite; }
@keyframes softpulse { 0%, 100% { opacity: 1 } 50% { opacity: .5 } }
.handled .row-text { color: var(--pencil-l); text-decoration: line-through; text-decoration-color: var(--green); }
.whisperline { margin: 2px 0 0 30px; font-size: 12.5px; color: var(--pencil); }
.monogram { flex: 0 0 auto; width: 26px; height: 26px; border: 1.5px solid var(--a-people); color: var(--a-people); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; transform: rotate(-3deg); }
.owed-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.owed-col:first-child { border-right: 1px dashed var(--line); padding-right: 12px; }
.pageplain { color: var(--pencil-l); font-size: 12px; margin-top: 16px; }

/* add forms */
.addform { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-top: 16px; padding-top: 10px; border-top: 1px dashed var(--line); }
.addform input { font-size: 13px; padding: 5px 8px; }
.addform input[name="name"], .addform input[name="what"] { flex: 1; min-width: 150px; }
.addform input[type="number"] { width: 70px; }
.addform .chip { color: var(--pencil); }

/* ---------------- overlays ---------------- */
.overlay {
  position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--desk) 55%, transparent);
  backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 14px; overflow-y: auto;
}
.sheet {
  position: relative; width: 100%; max-width: 560px; background: var(--paper-2);
  border-radius: 8px; padding: 20px 20px 18px; box-shadow: 0 20px 50px var(--shadow);
  clip-path: polygon(0 0, 100% 0, 100% 99.3%, 92% 100%, 80% 99.4%, 65% 100%, 50% 99.4%, 34% 100%, 20% 99.3%, 8% 100%, 0 99.4%);
}
.sheet-x { position: absolute; top: 12px; right: 14px; color: var(--pencil-l); font-size: 14px; }
.sheet-title { font-family: var(--disp); font-weight: 700; font-size: 27px; margin: 0 0 2px; transform: rotate(-.5deg); }
.sheet-sub { color: var(--pencil-l); font-size: 13px; margin: 0 0 12px; }
.dump-text { width: 100%; min-height: 150px; font-size: 16px; line-height: 1.5; resize: vertical; background: var(--paper-1); }
.sheet-acts { display: flex; gap: 10px; margin-top: 12px; }
.pbtn {
  font-family: var(--fig); font-size: 14px; font-weight: 600; color: var(--ink);
  border: 1.5px solid var(--ink); border-radius: 9px 11px 10px 9px; padding: 8px 16px;
  background: var(--paper-2); transform: rotate(-.6deg);
}
.pbtn + .pbtn { transform: rotate(.5deg); }
.pbtn.primary { background: var(--ink); color: var(--paper); }
:root[data-theme="night"] .pbtn.primary { color: var(--desk); }
.pbtn.danger { border-color: var(--amber-deep); color: var(--amber-deep); }
.pbtn:disabled { opacity: .5; }
.filebtn { display: inline-flex; align-items: center; cursor: pointer; }

/* sort stage */
.sort-stage { margin-top: 14px; }
.penline { display: flex; gap: 9px; align-items: center; font-size: 16px; color: var(--pencil); }
.penline .pen { display: inline-block; animation: penwrite 1s ease-in-out infinite; }
@keyframes penwrite { 0%, 100% { transform: translateX(0) rotate(0) } 50% { transform: translateX(9px) rotate(-8deg) } }
.sorted { display: flex; flex-direction: column; gap: 6px; }
.sorted-row {
  display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  font-size: 15.5px; padding: 4px 2px; border-bottom: 1px solid var(--line);
  opacity: 0; transform: translateY(-8px); animation: flyin .45s ease forwards;
}
.sorted-row.parked { color: var(--pencil); }
.sorted-tab { font-size: 12px; font-weight: 600; color: var(--a-bills); white-space: nowrap; }
.sorted-row.parked .sorted-tab { color: var(--amber-firm); }
@keyframes flyin { to { opacity: 1; transform: none } }
.sorted-tally { margin-top: 8px; font-size: 15px; }
.sorted .pbtn { align-self: flex-end; margin-top: 6px; }

/* the Desk */
.desk-sheet { max-width: 520px; }
.desk-cap { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; color: var(--pencil-l); text-align: center; margin-bottom: 12px; }
.desk-log { display: flex; flex-direction: column; gap: 9px; max-height: 50vh; overflow-y: auto; padding-bottom: 6px; }
.lib-line { margin: 0; font-size: 15.5px; line-height: 1.55; max-width: 92%; }
.you-line { margin: 4px 0 0 auto; font-family: var(--disp); font-size: 20px; color: var(--pencil); border-bottom: 1px solid var(--line); padding-bottom: 2px; transform: rotate(-.4deg); }
.thinking { color: var(--pencil-l); }
.pin {
  display: flex; gap: 8px; align-items: center; background: var(--paper-1);
  border: 1.5px solid var(--ink); border-radius: 7px 9px 8px 7px; padding: 8px 11px;
  margin: 2px 24px 2px 4px; transform: rotate(-.4deg); position: relative; font-size: 14.5px;
}
.pin .clip { position: absolute; top: -10px; left: 12px; font-size: 14px; transform: rotate(12deg); }
.pin .pin-when { margin-left: auto; font-size: 11.5px; color: var(--pencil-l); white-space: nowrap; }
.desk-input { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; }
.desk-q { width: 100%; font-size: 15px; background: transparent; border: none; border-bottom: 1.5px solid var(--pencil-l); border-radius: 0; padding: 6px 2px; }

/* flyleaf */
.set { display: flex; flex-direction: column; gap: 13px; font-size: 13.5px; }
.set label { display: flex; flex-direction: column; gap: 4px; }
.set label.autolabel { flex-direction: row; align-items: center; gap: 8px; }
.hint { color: var(--pencil-l); font-size: 12px; margin: 0; line-height: 1.5; }
.set-acts { display: flex; gap: 10px; flex-wrap: wrap; }

/* whisper */
.whisper {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 45;
  display: flex; gap: 12px; align-items: center; max-width: min(92vw, 480px);
  background: var(--paper-2); border-radius: 4px; padding: 10px 14px;
  box-shadow: 0 8px 22px var(--shadow); font-size: 14.5px;
  clip-path: polygon(0 4%, 100% 0, 99% 96%, 1% 100%);
}
.undo-btn { font-family: var(--fig); font-size: 12.5px; font-weight: 700; color: var(--amber-firm); border-bottom: 1.5px dashed var(--amber-firm); white-space: nowrap; }
.undo-bar { width: 46px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; flex: 0 0 auto; }
.undo-fill { display: block; height: 100%; width: 100%; background: var(--pencil); transition: width 6s linear; }

/* ---------------- misc ---------------- */
@media (max-width: 560px) {
  .pagetitle { font-size: 26px; }
  .owed-cols { gap: 0 8px; }
  .bthumb { font-size: 10px; padding: 8px 5px; }
  .ribbon { right: 14px; }

  .day .dayempty { height: 6px; }

  /* Six tabs overflowed the bar by 3px, so it drifted sideways on every tap. */
  .tabs { gap: 5px; padding-left: 10px; padding-right: 10px; }
  .tab { padding: 7px 9px; }

  /* Bill names were squeezed to ~100px between the tick and the amount and
     wrapped to three lines. Give the name the line; due date goes beneath. */
  .addform input[name="name"], .addform input[name="what"] { flex: 1 1 100%; }
}

/* `+` to add to a day only appeared on :hover — unreachable on a touch screen. */
@media (hover: none) {
  .addday { opacity: .8; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
