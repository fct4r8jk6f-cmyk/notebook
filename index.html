  --accent: #79C398; --accent-soft: rgba(121, 195, 152, .13); --accent-ink: #9AD6B2;
  --warn: #DFAF64; --warn-soft: rgba(223, 175, 100, .13);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
}

/* ---------------- base ---------------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--ui); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
/* Author `display` beats the UA sheet's [hidden]{display:none} — say it explicitly,
   or #overlay/#whisper stay on screen and swallow every tap. */
[hidden] { display: none !important; }

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border-firm); border-radius: var(--r-sm); padding: 10px 12px;
  -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: right 14px center, right 9px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
input::placeholder, textarea::placeholder { color: var(--faint); }

.hand, .fig, .plain { font-family: var(--ui); }
.fig { font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.4; }
.app { max-width: 620px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; position: relative; }
.grain { display: none; }

/* ---------------- header ---------------- */
.chrome {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 14px 16px 10px; position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.6) blur(8px);
}
.brand { font-weight: 600; font-size: 15px; letter-spacing: -.01em; color: var(--text); }
.chrome-right { display: flex; gap: 8px; align-items: center; }
/* 44px, not the 38 that looked right on a desktop mouse: below ~44 a thumb
   misses, and these two are the only way into settings and the ask sheet */
.ghost-btn {
  width: 44px; height: 44px; border-radius: 50%; font-size: 17px; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center;
}
.ghost-btn:hover { background: var(--surface-2); color: var(--text); }
.dump-btn {
  font-weight: 600; font-size: 15px; color: #fff; background: var(--accent);
  border-radius: 999px; padding: 11px 18px; box-shadow: var(--shadow-sm);
}
.dump-btn:hover { background: var(--accent-ink); }
:root[data-theme="night"] .dump-btn { color: #0F1216; }
/* the ask button — an ordinary control now, not a bookmark hanging off the corner */
.ribbon {
  width: 44px; height: 44px; border-radius: 50%; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center; font-size: 17px;
}
.ribbon::before { content: '✦'; }
.ribbon:hover { background: var(--surface-2); color: var(--text); }

/* ---------------- page ---------------- */
.page { flex: 1; padding: 4px 16px 28px; }
.pagehead { margin: 6px 0 16px; }
.pagetitle { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin: 0; line-height: 1.2; }
.pagetitle .underline { display: none; }
.pagesub { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.empty { color: var(--muted); font-size: 15px; margin: 28px 2px; line-height: 1.5; }
.pageplain { color: var(--faint); font-size: 13px; margin-top: 20px; }

/* segmented sub-nav (replaces the rotated side rail) */
.backwrap { display: block; }
.bthumbs { display: flex; gap: 4px; padding: 4px; margin: 0 0 16px; background: var(--sunk); border-radius: 10px; overflow-x: auto; }
.bthumb {
  writing-mode: horizontal-tb; flex: 1; white-space: nowrap; text-align: center;
  font-size: 14px; font-weight: 500; color: var(--muted); background: none;
  padding: 8px 10px; border-radius: 7px; transform: none; clip-path: none; opacity: 1;
}
.bthumb.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow-sm); }
.backpage { border: 0; padding: 0; }

/* ---------------- rows ---------------- */
.rows { display: flex; flex-direction: column; }
.row, .brow { border-bottom: 1px solid var(--border); padding: 12px 2px; }
.row:last-child, .brow:last-child { border-bottom: 0; }
.row-main { display: flex; align-items: flex-start; gap: 12px; min-height: 26px; }
/* the text is the edit target, so it carries its own vertical padding — a
   22px-tall span is a miss on a phone even when the row around it looks big */
.row-text { font-size: 16px; line-height: 1.4; flex: 1; cursor: pointer; padding: 6px 0 5px; }
.rows.small .row-text { font-size: 15px; padding: 6px 0 5px; }
.pencil .row-text, .pencil .bamt, .pencil .bwhen { color: var(--muted); }
.sample { opacity: 1; }
.sampletag, .moneytag {
  font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint);
  border: 1px solid var(--border-firm); border-radius: 999px; padding: 1px 7px; margin-left: 6px;
  white-space: nowrap;
}
/* the button is 34px so a thumb lands; the circle you see is the 21px ::before
   inside it. A 21px button was a miss on a phone, and a 34px circle shouts. */
/* the button is 34px so a thumb lands; the circle you see is the 21px ::before
   behind it. A 21px button was a miss on a phone, and a 34px circle shouts.
   The ✓ the template puts inside sits on top of the circle, not beside it. */
.tick {
  flex: 0 0 auto; position: relative; width: 34px; height: 34px; margin: -4px -6px -4px -7px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; line-height: 1; color: transparent;
  isolation: isolate;   /* so the circle below can sit behind the ✓, not over it */
}
.tick::before {
  content: ''; position: absolute; z-index: -1; top: 50%; left: 50%; width: 21px; height: 21px;
  transform: translate(-50%, -50%); border-radius: 50%;
  border: 1.5px solid var(--border-firm); background: var(--surface);
  transition: border-color .12s, background .12s;
}
.tick:hover::before { border-color: var(--accent); }
.tick.small::before { width: 18px; height: 18px; }
.tick.checked::before, .rows .is-done .tick::before { border-color: var(--accent); background: var(--accent); }
.tick.checked, .rows .is-done .tick { color: var(--surface); }
:root[data-theme="night"] .tick.checked, :root[data-theme="night"] .rows .is-done .tick { color: #0F1216; }
.is-done .row-text, .handled .row-text { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.carry { font-size: 12px; color: var(--faint); }
.ink { color: inherit; }
.timechip {
  font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
  border-radius: 6px; padding: 2px 7px; white-space: nowrap; flex: 0 0 auto;
}
.pen, .penline, .flourish, .dogear, .clip { display: none; }

/* ---------------- the brief ---------------- */
.brief {
  position: relative; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 16px 16px 14px; margin-bottom: 18px; box-shadow: var(--shadow-sm);
}
.brief p { margin: 0 0 8px; font-size: 16px; line-height: 1.5; }
.brief p:last-of-type { margin-bottom: 0; }
.brief p.plain { color: var(--muted); }
.brief-date { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.brief-x { position: absolute; top: 4px; right: 4px; width: 34px; height: 34px; font-size: 13px; color: var(--faint); display: inline-flex; align-items: center; justify-content: center; }
.brief-x:hover { color: var(--text); }
.brief-fold { font-size: 14px; color: var(--muted); padding: 8px 0; margin-bottom: 8px; }

/* ---------------- week ---------------- */
.weekscroll { padding: 0; }
.week { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: start; }
.day { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 12px 8px; min-height: 0; position: relative; }
.day.is-past { opacity: .6; }
.day.is-today { border-color: var(--accent); box-shadow: var(--shadow-sm); }
.day.is-today::before { display: none; }
.dayhead { display: flex; align-items: baseline; gap: 8px; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
.dayname { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.is-today .dayname { color: var(--accent); }
.daynum { font-size: 15px; font-weight: 600; margin-left: auto; color: var(--muted); }
.day .row { padding: 8px 0; border-bottom: 1px solid var(--border); }
.day .row:last-child { border-bottom: 0; }
.dayempty { min-height: 2px; }
/* full width of the day card: an 11px-wide "+" is unhittable with a thumb */
.addday { display: block; width: 100%; text-align: left; margin-top: 2px; padding: 9px 2px; color: var(--faint); font-size: 14px; line-height: 1.2; opacity: 0; transition: opacity .12s; }
.day:hover .addday, .addday:focus-visible { opacity: 1; }
.band { margin-top: 20px; }
.band-label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
.later { opacity: .85; }

/* ---------------- echoes (things that live on another page) ---------------- */
.echo { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--border); }
.e-text { flex: 1; font-size: 15px; cursor: pointer; padding: 6px 0; }
.e-amt { font-size: 14px; font-weight: 600; color: var(--muted); }
.e-bill { --echo: var(--accent); }
.e-renewal, .e-health { --echo: var(--muted); }
.autotag {
  font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint);
  border: 1px solid var(--border-firm); border-radius: 999px; padding: 1px 7px; margin-left: 6px;
}

/* ---------------- routines ---------------- */
.routines { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.r-label { width: 100%; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 2px; }
.rchip { font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border-firm); border-radius: 999px; padding: 6px 12px; }
.rchip:hover { border-color: var(--accent); }
.rchip.rdone { color: var(--faint); background: var(--surface-2); border-color: var(--border); text-decoration: line-through; }

/* ---------------- money pages ---------------- */
.money { margin: 0 0 20px; }
.money-line { display: flex; gap: 14px; }
.mfig { flex: 1; }
.mfig .n { font-size: 22px; font-weight: 600; display: block; letter-spacing: -.02em; }
.mfig.paid .n { color: var(--accent); }
.mfig .l { font-size: 12px; color: var(--muted); }
.prog { height: 4px; margin-top: 12px; border-radius: 999px; background: var(--sunk); position: relative; overflow: hidden; }
.prog .ink { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.money-sub { margin-top: 12px; font-size: 14px; color: var(--muted); }
.money-sub .fig { font-weight: 600; color: var(--text); }
.nextup { margin-top: 4px; font-size: 14px; color: var(--muted); }

.brow .bwhen { font-size: 13px; color: var(--muted); }
.bmeta { margin: 3px 0 0 33px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.bmeta .bwhen { text-align: left; }
.bevery { font-size: 12px; color: var(--faint); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
.brow .bamt { font-size: 16px; font-weight: 600; min-width: 64px; text-align: right; flex: 0 0 auto; }
.brow .bamt.est { color: var(--muted); font-weight: 400; }
.brow.due-soon .bwhen { color: var(--warn); font-weight: 600; }
.brow.due-now { background: var(--warn-soft); border-radius: var(--r-sm); padding-left: 10px; padding-right: 10px; margin: 0 -10px; }
.brow.due-now .bwhen { color: var(--warn); font-weight: 600; }
.brow.is-auto { opacity: .72; }
.flag { color: var(--warn); font-size: 13px; flex: 0 0 auto; margin-top: 3px; }
.whisperline { margin: 3px 0 0 33px; font-size: 13px; color: var(--muted); }
.owed-cols { display: grid; grid-template-columns: 1fr; gap: 22px; }
.owed-col:first-child { border-right: 0; padding-right: 0; }

/* ---------------- forms ---------------- */
.addform { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); }
.addform input, .addform select { font-size: 15px; padding: 9px 11px; }
.addform input[name="name"], .addform input[name="what"] { flex: 1 1 100%; min-width: 0; }
.addform input[type="number"] { width: 92px; }
.addform .chip { color: #fff; background: var(--accent); border-radius: 999px; padding: 9px 16px; font-weight: 600; font-size: 15px; }
:root[data-theme="night"] .addform .chip { color: #0F1216; }
.autolabel { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; color: var(--muted); }
.autolabel input { width: auto; }
.chip { font-size: 14px; color: var(--text); background: var(--surface-2); border-radius: 999px; padding: 7px 13px; }
.chip:hover { background: var(--sunk); }
.linky { font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.linky:hover { color: var(--text); }

/* ---------------- detail / edit ---------------- */
.detail { margin: 12px 0 4px 33px; padding: 14px; background: var(--surface-2); border-radius: var(--r); }
.receipt { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.receipt .q { color: var(--text); }
.edit-line { margin-bottom: 10px; }
.edit-text { width: 100%; font-size: 16px; }
.bill-edit { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 10px; }
.bill-edit label { display: inline-flex; align-items: center; gap: 6px; }
.bill-edit input, .bill-edit select { font-size: 14px; padding: 7px 9px; }
.bill-edit input[type="number"] { width: 88px; }
.whenpill { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.when-label { font-size: 13px; color: var(--muted); margin-right: 2px; }
.detail-acts { display: flex; gap: 14px; }

/* ---------------- parked questions ---------------- */
.sticky {
  margin: 10px 0 2px 33px; background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 28%, transparent);
  border-radius: var(--r); padding: 12px 14px; color: var(--text);
}
.sticky-q { font-size: 15px; margin-bottom: 10px; }
.sticky-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.sticky .chip { background: var(--surface); border: 1px solid var(--border-firm); }
.tray { margin-top: 24px; }
.tray-label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
.parked { opacity: 1; }

/* ---------------- tabs ---------------- */
.tabs {
  position: sticky; bottom: 0; z-index: 20; display: flex; gap: 2px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.6) blur(8px); border-top: 1px solid var(--border);
}
.tab {
  flex: 1; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap;
  padding: 9px 4px; border-radius: var(--r-sm); transform: none; clip-path: none; opacity: 1;
  box-shadow: none; background: none; text-align: center; position: relative;
}
.tab:hover { color: var(--text); background: var(--surface-2); }
.tab.on { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.tab.kraft { margin-left: 0; border-left: 0; }
.tab-dot { position: absolute; top: 5px; right: 50%; margin-right: -22px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.t-today, .t-week, .t-goals, .t-ideas, .t-done, .t-back { background: none; }

/* ---------------- overlays ---------------- */
.overlay {
  position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(14, 18, 22, .42); backdrop-filter: blur(3px); padding: 0;
}
@media (min-width: 560px) { .overlay { align-items: center; padding: 24px; } }
.sheet {
  position: relative; width: 100%; max-width: 560px; background: var(--surface);
  border-radius: var(--r) var(--r) 0 0; padding: 22px 20px 24px; box-shadow: var(--shadow);
  max-height: 92dvh; overflow-y: auto;
}
@media (min-width: 560px) { .sheet { border-radius: var(--r); } }
.sheet-title { font-size: 21px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 4px; }
.sheet-sub { font-size: 14px; color: var(--muted); margin: 0 0 16px; }
.sheet-x { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; color: var(--muted); font-size: 15px; }
.sheet-x:hover { background: var(--surface-2); color: var(--text); }
.sheet-acts { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.dump-sheet .dump-text {
  width: 100%; min-height: 168px; resize: vertical; font-size: 16px; line-height: 1.5;
  border-radius: var(--r); padding: 14px;
}
.pbtn { font-size: 15px; font-weight: 500; color: var(--text); background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 16px; }
.pbtn:hover { background: var(--sunk); }
.pbtn.primary { color: #fff; background: var(--accent); font-weight: 600; }
.pbtn.primary:hover { background: var(--accent-ink); }
:root[data-theme="night"] .pbtn.primary { color: #0F1216; }
.pbtn.danger { color: var(--warn); background: var(--warn-soft); }
.filebtn { display: inline-flex; align-items: center; cursor: pointer; }
.set { display: flex; flex-direction: column; gap: 16px; }
.set label { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 500; }
.set label.autolabel { flex-direction: row; align-items: center; font-weight: 400; }
.set-acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.synced { color: var(--muted); }

/* the sort result */
.sort-stage { margin-top: 16px; }
.sorted { display: flex; flex-direction: column; }
.sorted-row { display: flex; align-items: baseline; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); animation: rise .24s ease both; }
.sorted-row.parked { color: var(--muted); }
.sorted-tab { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.sorted-row.parked .sorted-tab { color: var(--warn); }
.sorted-tally { margin: 14px 0 16px; font-size: 15px; color: var(--muted); }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* the ask sheet */
.desk-sheet { max-width: 520px; }
.desk-cap { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 12px; }
.desk-log { max-height: 46dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
.lib-line { margin: 0; font-size: 15px; line-height: 1.5; }
.lib-line.thinking { color: var(--faint); }
.you-line { margin: 0; font-size: 15px; font-weight: 600; }
.desk-input { display: flex; }
.desk-q { width: 100%; font-size: 16px; }
.pin { display: flex; align-items: baseline; gap: 8px; padding: 9px 11px; background: var(--surface-2); border-radius: var(--r-sm); font-size: 14px; }
.pin-when { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }

/* ---------------- whisper (undo toast) ---------------- */
.whisper {
  position: fixed; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  z-index: 50; display: flex; gap: 14px; align-items: center;
  width: max-content; max-width: min(92vw, 460px);
  background: var(--text); color: var(--bg); border-radius: 999px; padding: 11px 18px;
  box-shadow: var(--shadow); font-size: 14px; clip-path: none;
}
.undo-btn { font-size: 14px; font-weight: 600; color: inherit; border-bottom: 1px solid currentColor; white-space: nowrap; }
.undo-bar { width: 38px; height: 3px; border-radius: 999px; background: rgba(127,127,127,.35); overflow: hidden; flex: 0 0 auto; }
.undo-fill { display: block; height: 100%; width: 100%; background: currentColor; transition: width 6s linear; }

/* ---------------- misc ---------------- */
@media (max-width: 400px) {
  .page { padding-left: 13px; padding-right: 13px; }
  .chrome { padding-left: 13px; padding-right: 13px; }
  .tab { font-size: 12px; }
  .mfig .n { font-size: 20px; }
}
@media (hover: none) {
  .addday { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
  <div id="app" class="app">
    <!-- top chrome -->
    <header class="chrome">
      <span class="brand">My Notebook</span>
      <div class="chrome-right">
        <button id="ribbon" class="ribbon" type="button" title="Ask your notebook" aria-label="Ask your notebook"></button>
        <button id="btn-settings" class="ghost-btn" type="button" title="Settings" aria-label="Settings">⚙</button>
        <button id="btn-dump" class="dump-btn" type="button">＋ Add</button>
      </div>
    </header>



    <!-- the page -->
    <main id="page" class="page" aria-live="polite"></main>

    <!-- tabs -->
    <nav id="tabs" class="tabs" aria-label="Notebook sections"></nav>

    <!-- overlays -->
    <div id="overlay" class="overlay" hidden></div>

    <!-- whisper / undo -->
    <div id="whisper" class="whisper" hidden></div>

  </div>

  
  

<script>
/* =========================================================================
   My Notebook — core.js
   The store, the item model, the librarian's two brains, and the brief.
   No build step, no dependencies. window.NB is the app's spine.
   ========================================================================= */
(function () {
  'use strict';

  const NB = (window.NB = {});

  /* ---------------- dates ---------------- */
  const DAY = 86400000;
  const WEEKDAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];

  function pad(n) { return String(n).padStart(2, '0'); }
  function toKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function fromKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
  function todayKey() { return toKey(new Date()); }
  function addDays(key, n) { const d = fromKey(key); d.setDate(d.getDate() + n); return toKey(d); }
  function monthKey(key) { return key.slice(0, 7); }
  function dayName(key, short) {
    const d = fromKey(key);
    const name = d.toLocaleDateString('en-US', { weekday: short ? 'short' : 'long' });
    return name;
  }
  function niceDate(key) {
    const d = fromKey(key);
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }
  /* Monday-start week containing `key` */
  function weekOf(key) {
    const d = fromKey(key);
    const dow = (d.getDay() + 6) % 7; // Mon=0
    d.setDate(d.getDate() - dow);
    const days = [];
    for (let i = 0; i < 7; i++) { days.push(toKey(d)); d.setDate(d.getDate() + 1); }
    return days;
  }
  function daysUntil(key) { return Math.round((fromKey(key) - fromKey(todayKey())) / DAY); }

  NB.dates = { toKey, fromKey, todayKey, addDays, monthKey, dayName, niceDate, weekOf, daysUntil, pad };

  /* ---------------- store ---------------- */
  const STORE_KEY = 'notebook-v1';

  /* The librarian's brain. Opus 5 is the default; the others are here for
     people who'd rather trade a little judgement for speed or cost. */
  const MODELS = [
    { id: 'claude-opus-5', label: 'Opus 5 — sharpest', note: 'best at messy dumps' },
    { id: 'claude-sonnet-5', label: 'Sonnet 5 — quicker', note: 'nearly as good, cheaper' },
    { id: 'claude-haiku-4-5', label: 'Haiku 4.5 — fastest', note: 'plainest, cheapest' },
  ];
  const DEFAULT_MODEL = MODELS[0].id;
  NB.MODELS = MODELS;

  const DEFAULT_STATE = () => ({
    v: 1,
    items: [],
    settings: { theme: 'auto', plainHand: false, apiKey: '', model: DEFAULT_MODEL, gistToken: '' },
    meta: { lastOpen: null, seeded: false, firstDumpDone: false, briefFoldedFor: null, gistId: null, syncedAt: null, graves: {} },
  });

  let state = load();
  let saveTimer = null;

  /* Carry old notebooks forward. The People page is gone; anything filed there
     becomes a loose page in Ideas rather than sitting in storage with nowhere
     to show — the user can read it and toss it. Nothing is deleted on load. */
  /* The model was never pickable, so anything stored is just the old default —
     move it forward rather than stranding notebooks on a superseded model. */
  function migrateSettings(st) {
    if (!st) return st;
    if (!st.model || st.model === 'claude-opus-4-8') st.model = DEFAULT_MODEL;
    return st;
  }

  function migrate(items) {
    return items.map((it) => {
      if (it.kind !== 'person') return it;
      const bd = it.person && it.person.birthday;
      const when = bd ? ` (${bd})` : '';
      const { person, ...rest } = it;
      return { ...rest, kind: 'idea', bucket: 'ideas', text: `${it.text}${when}`, question: null };
    });
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return DEFAULT_STATE();
      const parsed = JSON.parse(raw);
      const base = DEFAULT_STATE();
      return {
        ...base, ...parsed,
        settings: migrateSettings({ ...base.settings, ...(parsed.settings || {}) }),
        meta: { ...base.meta, ...(parsed.meta || {}) },
        items: migrate(Array.isArray(parsed.items) ? parsed.items : []),
      };
    } catch (e) {
      try { const bad = localStorage.getItem(STORE_KEY); if (bad) localStorage.setItem(STORE_KEY + '-corrupt', bad); } catch (_) {}
      return DEFAULT_STATE();
    }
  }
  /* Every item carries `touched` so two devices can be merged item by item
     instead of one notebook flattening the other. Stamped here, centrally, by
     diffing against the last write — call sites don't have to remember. */
  function fingerprint(items) {
    const m = {};
    for (const it of items) m[it.id] = JSON.stringify({ ...it, touched: undefined });
    return m;
  }
  let lastWrite = fingerprint(state.items);
  function stampChanges() {
    const now = new Date().toISOString();
    let dirty = false;
    for (const it of state.items) {
      const print = JSON.stringify({ ...it, touched: undefined });
      if (lastWrite[it.id] !== print) { it.touched = now; dirty = true; }
    }
    if (Object.keys(lastWrite).length !== state.items.length) dirty = true;
    lastWrite = fingerprint(state.items);
    return dirty;
  }

  function flush() {
    const dirty = stampChanges();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); NB.storageError = false; }
    catch (e) { NB.storageError = true; if (NB.onStorageError) NB.onStorageError(); }
    if (dirty && !applyingSync) queueSync();
  }
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 150); }
  NB.flush = () => { clearTimeout(saveTimer); flush(); };
  function wipe() { localStorage.removeItem(STORE_KEY); state = DEFAULT_STATE(); undoSnap = null; }

  NB.state = () => state;
  NB.save = save;
  NB.wipe = wipe;

  /* ---------------- items ---------------- */
  let idc = Date.now() % 1e7;
  function uid() { return 'i' + (idc++).toString(36) + Math.random().toString(36).slice(2, 6); }

  /* kinds: task · bill · goal · idea · renewal · debt · health · routine · scrap */
  function makeItem(partial) {
    return {
      id: uid(), kind: 'task', text: '', ink: true, date: null, time: null,
      bucket: 'day',           /* day | week | next-week | someday | goals | ideas */
      done: false, doneAt: null, doneKey: null, carried: 0, sample: false,
      source: null,            /* {quote, at, via} */
      question: null,          /* {q, options:[{label, act}]} — parked sticky */
      bill: null, renewal: null, debt: null, goal: null,
      ...partial,
    };
  }
  NB.makeItem = makeItem;

  function addItem(partial) { const it = makeItem(partial); state.items.push(it); save(); return it; }
  function getItem(id) { return state.items.find((i) => i.id === id) || null; }
  function removeItem(id) {
    state.items = state.items.filter((i) => i.id !== id);
    state.meta.graves = state.meta.graves || {};
    state.meta.graves[id] = new Date().toISOString();
    save();
  }
  NB.addItem = addItem; NB.getItem = getItem; NB.removeItem = removeItem;

  /* Clear watermark samples the moment real life arrives. */
  function clearSamples() {
    if (state.items.some((i) => i.sample)) {
      state.items = state.items.filter((i) => !i.sample);
    }
    state.meta.firstDumpDone = true; save();
  }
  NB.clearSamples = clearSamples;

  /* ---------------- undo (6s whisper) ---------------- */
  let undoSnap = null;
  function withUndo(label, fn) {
    /* graves too — undoing a toss must not leave the headstone behind, or the
       item comes back on this device and sync buries it again */
    undoSnap = JSON.stringify({ items: state.items, graves: state.meta.graves || {} });
    fn();
    save();
    if (NB.onWhisper) NB.onWhisper(label);
  }
  function undo() {
    if (!undoSnap) return false;
    const snap = JSON.parse(undoSnap);
    state.items = snap.items;
    state.meta.graves = snap.graves || {};
    undoSnap = null; save();
    return true;
  }
  NB.withUndo = withUndo; NB.undo = undo;

  /* ---------------- day rollover: carry-forward, routine reset ---------------- */
  function rollover() {
    const today = todayKey();
    const last = state.meta.lastOpen;
    state.meta.lastOpen = today;
    if (last === today) { save(); return; }

    for (const it of state.items) {
      if (it.done && it.kind === 'routine') { it.done = false; it.doneAt = null; } // routines reset daily
      if (it.kind === 'task' && !it.done && it.bucket === 'day' && it.date && it.date < today) {
        it.carried = (it.carried || 0) + 1;
        it.date = today;
        if (it.carried >= 3 && !it.question) {
          it.ink = false;
          it.question = {
            q: 'Still a thing — or handled some other way? Either answer is fine.',
            options: [
              { label: 'keep it', act: 'keep' },
              { label: 'someday', act: 'someday' },
              { label: 'toss', act: 'toss' },
            ],
          };
        }
      }
    }
    state.meta.briefFoldedFor = null; // fresh brief each morning
    save();
  }
  NB.rollover = rollover;

  /* ---------------- selectors ---------------- */
  /* ---- bill rhythms -------------------------------------------------------
     Not everything arrives monthly. A bill repeats on a cadence counted from an
     `anchor` date (a known occurrence). Monthly bills are the exception and keep
     their plain `dueDay` day-of-month plus their YYYY-MM paid keys, so notebooks
     written before cadences existed keep every tick they already had. */
  const CADENCE = {
    weekly:      { label: 'every week',      every: { days: 7 } },
    fortnightly: { label: 'every 2 weeks',   every: { days: 14 } },
    monthly:     { label: 'every month',     every: { months: 1 } },
    quarterly:   { label: 'every 3 months',  every: { months: 3 } },
    yearly:      { label: 'every year',      every: { months: 12 } },
    once:        { label: 'one-off',         every: null },
  };
  NB.CADENCE = CADENCE;

  function addMonths(key, n) {
    const [y, m, d] = key.split('-').map(Number);
    const t = new Date(y, m - 1 + n, 1);
    const dim = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(Math.min(d, dim))}`;
  }

  function billCadence(it) {
    const c = it && it.bill && it.bill.cadence;
    return CADENCE[c] ? c : 'monthly';
  }
  /* a plain day-of-month bill — the shape every bill had before cadences */
  function isPlainMonthly(it) { return billCadence(it) === 'monthly' && !(it.bill && it.bill.anchor); }

  /* the occurrence covering `ref` — the latest one on or before it, or the
     first one if the bill hasn't started yet */
  function billOccurrence(it, ref) {
    const b = it && it.bill; if (!b) return null;
    const cad = billCadence(it), every = CADENCE[cad].every;
    if (cad === 'once') return b.anchor || null;
    if (isPlainMonthly(it)) {
      if (!b.dueDay) return null;
      const [y, m] = ref.split('-').map(Number);
      return `${y}-${pad(m)}-${pad(Math.min(b.dueDay, new Date(y, m, 0).getDate()))}`;
    }
    if (!b.anchor) return null;
    if (b.anchor > ref) return b.anchor;
    return billNth(it, billIndexOn(it, ref));
  }
  /* The nth occurrence counted from the anchor. Always measured from the anchor,
     never by stepping the previous result — a month-end date clamped once (Nov 31
     → Nov 30) would otherwise keep that shorter day forever and drift earlier. */
  function billNth(it, n) {
    const b = it.bill, every = CADENCE[billCadence(it)].every;
    if (!b.anchor || !every) return n === 0 ? (b.anchor || null) : null;
    if (every.days) return addDays(b.anchor, n * every.days);
    const [ay, am, ad] = b.anchor.split('-').map(Number);
    const t = new Date(ay, am - 1 + n * every.months, 1);
    const dim = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(Math.min(ad, dim))}`;
  }
  /* index of the occurrence covering `ref` */
  function billIndexOn(it, ref) {
    const b = it.bill, every = CADENCE[billCadence(it)].every;
    if (every.days) return Math.floor((fromKey(ref) - fromKey(b.anchor)) / DAY / every.days);
    const [ay, am] = b.anchor.split('-').map(Number);
    const [ry, rm] = ref.split('-').map(Number);
    let n = Math.floor(((ry - ay) * 12 + (rm - am)) / every.months);
    while (n > 0 && billNth(it, n) > ref) n--;
    while (billNth(it, n + 1) <= ref) n++;
    return n;
  }
  function billAfter(it, key) {
    const every = CADENCE[billCadence(it)].every;
    if (!every || !key) return null;
    if (!it.bill.anchor) return every.days ? addDays(key, every.days) : addMonths(key, every.months);
    return billNth(it, billIndexOn(it, key) + 1);
  }
  /* monthly keeps YYYY-MM keys; every other rhythm keys by the occurrence itself */
  function cycleKeyFor(it, occ) { return isPlainMonthly(it) ? monthKey(occ) : occ; }

  function billCycleKey(it) {
    const occ = it ? billOccurrence(it, todayKey()) : null;
    return occ ? cycleKeyFor(it, occ) : monthKey(todayKey());
  }
  function billPaid(it, cycle) { return !!(it && it.bill && it.bill.paid && it.bill.paid[cycle || billCycleKey(it)]); }
  /* A bill can't be owed for a cycle that ended before you wrote it down.
     `since` is the day it was added; writing "rent on the 1st" on the 27th used
     to surface as "was due Wed — still open" for a rent you never recorded.
     Bills from notebooks written before `since` existed have none, and keep
     their old behaviour rather than quietly losing a cycle. */
  function billSince(it) { return (it && it.bill && it.bill.since) || null; }
  function billDueDate(it) {
    /* the next REAL due date: this cycle's if unpaid, else the first one after
       it that hasn't been ticked (a cycle can be paid ahead of time) */
    let occ = billOccurrence(it, todayKey());
    if (!occ) return null;
    const since = billSince(it);
    for (let i = 0; i < 24 && (billPaid(it, cycleKeyFor(it, occ)) || (since && occ < since)); i++) {
      const next = billAfter(it, occ);
      if (!next) return null;          /* a one-off, already handled */
      occ = next;
    }
    return occ;
  }
  /* how many times this bill lands inside a calendar month — a fortnightly bill
     hits twice most months, so "due this month" has to count, not assume one */
  function billOccurrencesInMonth(it, mk) {
    if (!it.bill) return [];
    const first = `${mk}-01`;
    const last = `${mk}-${pad(new Date(Number(mk.slice(0, 4)), Number(mk.slice(5, 7)), 0).getDate())}`;
    /* nothing counts against a month that ran before the bill was written */
    const since = billSince(it);
    const started = (k) => !since || k >= since;
    if (isPlainMonthly(it)) {
      if (!it.bill.dueDay) return [];
      return [billOccurrence(it, first)].filter(Boolean).filter(started);
    }
    let k = billOccurrence(it, first);
    if (!k) return [];
    if (k < first) k = billAfter(it, k);
    const out = [];
    while (k && k <= last && out.length < 8) { if (started(k)) out.push(k); k = billAfter(it, k); }
    return out;
  }
  function billHitsInMonth(it, mk) { return billOccurrencesInMonth(it, mk).length; }
  /* What this bill actually adds to a month, split by what's been ticked. A
     weekly bill paid once is not a weekly bill paid four times. */
  function billMonthTotals(it, mk) {
    const amt = it.bill && it.bill.amount;
    const occs = billOccurrencesInMonth(it, mk);
    if (amt == null) return { due: 0, paid: 0, unpaid: 0, hits: occs.length };
    const paidCount = occs.filter((o) => billPaid(it, cycleKeyFor(it, o))).length;
    return { due: amt * occs.length, paid: amt * paidCount, unpaid: amt * (occs.length - paidCount), hits: occs.length };
  }
  function cadenceLabel(it) { return CADENCE[billCadence(it)].label; }
  NB.billCycleKey = billCycleKey; NB.billPaid = billPaid; NB.billDueDate = billDueDate;
  NB.billHitsInMonth = billHitsInMonth; NB.billCadence = billCadence; NB.cadenceLabel = cadenceLabel;
  NB.billMonthTotals = billMonthTotals; NB.billOccurrencesInMonth = billOccurrencesInMonth;

  /* ---- sync: the same notebook on every device, without a server ----------
     The whole book is one JSON blob in a private GitHub Gist. The token lives
     on this device only — same deal as the Claude key: never exported, never
     sent anywhere but GitHub. Offline is unaffected; syncing is something that
     happens when there's a signal, never something you wait for.

     Merges are per item, not per notebook, so a note written on the phone and
     a note written on the laptop both survive. A toss leaves a grave, so a
     tossed item doesn't wander back from the other device. */
  const GIST_FILE = 'notebook.json';
  const GRAVE_DAYS = 90;
  let syncTimer = null, syncing = false, applyingSync = false;

  function setSync(status, detail) {
    NB.sync = { status, detail: detail || '', at: state.meta.syncedAt || null };
    if (NB.onSync) NB.onSync(NB.sync);
  }
  NB.sync = { status: 'off', detail: '', at: null };

  function pruneGraves(graves) {
    const cutoff = new Date(Date.now() - GRAVE_DAYS * DAY).toISOString();
    const out = {};
    for (const id in graves) if (graves[id] > cutoff) out[id] = graves[id];
    return out;
  }

  /* Newer side wins per item; a grave newer than the item buries it. */
  function mergeBooks(mine, theirs) {
    const graves = {};
    for (const src of [theirs.graves || {}, mine.graves || {}]) {
      for (const id in src) if (!graves[id] || src[id] > graves[id]) graves[id] = src[id];
    }
    const by = {};
    for (const it of theirs.items || []) by[it.id] = it;
    for (const it of mine.items || []) {
      const other = by[it.id];
      by[it.id] = !other || (it.touched || '') >= (other.touched || '') ? it : other;
    }
    let items = Object.values(by).filter((it) => {
      const g = graves[it.id];
      return !g || (it.touched || '') > g;
    });
    /* a real notebook beats the other device's watermark seeds */
    if (items.some((i) => !i.sample)) items = items.filter((i) => !i.sample);
    return { items, graves: pruneGraves(graves) };
  }
  NB.mergeBooks = mergeBooks;

  async function gh(path, opts) {
    const res = await fetch('https://api.github.com' + path, {
      ...opts,
      headers: {
        accept: 'application/vnd.github+json',
        authorization: `Bearer ${state.settings.gistToken}`,
        'content-type': 'application/json',
      },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      if (res.status === 401) throw new Error('GitHub turned that token away.');
      if (res.status === 403) throw new Error('That token can\'t reach gists — it needs the gist scope.');
      if (res.status === 404) throw new Error('That notebook has gone from GitHub.');
      throw new Error((err && err.message) || `GitHub said ${res.status}.`);
    }
    return res.json();
  }

  async function syncNow() {
    if (!state.settings.gistToken) { setSync('off'); return false; }
    if (syncing) return false;
    syncing = true; setSync('syncing');
    try {
      let theirs = null, theirsRaw = null;
      if (state.meta.gistId) {
        const g = await gh('/gists/' + state.meta.gistId);
        const f = g.files && g.files[GIST_FILE];
        if (f) {
          theirsRaw = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
          theirs = JSON.parse(theirsRaw);
        }
      }
      applyingSync = true;
      const merged = theirs
        ? mergeBooks({ items: state.items, graves: state.meta.graves }, theirs)
        : { items: state.items, graves: pruneGraves(state.meta.graves || {}) };
      state.items = merged.items;
      state.meta.graves = merged.graves;

      /* only the book travels — settings, keys and tokens stay on the device */
      const body = JSON.stringify({ items: state.items, graves: state.meta.graves }, null, 1);
      const files = { files: { [GIST_FILE]: { content: body } } };
      if (state.meta.gistId) {
        /* don't write a revision just to say nothing changed */
        if (theirsRaw !== body) await gh('/gists/' + state.meta.gistId, { method: 'PATCH', body: JSON.stringify(files) });
      } else {
        const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ ...files, public: false, description: 'My Notebook' }) });
        state.meta.gistId = g.id;
      }
      state.meta.syncedAt = new Date().toISOString();
      stampChanges(); flush();
      applyingSync = false;
      setSync('ok');
      return true;
    } catch (e) {
      applyingSync = false;
      setSync('error', e.message);
      return false;
    } finally {
      syncing = false;
    }
  }
  NB.syncNow = syncNow;

  function queueSync() {
    if (!state.settings.gistToken) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, 2500);   /* let a burst of edits settle first */
  }
  NB.queueSync = queueSync;

  function itemsFor(pred) { return state.items.filter(pred); }
  NB.itemsFor = itemsFor;

  /* Everything that belongs on a given day column (front-of-book + echoes). */
  function dayItems(key) {
    const out = { timed: [], tasks: [], echoes: [], carried: [] };
    for (const it of state.items) {
      if (it.done && it.kind !== 'routine') continue;
      if ((it.kind === 'task' || it.kind === 'scrap') && it.bucket === 'day' && it.date === key) {
        if (it.carried > 0) out.carried.push(it);
        else if (it.time) out.timed.push(it);
        else out.tasks.push(it);
      }
      /* echoes — one object, two faces */
      if (it.kind === 'bill' && it.bill && !billPaid(it)) {
        const due = billDueDate(it);
        if (!due) continue;
        /* on its due day — and an overdue bill rides Today until handled */
        if (due === key || (key === todayKey() && due < key)) out.echoes.push({ echo: 'bill', item: it });
      }
      if (it.kind === 'renewal' && it.renewal && it.renewal.expires === key) {
        out.echoes.push({ echo: 'renewal', item: it });
      }
      if (it.kind === 'health' && it.date === key && !it.done) {
        out.echoes.push({ echo: 'health', item: it });
      }
    }
    out.timed.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    return out;
  }
  NB.dayItems = dayItems;

  /* ---------------- the local brain (offline heuristics) ---------------- */
  const VERBS = 'call text email message buy get grab book pay renew pick send fix clean schedule cancel return finish submit order drop take bring check ask water walk feed read write plan visit sign print wash move update reply remind'.split(' ');
  const GOAL_RE = /\b(finally|some ?day|this year|next year|bucket list|dream of|want to|we should really|life goal|one day)\b/i;
  const HEDGE_RE = /\b(idk|maybe|might|possibly|thinking about|not sure|kinda|sorta|perhaps)\b|\?\s*$/i;
  const OWE_RE = /\b(owes? (me|you|us)|i owe|lent|borrowed|pay (me|you|[a-z]+) back|paid for me|covered (?:for )?me|covered the|spotted me|fronted me|i covered)\b/i;
  /* which way the money runs. Shared with the Owed page's add form — both read
     the same sentence, so both should reach the same conclusion. */
/* "pay mike back" is money I owe; "pay me back" is money owed to me — the name
   in the middle is what flips it, so the lookahead has to exclude me/us */
  const I_OWE_RE = /\b(i owe|i borrowed|i still owe|lent me|paid for me|covered (?:for )?me|covered the|spotted me|fronted me|pay (?!me\b|us\b)[a-z]+ back)\b/i;
  const THEY_OWE_RE = /\b(owes? (me|us)|i lent|i covered|i spotted|i fronted|pay me back|borrowed from me)\b/i;
  const BILL_WORDS = /\b(rent|bill|electricity|electric|water bill|internet|wifi|phone bill|subscription|insurance|utilities|gas bill)\b/i;
  /* things that are plainly a payment without ever saying "bill" */
  const PAY_WORDS = /\b(membership|mortgage|loan|premium|dues|fees?|instal?ments?|direct debit|standing order|cleaner|childcare|daycare|storage|parking|tuition|gym)\b/i;
  const RENEWAL_RE = /\b(passport|licen[cs]e|registration|rego|visa|lease|insurance) .*\b(expires?|renewal?|due|runs out|is up|ends|up for renewal)\b|\b(expires?|renew)\b.*\b(passport|licen[cs]e|registration|rego|visa|lease)\b/i;
  const HEALTH_RE = /\b(doctor|dentist|dr\.?\s|appointment|prescription|refill|check-?up|physio|therapist|meds)\b/i;
  const ROUTINE_RE = /\bevery (day|morning|night|week|sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b|\bdaily\b/i;

  function parseWhen(text) {
    const t = text.toLowerCase();
    const today = todayKey();
    let date = null, time = null;

    const tm = t.match(/\b(?:at |by )?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/) || t.match(/\bat (\d{1,2})(?::(\d{2}))?\b/);
    if (tm) {
      let h = Number(tm[1]); const min = tm[2] ? Number(tm[2]) : 0; const ap = tm[3];
      if (ap === 'pm' && h < 12) h += 12;
      if (ap === 'am' && h === 12) h = 0;
      if (!ap && h <= 7) h += 12; // "at 5" → 17:00, notebook optimism
      if (h < 24 && min < 60) time = `${pad(h)}:${pad(min)}`;
    }

    if (/\btoday\b|\btonight\b/.test(t)) date = today;
    else if (/\btomorrow\b|\btmrw\b/.test(t)) date = addDays(today, 1);
    else {
      const wd = t.match(/\b(?:on |this |next )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
      if (wd) {
        const target = WEEKDAYS.indexOf(wd[1]);
        const now = fromKey(today).getDay();
        const base = (target - now + 7) % 7; /* 0 = that day is today */
        const diff = /\bnext /.test(wd[0]) ? (base === 0 ? 7 : base + 7) : base;
        date = addDays(today, diff);
      }
      const md = t.match(/\b(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sept|sep|oct|nov|dec)\.?\s+(\d{1,2})\b/);
      if (!date && md) {
        const m = MONTHS.findIndex((x) => x.startsWith(md[1]));
        const dayN = Number(md[2]);
        const dim = (yy) => new Date(yy, m + 1, 0).getDate();
        if (m >= 0 && dayN >= 1) {
          let y = new Date().getFullYear();
          if (dayN <= dim(y)) {
            let d2 = new Date(y, m, dayN);
            if (toKey(d2) < today && dayN <= dim(y + 1)) d2 = new Date(y + 1, m, dayN);
            date = toKey(d2);
          }
        }
      }
      const nth = t.match(/\bthe (\d{1,2})(?:st|nd|rd|th)\b/);
      if (!date && nth) {
        const n = Number(nth[1]);
        const now = new Date();
        let y = now.getFullYear(), m2 = now.getMonth();
        if (n < now.getDate()) { m2 += 1; if (m2 > 11) { m2 = 0; y += 1; } }
        const dimT = new Date(y, m2 + 1, 0).getDate();
        if (n >= 1 && n <= dimT) date = toKey(new Date(y, m2, n));
      }
    }
    return { date, time };
  }
  NB.parseWhen = parseWhen;

  /* Money, the way people actually dump it. A literal $ is the strongest signal,
     but almost nobody types one — "electric bill 142.50", "dave owes me 60 bucks",
     "rent 1200". Bare numbers are only trusted in a bill/debt sentence, and only
     once the date words are out of the way, so "due the 8th" isn't read as $8. */
  /* Date-and-time fragments, lifted out. parseAmount uses it so "due the 8th"
     isn't read as $8; the bill titler uses it so a bill isn't named after its
     own due date. Kept in one place — the two must agree about what a date is. */
  function stripWhen(s) {
    return s
      .replace(/\b(?:on|by|due)?\s*the\s+\d{1,2}(?:st|nd|rd|th)?\b/gi, ' ')
      .replace(/\b\d{1,2}(?:st|nd|rd|th)\b/gi, ' ')
      .replace(/\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}\b/gi, ' ')
      .replace(/\b\d{1,2}\s*[:.]\s*\d{2}\s*(?:am|pm)?\b/gi, ' ')
      .replace(/\b\d{1,2}\s*(?:am|pm)\b/gi, ' ');
  }
  function parseAmount(seg, moneyish) {
    const num = (s) => Number(s.replace(/,/g, ''));
    const dollar = seg.match(/\$\s?([\d,]+(?:\.\d+)?)/);
    if (dollar) return num(dollar[1]);
    const worded = seg.match(/\b([\d,]+(?:\.\d+)?)\s*(?:bucks?|dollars?|quid|euros?|pounds?|usd)\b/i);
    if (worded) return num(worded[1]);
    const cents = seg.match(/\b(\d[\d,]*\.\d{2})\b/);
    if (cents) return num(cents[1]);
    if (!moneyish) return null;
    const bare = stripWhen(seg.replace(CADENCE_RE, ' '))  /* "every 2 weeks" — the 2 is a rhythm */
      .match(/\b\d[\d,]*(?:\.\d+)?\b/g);
    /* one number left and nothing to confuse it with — that's the money */
    return bare && bare.length === 1 ? num(bare[0]) : null;
  }
  NB.parseAmount = parseAmount;

  /* Read a debt sentence: which direction, and how much. */
  function readDebt(seg) {
    const iOwe = I_OWE_RE.test(seg), theyOwe = THEY_OWE_RE.test(seg);
    return { dir: iOwe ? 'me' : 'they', clear: iOwe !== theyOwe, amount: parseAmount(seg, true) };
  }
  NB.readDebt = readDebt;

  /* "every 2 weeks", "biweekly", "quarterly" — the rhythm, said out loud */
/* "$45 a month" is how people actually write a rhythm, so `a/per <unit>` counts
   too — without it the phrase stayed in the bill's name ("Gym membership a month") */
  const CADENCE_RE = /\b(?:every\s+(?:other\s+week|2\s+weeks|two\s+weeks|fortnight|week|month|quarter|year|3\s+months|three\s+months|12\s+months)|(?:a|per)\s+(?:week|fortnight|month|quarter|year)|bi-?weekly|fortnightly|weekly|monthly|quarterly|yearly|annual(?:ly)?|one-?off|once)\b/i;
  function parseCadence(seg) {
    const m = seg.match(CADENCE_RE);
    if (!m) return null;
    const w = m[0].toLowerCase().replace(/[\s-]+/g, ' ');
    if (/other week|2 weeks|two weeks|fortnight|biweekly|bi weekly/.test(w)) return 'fortnightly';
    if (/week/.test(w)) return 'weekly';
    if (/quarter|3 months|three months/.test(w)) return 'quarterly';
    if (/year|annual|12 months/.test(w)) return 'yearly';
    if (/month/.test(w)) return 'monthly';
    if (/one off|once/.test(w)) return 'once';
    return null;
  }

  function localExtract(text) {
    const segs = text
      .replace(/([.!?])\s+/g, '$1\n')                 /* sentence break — no lookbehind (iOS Safari) */
      .split(/\n+|(?:,\s*)?\b(?:also|and then|btw|oh and)\b/i)
      .map((s) => s && s.trim()).filter((s) => s && s.length > 2);

    const items = [];
    for (const seg of segs.slice(0, 12)) {
      if (items.length >= 6) break;
      const { date, time } = parseWhen(seg);
      const cad = parseCadence(seg);
      /* A price with a rhythm or a due date is a charge whatever it's called —
         "spotify 11.99 monthly" and "council tax 180 due sep 12" name no bill
         word, and used to fall through to chatter and vanish. */
      const priced = cad !== null || /\bdue\b/i.test(seg);
      const amount = parseAmount(seg, BILL_WORDS.test(seg) || PAY_WORDS.test(seg) || OWE_RE.test(seg) || priced);
      const lower = seg.toLowerCase();
      const firstWord = lower.replace(/^(i |we |you |please |gotta |need to |have to |don't forget to |remember to )+/, '').split(/\s+/)[0];
      const imperative = VERBS.includes(firstWord);
      const clean = seg.replace(/^[-•*\s]+/, '').replace(/[.,;:?!\s]+$/, '');
      const title = clean.length > 64 ? clean.slice(0, 61) + '…' : clean;

      if (OWE_RE.test(seg)) {
        /* "dave owes me 60" says which way round it goes — only ask when it doesn't. */
        const d = readDebt(seg);
        items.push({ kind: 'debt', text: title, quote: seg, date: null, time: null, amount: amount != null ? amount : d.amount, confidence: d.clear ? 'sure' : 'unsure', question: d.clear ? null : 'Who owes whom?', dir: d.dir });
        continue;
      }
      /* "insurance" is both a renewal and a bill word. With money attached it's a
         bill ("insurance 340 due the 15th"); without, it's a thing that expires. */
      if (RENEWAL_RE.test(seg) && !(amount != null && (BILL_WORDS.test(seg) || PAY_WORDS.test(seg)))) {
        items.push({ kind: 'renewal', text: title, quote: seg, date, time: null, amount: null, confidence: date ? 'sure' : 'unsure', question: date ? null : 'When does it expire?' });
        continue;
      }
      if (((BILL_WORDS.test(seg) || PAY_WORDS.test(seg)) && (amount != null || priced)) || (amount != null && priced)) {
        let name = title.replace(/\s*\$[\d,.]+/g, '')
          .replace(/\s+(?:is\s+|was\s+)?(?:due|going up|goes up|up to|now)\b.*$/i, '')
          .replace(/^(?:the|my|our)\s+/i, '').replace(/[.,;:?!\s]+$/, '').trim();
        if (!name) name = (seg.match(BILL_WORDS) || seg.match(PAY_WORDS) || ['bill'])[0];
        name = name[0].toUpperCase() + name.slice(1);
        name = name.replace(CADENCE_RE, '').replace(/\s{2,}/g, ' ').replace(/[.,;:\s]+$/, '').trim() || name;
        /* the row already prints "$1,200" and "Sat 1" beside the name, so a name
           that repeats them — "Rent 1200 on the 1st" — is just noise twice over */
        const tidy = stripWhen(amount != null ? name.replace(/\$?\b\d[\d,]*(?:\.\d+)?\b/, ' ') : name)
          .replace(/\s+(?:on|by|due|for|of|at)\s*$/i, '')
          .replace(/\s{2,}/g, ' ').replace(/[.,;:\s]+$/, '').trim();
        if (tidy) name = tidy;
        items.push({ kind: 'bill', text: name, quote: seg, date, time: null, amount, cadence: cad, confidence: amount && date ? 'sure' : 'unsure', question: amount ? (date ? null : 'When is it due?') : 'How much is it?' });
        continue;
      }
      if (HEALTH_RE.test(seg) && (date || time)) {
        items.push({ kind: 'health', text: title, quote: seg, date, time, amount: null, confidence: 'sure', question: null });
        continue;
      }
      if (GOAL_RE.test(seg)) {
        items.push({ kind: 'goal', text: title, quote: seg, date: null, time: null, amount: null, confidence: 'sure', question: null });
        continue;
      }
      if (HEDGE_RE.test(seg)) {
        if (imperative || date) items.push({ kind: 'task', text: title, quote: seg, date, time, amount, confidence: 'unsure', question: 'To-do, or just a thought?' });
        continue; // pure musing → let it stay a scrap
      }
      if (imperative || (date && seg.split(' ').length <= 10)) {
        const routine = ROUTINE_RE.test(seg);
        items.push({ kind: routine ? 'routine' : 'task', text: title, quote: seg, date, time, amount, confidence: 'sure', question: null });
        continue;
      }
      if (/\b(idea|what if|should try|would be cool)\b/i.test(seg)) {
        items.push({ kind: 'idea', text: title, quote: seg, date: null, time: null, amount: null, confidence: 'sure', question: null });
      }
      /* everything else is chatter — the librarian files nothing rather than junk */
    }
    return items;
  }
  function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }
  NB.localExtract = localExtract;

  /* ---------------- the Claude brain (BYOK, direct from browser) ---------------- */
  const EXTRACT_SCHEMA = {
    type: 'object', additionalProperties: false,
    properties: {
      items: {
        type: 'array',
        items: {
          type: 'object', additionalProperties: false,
          properties: {
            kind: { type: 'string', enum: ['task', 'routine', 'bill', 'goal', 'idea', 'renewal', 'debt', 'health'] },
            text: { type: 'string', description: 'Short imperative label for the notebook, ≤60 chars.' },
            quote: { type: 'string', description: 'The verbatim source span this came from.' },
            date: { type: ['string', 'null'], description: 'YYYY-MM-DD, or null.' },
            time: { type: ['string', 'null'], description: '24h HH:MM or null.' },
            amount: { type: ['number', 'null'] },
            dir: { type: ['string', 'null'], enum: ['they', 'me', null], description: 'debt only: they owe user, or user owes them.' },
            cadence: { type: ['string', 'null'], enum: ['weekly', 'fortnightly', 'monthly', 'quarterly', 'yearly', 'once', null], description: 'bill only: how often it repeats. Default monthly; fortnightly for "every 2 weeks".' },
            confidence: { type: 'string', enum: ['sure', 'unsure'] },
            question: { type: ['string', 'null'], description: 'ONE short question if unsure, else null.' },
          },
          required: ['kind', 'text', 'quote', 'date', 'time', 'amount', 'dir', 'cadence', 'confidence', 'question'],
        },
      },
    },
    required: ['items'],
  };

  const EXTRACT_SYSTEM = (today) => `You are the librarian of a personal notebook. The user pastes messy real life — chats, thoughts, threads. You extract ONLY genuinely actionable or file-worthy items and nothing else.

Rules, non-negotiable:
- Be conservative. Fewer, higher-confidence items. Past-tense chatter, jokes, and social filler produce NOTHING. Cap at 6 items.
- Never invent details. Every item cites the verbatim source span in "quote". Missing facts stay null — never guessed.
- Resolve relative dates against today: ${today} (${dayName(today)}). Output dates as YYYY-MM-DD.
- Bills repeat: set cadence from the words ("every 2 weeks" → fortnightly, "quarterly", "annual" → yearly). Monthly if unsaid. For a non-monthly bill, date is the NEXT time it lands.
- kinds: task (a one-off to-do) · routine (recurring keep-up, "every sunday") · bill (money due: amount and/or due date) · goal (aspiration: "finally", "this year") · idea (someday thought, not actionable now) · renewal (passport/rego/insurance/lease expiry) · debt (who owes whom, money or favours) · health (appointment/meds — keep text plain and kind).
- Hedged or ambiguous ("idk maybe talk to Dana?") → confidence "unsure" with ONE short question ("To-do, or just a thought?"). Never confidently file a guess.
- "text" is a clean, short label in the user's own words where possible.`;

  async function claudeExtract(text) {
    const key = state.settings.apiKey;
    const body = {
      model: state.settings.model || DEFAULT_MODEL,
      /* headroom: these models think by default, and max_tokens caps thinking
         AND the reply together — too tight a budget truncates the JSON. */
      max_tokens: 8000,
      output_config: { effort: 'low', format: { type: 'json_schema', schema: EXTRACT_SCHEMA } },
      system: EXTRACT_SYSTEM(todayKey()),
      messages: [{ role: 'user', content: text.slice(0, 8000) }],
    };
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error((err.error && err.error.message) || `API ${res.status}`);
    }
    const msg = await res.json();
    if (msg.stop_reason === 'refusal') throw new Error('That one was declined.');
    const textBlock = (msg.content || []).find((b) => b.type === 'text');
    if (!textBlock || !textBlock.text) throw new Error('Empty reply — try a shorter dump.');
    let parsed;
    try { parsed = JSON.parse(textBlock.text); } catch (e) { throw new Error('Couldn\'t read the reply — try again.'); }
    return (parsed.items || []).slice(0, 6);
  }

  /* One front door: Claude if a key is set, the local brain otherwise (or on failure). */
  async function extract(text) {
    if (state.settings.apiKey) {
      try {
        const items = await claudeExtract(text);
        return { items, brain: 'claude' };
      } catch (e) {
        return { items: localExtract(text), brain: 'local', note: e.message };
      }
    }
    return { items: localExtract(text), brain: 'local' };
  }
  NB.extract = extract;

  /* File extraction results into real notebook items. Returns {filed:[], parked:[]} */
  function fileExtraction(raw, via) {
    const filed = [], parked = [];
    const today = todayKey();
    for (const r of raw) {
      const src = { quote: r.quote || '', at: new Date().toISOString(), via: via || 'paste' };
      const unsure = r.confidence === 'unsure';
      let it = null;
      const norm = (d) => (d && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : null);

      if (r.kind === 'bill') {
        const due = norm(r.date);
        const cad = CADENCE[r.cadence] ? r.cadence : 'monthly';
        it = addItem({
          kind: 'bill', text: r.text, ink: !unsure && r.amount != null, source: src, bucket: 'day', date: null,
          bill: {
            amount: r.amount, estimated: r.amount == null || unsure,
            /* monthly keeps a day-of-month; any other rhythm counts from the date itself */
            dueDay: cad === 'monthly' && due ? Number(due.slice(8)) : null,
            anchor: cad === 'monthly' ? null : due,
            autopay: false, cadence: cad, paid: {}, since: todayKey(),
          },
        });
      } else if (r.kind === 'renewal') {
        it = addItem({ kind: 'renewal', text: r.text, ink: !unsure, source: src, bucket: 'day', renewal: { expires: norm(r.date) } });
      } else if (r.kind === 'debt') {
        it = addItem({ kind: 'debt', text: r.text, ink: !unsure, source: src, bucket: 'day', debt: { dir: r.dir === 'me' ? 'me' : 'they', amount: r.amount || null } });
      } else if (r.kind === 'goal') {
        it = addItem({ kind: 'goal', text: r.text, ink: !unsure, source: src, bucket: 'goals' });
      } else if (r.kind === 'idea') {
        it = addItem({ kind: 'idea', text: r.text, ink: !unsure, source: src, bucket: 'ideas' });
      } else if (r.kind === 'health') {
        it = addItem({ kind: 'health', text: r.text, ink: !unsure, source: src, bucket: 'day', date: norm(r.date), time: r.time || null });
      } else if (r.kind === 'routine') {
        it = addItem({ kind: 'routine', text: r.text.replace(ROUTINE_RE, '').trim() || r.text, ink: !unsure, source: src, bucket: 'day' });
      } else {
        const d = norm(r.date);
        it = addItem({
          kind: 'task', text: r.text, ink: !unsure, source: src,
          bucket: d ? 'day' : 'week', date: d || null, time: r.time || null,
        });
        if (d && d < today) { it.date = today; }
      }

      if (unsure) {
        it.ink = false;
        it.question = { q: r.question || 'File this — or let it go?', options: defaultQuestionOptions(it) };
        parked.push(it);
      } else {
        filed.push(it);
      }
    }
    save();
    return { filed, parked };
  }
  function defaultQuestionOptions(it) {
    if (it.kind === 'task') return [
      { label: 'to-do', act: 'keep' }, { label: 'just a thought', act: 'idea' }, { label: 'toss', act: 'toss' },
    ];
    if (it.kind === 'debt') return [
      { label: 'they owe me', act: 'owe-they' }, { label: 'I owe them', act: 'owe-me' }, { label: 'toss', act: 'toss' },
    ];
    return [{ label: 'keep it', act: 'keep' }, { label: 'toss', act: 'toss' }];
  }
  NB.fileExtraction = fileExtraction;

  /* Answer a parked sticky. */
  function answerQuestion(id, act) {
    const it = getItem(id); if (!it) return;
    withUndo(actLabel(act), () => {
      it.question = null;
      if (act === 'keep') { it.ink = true; it.carried = 0; if (it.kind === 'task' && !it.date && it.bucket === 'day') it.date = todayKey(); }
      else if (act === 'idea') { it.kind = 'idea'; it.bucket = 'ideas'; it.ink = true; it.date = null; }
      else if (act === 'someday') { it.bucket = 'someday'; it.ink = true; it.date = null; it.carried = 0; }
      else if (act === 'owe-they') { it.ink = true; if (it.debt) it.debt.dir = 'they'; }
      else if (act === 'owe-me') { it.ink = true; if (it.debt) it.debt.dir = 'me'; }
      else if (act === 'toss') { removeItem(it.id); }
    });
  }
  function actLabel(act) {
    return {
      keep: 'Kept — inked in.', idea: 'Filed to Ideas.', someday: 'Resting in Later.',
      'owe-they': 'Noted — they owe you.', 'owe-me': 'Noted — you owe them.',
      toss: 'Tossed.',
    }[act] || 'Done.';
  }
  NB.answerQuestion = answerQuestion;

  /* ---------------- the morning brief (ladder + wit budget) ---------------- */
  function brief() {
    const today = todayKey();
    const d = dayItems(today);
    const openCount = d.timed.length + d.tasks.length + d.carried.length;

    /* line 1 — the shape of the day */
    let l1;
    const timedN = d.timed.length;
    if (openCount === 0) l1 = pick([
      'The page is blank and I refuse to apologise for it.',
      'Nothing on the page. Suspicious, but I\'ll allow it.',
      'A clear day. Do something good with it.',
    ]);
    else if (openCount <= 2) l1 = pick([
      `Just ${openCount === 1 ? 'one thing' : 'two things'} today. Small day — that's allowed.`,
      `${cap(numWord(openCount))} ${openCount === 1 ? 'thing' : 'things'} today, and the rest is yours.`,
    ]);
    else l1 = pick([
      `${cap(numWord(openCount))} things today${timedN ? `, ${numWord(timedN)} with ${timedN === 1 ? 'a clock' : 'clocks'} on ${timedN === 1 ? 'it' : 'them'}` : ''}.`,
      `A full page: ${numWord(openCount)} things${timedN ? `, first clock at ${fmtTime(d.timed[0].time)}` : ''}.`,
    ]);

    /* line 2 — THE heads-up, by the ladder. Wit OFF here. */
    let l2 = null;
    const healthSoon = state.items.find((i) => i.kind === 'health' && !i.done && i.date && daysUntil(i.date) >= 0 && daysUntil(i.date) <= 1);
    const billSoon = state.items
      .filter((i) => i.kind === 'bill' && i.bill && !i.bill.autopay && !billPaid(i) && billDueDate(i))
      .map((i) => ({ i, du: daysUntil(billDueDate(i)) }))
      .filter((x) => x.du <= 3).sort((a, b) => a.du - b.du)[0];
    const renewalSoon = state.items
      .filter((i) => i.kind === 'renewal' && i.renewal && i.renewal.expires)
      .map((i) => ({ i, du: daysUntil(i.renewal.expires) }))
      .filter((x) => x.du >= 0 && x.du <= 42).sort((a, b) => a.du - b.du)[0];

    if (healthSoon) l2 = `${healthSoon.text} — ${daysUntil(healthSoon.date) === 0 ? 'today' : 'tomorrow'}${healthSoon.time ? ` at ${fmtTime(healthSoon.time)}` : ''}.`;
    else if (billSoon) l2 = `${billSoon.i.text}${billSoon.i.bill.amount ? `, $${fmtAmt(billSoon.i.bill.amount)}` : ''}, ${dueWord(billSoon.du)} — not on autopay, so it needs you.`;
    else if (renewalSoon) l2 = `${renewalSoon.i.text} — ${renewalSoon.du} days out. Time to start.`;
    else if (d.timed[0]) l2 = `First up: ${d.timed[0].text} at ${fmtTime(d.timed[0].time)}.`;
    else l2 = 'Nothing is due. I checked twice.';

    /* line 3 — one gentle nudge */
    let l3 = null;
    const goal = state.items.find((i) => i.kind === 'goal' && !i.done);
    const carriedOne = d.carried[0];
    const debtOwed = state.items.find((i) => i.kind === 'debt' && !i.done && i.debt && i.debt.dir === 'they');
    const idea = state.items.find((i) => i.kind === 'idea' && !i.done);
    const dayN = fromKey(today).getDate();
    const rot = dayN % 4;
    if (rot === 0 && goal) l3 = pick([`"${goal.text}" is still on the horizon. One small move counts.`, `The ${goal.text.toLowerCase()} page is patient, not gone.`]);
    else if (rot === 1 && carriedOne) l3 = `"${carriedOne.text}" came along again. No judgement — just noticing.`;
    else if (rot === 2 && debtOwed) l3 = `${debtOwed.text} — a nudge isn't rude, it's bookkeeping.`;
    else if (idea) l3 = pick([`"${idea.text}" has been sitting in Ideas, whistling innocently.`, `Ideas holds "${idea.text}" whenever you're ready.`]);
    else if (goal) l3 = `"${goal.text}" is still on the horizon. One small move counts.`;
    else l3 = pick(['Tick something and watch it arrive in Done, proud.', 'Add anything at any time — it gets sorted for you.']);

    return { l1, l2, l3 };
  }
  function dueWord(du) { return du < 0 ? 'still open' : du === 0 ? 'due today' : du === 1 ? 'due tomorrow' : `due in ${du} days`; }
  function fmtTime(t) {
    if (!t) return '';
    let [h, m] = t.split(':').map(Number);
    const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
    return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`;
  }
  function fmtAmt(n) {
    const v = Number(n);
    /* show cents when there are cents — $142.5 reads like a typo */
    return v.toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits: 2 });
  }
  function numWord(n) { return ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'][n] || String(n); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  NB.brief = brief; NB.fmtTime = fmtTime; NB.fmtAmt = fmtAmt;

  /* ---------------- flip to… (search) ---------------- */
  /* Words that carry no signal in a question to the book. */
  const STOPWORDS = new Set(('a an and any are as at be been by can did do does for from get got has have how i if in is it its me my of on or our so the their them then there these they this to was we were what when where which who whom why will with you your').split(' '));

  /* Match on terms, not the whole phrase. This used to be hay.includes(needle)
     with the entire question as the needle — so "when's rent due?" only matched
     an item literally containing that sentence, and the keyless Desk answered
     "nothing in the book" to almost everything. */
  function search(q) {
    const needle = q.trim().toLowerCase();
    if (!needle) return [];
    const terms = needle.replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/)
      .filter((w) => w.length > 1 && !STOPWORDS.has(w));
    if (!terms.length) return [];
    const scored = [];
    for (const it of state.items) {
      const hay = `${it.text} ${(it.source && it.source.quote) || ''} ${it.kind}`.toLowerCase();
      let n = 0;
      /* "bills" should find a bill — the plural is how people ask */
      for (const t of terms) if (hay.includes(t) || (t.endsWith('s') && hay.includes(t.slice(0, -1)))) n++;
      if (!n) continue;
      /* the whole phrase landing intact is worth more than the sum of its words */
      scored.push({ it, n: hay.includes(needle) ? n + terms.length : n });
    }
    return scored.sort((a, b) => b.n - a.n).slice(0, 12).map((s) => s.it);
  }
  NB.search = search;

  /* ---------------- the Desk (ask the book) ---------------- */
  function notebookDigest() {
    const compact = state.items.filter((i) => !i.sample).map((i) => {
      const o = { kind: i.kind, text: i.text };
      if (i.date) o.date = i.date;
      if (i.time) o.time = i.time;
      if (i.done) o.done = true;
      if (i.bucket && !['day'].includes(i.bucket)) o.where = i.bucket;
      if (i.bill) { o.amount = i.bill.amount; o.due = billDueDate(i); o.every = cadenceLabel(i); o.autopay = i.bill.autopay; o.paidThisCycle = billPaid(i); }
      if (i.renewal) o.expires = i.renewal.expires;
      if (i.debt) o.direction = i.debt.dir === 'they' ? 'they owe user' : 'user owes them';
      return o;
    });
    return JSON.stringify(compact);
  }

  async function askDesk(question) {
    const matches = search(question);
    if (!state.settings.apiKey) {
      return {
        reply: matches.length ? 'Here\'s what the book has on that.' : 'Nothing saved about that. Add a Claude key in Settings for fuller answers.',
        matches, brain: 'local',
      };
    }
    const body = {
      model: state.settings.model || DEFAULT_MODEL,
      max_tokens: 2000,   /* thinking shares this budget — 300 truncated the reply */
      system: `You are the librarian of the user's personal notebook — sharp, dry, warm underneath. Answer in AT MOST two short sentences, first person. Wit lands on things, never the user; go plain and kind on health, money stress, or anything missed. Today is ${todayKey()} (${dayName(todayKey())}). Answer ONLY from the notebook JSON below; if it isn't in the book, say so plainly. Never invent dates or amounts.\n\nNOTEBOOK: ${notebookDigest()}`,
      messages: [{ role: 'user', content: question.slice(0, 500) }],
    };
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': state.settings.apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify(body),
      });
      if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error((err.error && err.error.message) || `API ${res.status}`); }
      const msg = await res.json();
      const textBlock = (msg.content || []).find((b) => b.type === 'text');
      return { reply: (textBlock && textBlock.text) || '…', matches, brain: 'claude' };
    } catch (e) {
      return { reply: `I couldn't get to the shelves just now (${e.message}). Nothing was lost — try me again in a moment.`, matches, brain: 'local' };
    }
  }
  NB.askDesk = askDesk;

  /* ---------------- export / import ---------------- */
  /* Export never carries the API key — it stays on this device. */
  NB.exportJSON = () => JSON.stringify({ ...state, settings: { ...state.settings, apiKey: '', gistToken: '' } }, null, 2);
  NB.importJSON = (raw) => {
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.items)) throw new Error('That doesn\'t look like a notebook.');
    /* Regenerate ids and vet option acts — an imported file is untrusted input. */
    parsed.items.forEach((it) => {
      it.id = uid();
      if (it.question && Array.isArray(it.question.options)) {
        it.question.options = it.question.options
          .filter((o) => o && typeof o.act === 'string' && /^[a-z-]{1,20}$/.test(o.act))
          .map((o) => ({ label: String(o.label || o.act).slice(0, 40), act: o.act }));
      }
    });
    const base = DEFAULT_STATE();
    state = { ...base, ...parsed, settings: { ...base.settings, ...(parsed.settings || {}), apiKey: state.settings.apiKey, gistToken: state.settings.gistToken } };
    undoSnap = null;
    save();
  };

  /* ---------------- first-run seed (watermarked, self-erasing) ---------------- */
})();

</script>
<script>
/* =========================================================================
   My Notebook — ui.js
   Everything you see: the week spread, Today, the sort, the Back Pages,
   the Desk, and the flyleaf. Renders from NB (core.js).
   ========================================================================= */
(function () {
  'use strict';
  const $ = (sel, el) => (el || document).querySelector(sel);
  const D = NB.dates;

  /* ---------------- ui state ---------------- */
  let view = 'today';                 /* today | week | money | notes | done */
  let backTab = 'bills';              /* Money page: bills | owed | renewals */
  let notesTab = 'ideas';             /* Notes page: ideas | goals | health */
  let expandedId = null;
  let whisperTimer = null;

  /* ---------------- helpers ---------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function ord(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

  /* ---------------- theme ---------------- */
  function applyTheme() {
    const s = NB.state().settings;
    const auto = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
    document.documentElement.dataset.theme = s.theme === 'auto' ? auto : s.theme;
    document.body.classList.toggle('plain-hand', !!s.plainHand);
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  /* ---------------- whisper (6s undo) ---------------- */
  NB.onWhisper = (label) => {
    const w = $('#whisper');
    w.hidden = false;
    w.innerHTML = `<span class="hand">${esc(label)}</span><button class="undo-btn" data-act="undo" type="button">undo</button><span class="undo-bar"><span class="undo-fill"></span></span>`;
    requestAnimationFrame(() => { const f = $('.undo-fill', w); if (f) f.style.width = '0%'; });
    clearTimeout(whisperTimer);
    whisperTimer = setTimeout(() => { w.hidden = true; }, 6000);
  };
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-act="undo"]')) {
      if (NB.undo()) { $('#whisper').hidden = true; render(); }
    }
  });

  /* ---------------- tabs ---------------- */
  const TABS = [
    { id: 'today', label: 'Today', wash: '' },
    { id: 'week', label: 'Week', wash: '' },
    { id: 'money', label: 'Money', wash: '' },
    { id: 'notes', label: 'Notes', wash: '' },
    { id: 'done', label: 'Done', wash: '' },
  ];
  function renderTabs() {
    const moneyDot = NB.itemsFor((i) => i.question && ['bill', 'renewal', 'debt'].includes(i.kind)).length > 0;
    const notesDot = NB.itemsFor((i) => i.question && ['health', 'idea', 'goal'].includes(i.kind)).length > 0;
    const dotFor = (id) => (id === 'money' && moneyDot) || (id === 'notes' && notesDot);
    $('#tabs').innerHTML = TABS.map((t) =>
      `<button type="button" class="tab ${view === t.id ? 'on' : ''}" data-view="${t.id}">${t.label}${dotFor(t.id) ? '<span class="tab-dot"></span>' : ''}</button>`
    ).join('');
  }

  /* ---------------- item rows ---------------- */
  function rowHTML(it, opts) {
    opts = opts || {};
    const open = expandedId === it.id;
    const pencil = !it.ink ? 'pencil' : '';
    const sample = it.sample ? 'sample' : '';
    const carried = it.carried > 0 ? `<span class="carry" title="carried ${it.carried}×">↪</span>` : '';
    const time = it.time ? `<span class="timechip fig">${esc(NB.fmtTime(it.time))}</span>` : '';
    const money = it.bill && it.bill.amount != null ? `<span class="moneytag fig">$${esc(NB.fmtAmt(it.bill.amount))}</span>` : '';
    const glyph = { goal: '★ ', idea: '✎ ', routine: '⟲ ' }[it.kind] || '';
    const tickCls = it.done ? 'checked' : '';
    return `
    <div class="row ${pencil} ${sample} ${it.done ? 'is-done' : ''}" data-id="${it.id}">
      <div class="row-main">
        ${carried}
