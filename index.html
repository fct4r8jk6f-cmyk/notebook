        <button class="tick ${tickCls}" data-act="tick" type="button" aria-label="tick">${it.done ? '✓' : ''}</button>
        ${time}
        <span class="row-text hand" data-act="open">${glyph}${esc(it.text)}</span>
        ${money}
        ${it.sample ? '<span class="sampletag">sample</span>' : ''}
      </div>
      ${it.question ? stickyHTML(it) : ''}
      ${open ? detailHTML(it) : ''}
    </div>`;
  }

  function stickyHTML(it) {
    return `
    <div class="sticky" data-id="${it.id}">
      <div class="sticky-q hand">${esc(it.question.q)}</div>
      <div class="sticky-chips">
        ${it.question.options.map((o) => `<button type="button" class="chip" data-act="answer" data-answer="${o.act}">${esc(o.label)}</button>`).join('')}
      </div>
    </div>`;
  }

  function detailHTML(it) {
    const src = it.source;
    const viaGlyph = { paste: '⌨', share: '📱', librarian: '✒︎', manual: '✎' }[src && src.via] || '⌨';
    const receipt = src && src.quote
      ? `<div class="receipt fig">${viaGlyph} ${src.via === 'librarian' ? '' : 'you wrote: '}<span class="q hand">“${esc(src.quote)}”</span></div>`
      : `<div class="receipt fig">✎ added by hand</div>`;
    const when = ['task', 'scrap', 'health'].includes(it.kind) ? `
      <div class="whenpill">
        <span class="when-label fig">When?</span>
        ${['Today', 'Tomorrow', 'This week', 'Next week', 'Someday'].map((w) => `<button type="button" class="chip" data-act="when" data-when="${w}">${w}</button>`).join('')}
      </div>` : '';
    const billBits = it.kind === 'bill' && it.bill ? `
      <div class="bill-edit fig">
        <label>amount $<input data-edit="amount" type="number" step="0.01" value="${it.bill.amount != null ? it.bill.amount : ''}" placeholder="?"></label>
        <label>how often <select data-edit="cadence">
          ${Object.keys(NB.CADENCE).map((c) => `<option value="${c}"${c === NB.billCadence(it) ? ' selected' : ''}>${esc(NB.CADENCE[c].label)}</option>`).join('')}
        </select></label>
        ${NB.billCadence(it) === 'monthly' && !it.bill.anchor
          ? `<label>due day <input data-edit="dueDay" type="number" min="1" max="31" value="${it.bill.dueDay || ''}" placeholder="?"></label>`
          : `<label>next due <input data-edit="anchor" type="date" value="${esc(it.bill.anchor || '')}"></label>`}
        <label class="autolabel"><input data-edit="autopay" type="checkbox" ${it.bill.autopay ? 'checked' : ''}> autopay</label>
      </div>` : '';
    const renewalBits = it.kind === 'renewal' && it.renewal ? `
      <div class="bill-edit fig"><label>expires <input data-edit="expires" type="date" value="${esc(it.renewal.expires || '')}"></label></div>` : '';
    return `
    <div class="detail">
      ${receipt}
      <div class="edit-line"><input class="edit-text hand" data-edit="text" value="${esc(it.text)}" aria-label="Edit text"></div>
      ${billBits}${renewalBits}
      ${when}
      <div class="detail-acts fig">
        <button type="button" class="linky" data-act="toss">toss</button>
        ${it.done ? '<button type="button" class="linky" data-act="restore">restore</button>' : ''}
      </div>
    </div>`;
  }

  /* ---------------- views ---------------- */
  function pageTitle(t, sub) {
    return `<div class="pagehead"><h1 class="pagetitle">${t}<span class="underline"></span></h1>${sub ? `<span class="pagesub fig">${sub}</span>` : ''}</div>`;
  }

  function todayView() {
    const t = D.todayKey();
    const d = NB.dayItems(t);
    const meta = NB.state().meta;
    const folded = meta.briefFoldedFor === t;
    const b = NB.brief();
    const routines = NB.itemsFor((i) => i.kind === 'routine');
    const parked = NB.itemsFor((i) => i.question && ['task', 'scrap', 'idea', 'goal'].includes(i.kind)
      && !((i.kind === 'task' || i.kind === 'scrap') && i.bucket === 'day' && i.date === t));

    const brief = folded
      ? `<button type="button" class="brief-fold hand" data-act="unfold">✳ this morning</button>`
      : `<div class="brief">
          <span class="brief-date fig">${esc(D.niceDate(t))}</span>
          <p class="hand">${esc(b.l1)}</p>
          <p class="hand plain">${esc(b.l2)}</p>
          <p class="hand">${esc(b.l3)}</p>
          <span class="flourish">✳</span>
          <button type="button" class="brief-x fig" data-act="fold" aria-label="fold the note">fold</button>
        </div>`;

    const echoes = d.echoes.map(echoHTML).join('');
    return `
      ${pageTitle('Today', esc(D.dayName(t)) )}
      ${brief}
      <div class="rows">
        ${d.timed.map((i) => rowHTML(i)).join('')}
        ${echoes}
        ${d.tasks.map((i) => rowHTML(i)).join('')}
        ${d.carried.map((i) => rowHTML(i)).join('')}
      </div>
      ${d.timed.length + d.tasks.length + d.carried.length + d.echoes.length === 0 ? emptyLine('Nothing today. Tap Add and paste whatever\'s on your mind — it gets sorted for you.') : ''}
      ${routines.length ? `<div class="routines"><span class="r-label fig">keeping up</span>${routines.map((r) => `<button type="button" class="rchip hand ${r.done ? 'rdone' : ''}" data-id="${r.id}" data-act="tick">${r.done ? '●' : '○'} ${esc(r.text)}</button>`).join('')}</div>` : ''}
      ${parked.length ? `<div class="tray"><span class="tray-label hand">✎ a quick word?</span>${parked.map((i) => rowHTML(i)).join('')}</div>` : ''}
    `;
  }

  function echoHTML(e) {
    const it = e.item;
    const cls = { bill: 'e-bill', renewal: 'e-renewal', health: 'e-health' }[e.echo];
    const tick = e.echo === 'bill' ? `<button class="tick small" data-act="paybill" type="button" aria-label="mark paid"></button>`
      : e.echo === 'health' ? `<button class="tick small" data-act="tick" type="button"></button>` : '';
    const label = esc(it.text);
    const amt = it.bill && it.bill.amount != null ? `<span class="fig e-amt">· $${NB.fmtAmt(it.bill.amount)}</span>` : '';
    const auto = it.bill && it.bill.autopay ? `<span class="autotag fig">auto</span>` : '';
    return `<div class="echo ${cls}" data-id="${it.id}">${tick}<span class="hand e-text" data-act="goback">${label}</span>${amt}${auto}<span class="dogear" title="lives in the Back Pages" data-act="goback"></span></div>`;
  }

  function weekView() {
    const t = D.todayKey();
    const week = D.weekOf(t);
    const weekBand = NB.itemsFor((i) => !i.done && i.bucket === 'week');
    const later = NB.itemsFor((i) => !i.done && i.bucket === 'someday');
    const upcoming = NB.itemsFor((i) => !i.done && (i.kind === 'task' || i.kind === 'scrap') && i.bucket === 'day' && i.date && i.date > week[6]);
    const cols = week.map((key) => {
      const d = NB.dayItems(key);
      const isToday = key === t;
      const isPast = key < t;
      const all = [...d.timed, ...d.echoes.map((e) => e), ...d.tasks, ...d.carried];
      const rows = [
        ...d.timed.map((i) => rowHTML(i)),
        ...d.echoes.map(echoHTML),
        ...d.tasks.map((i) => rowHTML(i)),
        ...d.carried.map((i) => rowHTML(i)),
      ].join('');
      return `
      <section class="day ${isToday ? 'is-today' : ''} ${isPast ? 'is-past' : ''}">
        <header class="dayhead"><span class="dayname fig">${esc(D.dayName(key, true))}</span>${isToday ? '<span class="todaytag fig">today</span>' : ''}<span class="daynum hand">${Number(key.slice(8))}</span></header>
        <div class="rows small">${rows || '<div class="dayempty"></div>'}</div>
        <button type="button" class="addday fig" data-act="addday" data-date="${key}">+</button>
      </section>`;
    }).join('');

    return `
      ${pageTitle('This week', `${esc(D.niceDate(week[0]))} – ${esc(D.niceDate(week[6]))}`)}
      <div class="weekscroll"><div class="week">${cols}</div></div>
      ${weekBand.length ? `<div class="band"><span class="band-label fig">this week, no day yet</span><div class="rows">${weekBand.map((i) => rowHTML(i)).join('')}</div></div>` : ''}
      ${upcoming.length ? `<div class="band"><span class="band-label fig">next up</span><div class="rows">${upcoming.sort((a, b) => (a.date || '').localeCompare(b.date || '')).map((i) => `<div class="row" data-id="${i.id}"><div class="row-main"><button class="tick" data-act="tick" type="button" aria-label="tick"></button><span class="row-text hand" data-act="open">${esc(i.text)}</span><span class="bwhen fig">${esc(D.niceDate(i.date))}</span></div></div>`).join('')}</div></div>` : ''}
      ${later.length ? `<div class="band later"><span class="band-label fig">later</span><div class="rows">${later.map((i) => rowHTML(i)).join('')}</div></div>` : ''}
    `;
  }

  function goalsPage() {
    const goals = NB.itemsFor((i) => i.kind === 'goal' && !i.done);
    const doneGoals = NB.itemsFor((i) => i.kind === 'goal' && i.done);
    return `
      <div class="rows">${goals.map((i) => rowHTML(i)).join('')}</div>
      ${goals.length === 0 ? emptyLine('No goals yet. Anything starting "finally" or "this year" lands here.') : ''}
      ${doneGoals.length ? `<div class="band"><span class="band-label fig">reached</span><div class="rows">${doneGoals.map((i) => rowHTML(i)).join('')}</div></div>` : ''}
    `;
  }

  function ideasPage() {
    const ideas = NB.itemsFor((i) => (i.kind === 'idea' || i.kind === 'scrap') && !i.done);
    return `
      <div class="rows">${ideas.map((i) => rowHTML(i)).join('')}</div>
      ${ideas.length === 0 ? emptyLine('Nothing here yet. Half-thoughts land here — no dates, no pressure.') : ''}
    `;
  }

  /* "2026-07-22" is a filename, not a day. */
  function doneDayLabel(k) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return esc(k);
    const t = D.todayKey();
    if (k === t) return 'today';
    if (k === D.addDays(t, -1)) return 'yesterday';
    return esc(D.niceDate(k));
  }

  function doneView() {
    const done = NB.itemsFor((i) => i.done && i.kind !== 'routine').sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
    const groups = {};
    for (const it of done) {
      const k = it.doneKey || (it.doneAt || '').slice(0, 10) || 'earlier';
      (groups[k] = groups[k] || []).push(it);
    }
    const keys = Object.keys(groups).sort().reverse();
    return `
      ${pageTitle('Done', 'what you\'ve finished')}
      ${keys.map((k) => `
        <div class="doneday">
          <span class="band-label fig">${doneDayLabel(k)}</span>
          <div class="rows">${groups[k].map((i) => rowHTML(i)).join('')}</div>
        </div>`).join('')}
      ${done.length === 0 ? emptyLine('Nothing finished yet. Tick something off and it lands here.') : ''}
    `;
  }

  /* ---------------- back pages ---------------- */
  /* Two grouped pages instead of a nested rail of four. Everything that costs
     money sits under Money; everything you jotted sits under Notes. */
  const MONEY_TABS = [
    { id: 'bills', label: 'Bills' }, { id: 'owed', label: 'Owed' }, { id: 'renewals', label: 'Renewals' },
  ];
  const NOTES_TABS = [
    { id: 'ideas', label: 'Ideas' }, { id: 'goals', label: 'Goals' }, { id: 'health', label: 'Health' },
  ];
  const PAGES = { bills: billsPage, owed: owedPage, renewals: renewalsPage, ideas: ideasPage, goals: goalsPage, health: healthPage };

  function segmented(tabs, current) {
    return tabs.map((b) => `<button type="button" class="bthumb b-${b.id} ${current === b.id ? 'on' : ''}" data-backtab="${b.id}">${b.label}</button>`).join('');
  }
  function grouped(tabs, current) {
    if (!tabs.some((t) => t.id === current)) current = tabs[0].id;
    return `<div class="backwrap"><div class="bthumbs">${segmented(tabs, current)}</div><div class="backpage bp-${current}">${PAGES[current]()}</div></div>`;
  }
  function moneyView() { return grouped(MONEY_TABS, backTab); }
  function notesView() { return grouped(NOTES_TABS, notesTab); }

  function billsPage() {
    const bills = NB.itemsFor((i) => i.kind === 'bill' && i.bill);
    const withAmt = bills.filter((b) => b.bill.amount != null);
    /* a fortnightly bill lands twice in most months — count the hits, don't assume one */
    const thisMonth = D.monthKey(D.todayKey());
    const sums = withAmt.map((b) => ({ b, m: NB.billMonthTotals(b, thisMonth) }));
    const total = sums.reduce((s, x) => s + x.m.due, 0);
    const paid = sums.reduce((s, x) => s + x.m.paid, 0);
    const coming = total - paid;
    const needsHand = sums.filter((x) => !x.b.bill.autopay).reduce((s, x) => s + x.m.unpaid, 0);
    const auto = coming - needsHand;
    const pct = total > 0 ? Math.round((paid / total) * 100) : 0;
    const unpaid = bills.filter((b) => !NB.billPaid(b));
    const next = unpaid.filter((b) => NB.billDueDate(b)).sort((a, b) => D.daysUntil(NB.billDueDate(a)) - D.daysUntil(NB.billDueDate(b)))[0];
    const paidRows = bills.filter((b) => NB.billPaid(b));

    const row = (b) => {
      const due = NB.billDueDate(b);
      const du = due ? D.daysUntil(due) : null;
      const open = expandedId === b.id;
      const amber = du != null && du <= 0 ? 'due-now' : du != null && du <= 3 ? 'due-soon' : '';
      const dueTxt = due ? (du < 0 ? `was due ${esc(D.dayName(due, true))} — still open` : du === 0 ? 'due today' : `${esc(D.dayName(due, true))} ${Number(due.slice(8))}`) : '—';
      /* "every month" on every line is noise — only name the unusual rhythms */
      const cad = NB.billCadence(b) === 'monthly' ? '' : NB.cadenceLabel(b);
      return `
      <div class="brow ${amber} ${b.bill.autopay ? 'is-auto' : ''} ${!b.ink ? 'pencil' : ''}" data-id="${b.id}">
        <div class="row-main">
          ${du != null && du <= 0 && !b.bill.autopay ? '<span class="flag">⚑</span>' : ''}
          <button class="tick" data-act="paybill" type="button" aria-label="mark paid"></button>
          <span class="row-text hand" data-act="open">${esc(b.text)}${b.bill.autopay ? '<span class="autotag fig">AUTOPAY</span>' : ''}${b.sample ? '<span class="sampletag">sample</span>' : ''}</span>
          <span class="bamt fig ${b.bill.estimated ? 'est' : ''}">${b.bill.amount != null ? (b.bill.estimated ? '~' : '') + '$' + NB.fmtAmt(b.bill.amount) : '$?'}</span>
        </div>
        ${due || cad ? `<div class="bmeta"><span class="bwhen fig">${due ? dueTxt : ''}</span>${cad ? `<span class="bevery fig">${esc(cad)}</span>` : ''}</div>` : ''}
        ${b.question ? stickyHTML(b) : ''}
        ${open ? detailHTML(b) : ''}
      </div>`;
    };

    return `
      <div class="money">
        <div class="money-line fig">
          <div class="mfig"><span class="n">$${NB.fmtAmt(total)}</span><span class="l">due this month</span></div>
          <div class="mfig paid"><span class="n">$${NB.fmtAmt(paid)}</span><span class="l">paid</span></div>
          <div class="mfig"><span class="n">$${NB.fmtAmt(coming)}</span><span class="l">still coming</span></div>
        </div>
        <div class="prog"><span class="ink" style="width:${pct}%"></span></div>
        ${coming > 0
          ? `<div class="money-sub hand"><span class="fig">$${NB.fmtAmt(needsHand)}</span> needs your hand · <span class="fig">$${NB.fmtAmt(auto)}</span> handles itself.</div>`
          /* "all settled" is a lie when nothing was ever due — say which it is */
          : `<div class="money-sub hand">${total > 0 ? 'All settled this month.' : 'Nothing due this month.'}</div>`}
        ${next ? `<div class="nextup hand">Next up: ${esc(next.text)}, ${esc(D.dayName(NB.billDueDate(next)))}.</div>` : ''}
      </div>
      <div class="band-label fig">still coming</div>
      <div class="rows">${unpaid.sort((a, b) => (NB.billDueDate(a) || '9').localeCompare(NB.billDueDate(b) || '9')).map(row).join('') || emptyLine('No bills yet. Add one below, or just mention it when you add a note.')}</div>
      ${paidRows.length ? `<div class="band-label fig" style="margin-top:14px">handled</div><div class="rows handled">${paidRows.map(row).join('')}</div>` : ''}
      <form class="addform fig" data-form="bill">
        <input name="name" placeholder="What's the bill?" required>
        <input name="amount" type="number" step="0.01" placeholder="$">
        <select name="cadence" aria-label="how often">
          ${Object.keys(NB.CADENCE).map((c) => `<option value="${c}"${c === 'monthly' ? ' selected' : ''}>${esc(NB.CADENCE[c].label)}</option>`).join('')}
        </select>
        <input name="first" type="date" aria-label="first due date">
        <label class="autolabel"><input name="autopay" type="checkbox"> auto</label>
        <button type="submit" class="chip">Add bill</button>
      </form>
    `;
  }

  function renewalsPage() {
    const rs = NB.itemsFor((i) => i.kind === 'renewal' && !i.done);
    const row = (r) => {
      const ex = r.renewal && r.renewal.expires;
      const du = ex ? D.daysUntil(ex) : null;
      const stateTxt = du == null ? 'no date yet' : du <= 0 ? 'expired — on your week now' : du <= 42 ? `${du} days — time to start` : `quiet 'til ${esc(D.niceDate(D.addDays(ex, -42)))}`;
      return `
      <div class="brow ${du != null && du <= 42 ? 'due-soon' : ''} ${!r.ink ? 'pencil' : ''}" data-id="${r.id}">
        <div class="row-main">
          <button class="tick" data-act="tick" type="button" aria-label="handled"></button>
          <span class="row-text hand" data-act="open">${esc(r.text)}</span>
          <span class="bwhen fig">${ex ? esc(D.niceDate(ex)) : ''}</span>
        </div>
        <div class="whisperline hand">${stateTxt}</div>
        ${r.question ? stickyHTML(r) : ''}
        ${expandedId === r.id ? detailHTML(r) : ''}
      </div>`;
    };
    return `
      <div class="rows">${rs.sort((a, b) => ((a.renewal && a.renewal.expires) || '9999').localeCompare((b.renewal && b.renewal.expires) || '9999')).map(row).join('') || emptyLine('Nothing expiring. Passports, leases and registrations land here. That\'s the whole point of me.')}</div>
      <form class="addform fig" data-form="renewal">
        <input name="name" placeholder="What renews? Passport, lease…" required>
        <input name="date" type="date">
        <button type="submit" class="chip">Add</button>
      </form>
    `;
  }

  function owedPage() {
    const debts = NB.itemsFor((i) => i.kind === 'debt' && !i.done);
    const they = debts.filter((d) => d.debt && d.debt.dir === 'they');
    const me = debts.filter((d) => d.debt && d.debt.dir !== 'they');
    const col = (list, empty) => list.map((d) => `
      <div class="brow ${!d.ink ? 'pencil' : ''}" data-id="${d.id}">
        <div class="row-main">
          <button class="tick" data-act="tick" type="button" aria-label="settled"></button>
          <span class="row-text hand" data-act="open">${esc(d.text)}</span>
          ${d.debt.amount != null ? `<span class="bamt fig">$${NB.fmtAmt(d.debt.amount)}</span>` : ''}
        </div>
        ${d.question ? stickyHTML(d) : ''}
        ${expandedId === d.id ? detailHTML(d) : ''}
      </div>`).join('') || `<div class="dayempty hand">${empty}</div>`;
    return `
      <div class="owed-cols">
        <div class="owed-col"><div class="band-label fig">owed to you</div>${col(they, 'nothing — generous friends')}</div>
        <div class="owed-col"><div class="band-label fig">you owe</div>${col(me, 'clean slate')}</div>
      </div>
      <form class="addform fig" data-form="debt">
        <input name="what" placeholder="e.g. Sam owes me 60" required>
        <button type="submit" class="chip">Add</button>
      </form>
    `;
  }

  function healthPage() {
    const hs = NB.itemsFor((i) => i.kind === 'health' && !i.done);
    return `
      <div class="rows">${hs.map((i) => rowHTML(i)).join('') || emptyLine('Nothing here right now. Appointments and prescriptions land on this page.')}</div>
      <form class="addform fig" data-form="health">
        <input name="name" placeholder="Dentist, prescription…" required>
        <input name="date" type="date">
        <input name="time" type="time">
        <button type="submit" class="chip">add</button>
      </form>
      <p class="pageplain fig">Private to this device unless sync is on.</p>
    `;
  }

  function emptyLine(text) { return `<p class="empty hand">${esc(text)}</p>`; }

  /* ---------------- render ---------------- */
  function render() {
    applyTheme();
    renderTabs();
    const v = { today: todayView, week: weekView, money: moneyView, notes: notesView, done: doneView }[view] || todayView;
    $('#page').innerHTML = v();
    $('#page').dataset.view = view;
  }

  /* ---------------- dump & sort ---------------- */
  function openDump(prefill) {
    const ov = $('#overlay');
    ov.hidden = false;
    ov.innerHTML = `
      <div class="sheet dump-sheet">
        <button type="button" class="sheet-x fig" data-act="close">✕</button>
        <h2 class="sheet-title">Add to your notebook</h2>
        <p class="sheet-sub fig">Paste a message, a list, or a stray thought. It gets sorted into the right place.</p>
        <textarea id="dump-text" class="dump-text hand" placeholder="Paste anything. A message, a list, a thought…">${esc(prefill || '')}</textarea>
        <div class="sheet-acts">
          <button type="button" class="pbtn primary" data-act="sort">Sort it</button>
          <button type="button" class="pbtn" data-act="scrap">Just keep it</button>
        </div>
        <div id="sort-stage" class="sort-stage" hidden></div>
      </div>`;
    setTimeout(() => { const ta = $('#dump-text'); if (ta) ta.focus(); }, 50);
  }

  async function runSort(via) {
    const ta = $('#dump-text');
    const text = (ta && ta.value.trim()) || '';
    if (!text) return;
    const stage = $('#sort-stage');
    stage.hidden = false;
    stage.innerHTML = `<div class="penline"><span class="pen">✒︎</span><span class="hand">reading…</span></div>`;
    const btns = document.querySelectorAll('.sheet-acts .pbtn');
    btns.forEach((b) => (b.disabled = true));

    const { items: raw, brain, note } = await NB.extract(text);
    NB.clearSamples();

    if (!raw.length) {
      NB.withUndo('Kept as a scrap — nothing jumped out at me.', () => {
        NB.addItem({ kind: 'idea', text: text.length > 60 ? text.slice(0, 57) + '…' : text, ink: false, bucket: 'ideas', source: { quote: text.slice(0, 200), at: new Date().toISOString(), via } });
      });
      closeOverlay(); render(); return;
    }

    let result = null;
    NB.withUndo(tallyLabel(raw), () => { result = NB.fileExtraction(raw, via); });

    /* overlay was closed mid-sort — still land the items, just re-render the page */
    if (!document.querySelector('#sort-stage')) { closeOverlay(); render(); return; }

    const tabOf = (it) => it.kind === 'bill' ? 'Bills' : it.kind === 'renewal' ? 'Renewals' : it.kind === 'debt' ? 'Owed' : it.kind === 'health' ? 'Health' : it.kind === 'goal' ? 'Goals' : it.kind === 'idea' ? 'Ideas' : it.date ? D.dayName(it.date, true) : 'This week';
    stage.innerHTML = `
      <div class="sorted">
        ${result.filed.map((it, i) => `<div class="sorted-row" style="animation-delay:${i * 120}ms"><span class="hand">${esc(it.text)}</span><span class="fig sorted-tab">→ ${esc(tabOf(it))}</span></div>`).join('')}
        ${result.parked.map((it, i) => `<div class="sorted-row parked" style="animation-delay:${(result.filed.length + i) * 120}ms"><span class="hand">${esc(it.text)}</span><span class="fig sorted-tab">✎ a quick word</span></div>`).join('')}
        <div class="sorted-tally hand">${esc(tallyLabel(raw))}${brain === 'local' ? ' <span class="fig">(sorted offline' + (note ? ' — ' + esc(note) : '') + ')</span>' : ''}</div>
        <button type="button" class="pbtn primary" data-act="close-rerender">Lovely</button>
      </div>`;
  }
  function tallyLabel(raw) {
    const sure = raw.filter((r) => r.confidence !== 'unsure').length;
    const unsure = raw.length - sure;
    if (!sure) return `Parked ${unsure} — ${unsure === 1 ? 'it needs' : 'they need'} a quick word.`;
    return `Filed ${sure}.${unsure ? ` ${unsure} need${unsure === 1 ? 's' : ''} a quick word.` : ''}`;
  }

  /* ---------------- the Desk ---------------- */
  function openDesk() {
    const ov = $('#overlay');
    ov.hidden = false;
    ov.innerHTML = `
      <div class="sheet desk-sheet">
        <button type="button" class="sheet-x fig" data-act="close">✕</button>
        <div class="desk-cap">Ask your notebook</div>
        <div id="desk-log" class="desk-log">
          <p class="lib-line hand">Ask me anything I've filed. "When's rent due?" "What's my week look like?" I did the reading — it's sort of my whole thing.</p>
        </div>
        <form id="desk-form" class="desk-input">
          <input id="desk-q" class="desk-q hand" placeholder="Ask about anything you've saved…" autocomplete="off">
        </form>
      </div>`;
    setTimeout(() => { const q = $('#desk-q'); if (q) q.focus(); }, 50);
  }

  async function deskAsk(q) {
    const log = $('#desk-log');
    log.insertAdjacentHTML('beforeend', `<p class="you-line hand">${esc(q)}</p><p class="lib-line hand thinking">…</p>`);
    log.scrollTop = log.scrollHeight;
    const res = await NB.askDesk(q);
    const th = $('.thinking', log);
    if (th) th.remove();
    const pins = res.matches.slice(0, 3).map((m) => `
      <div class="pin" data-id="${m.id}">
        <span class="clip">📎</span>
        <span class="hand">${esc(m.text)}</span>
        ${m.date ? `<span class="fig pin-when">${esc(D.niceDate(m.date))}</span>` : ''}
        ${m.done ? '<span class="fig pin-when">done ✓</span>' : ''}
      </div>`).join('');
    log.insertAdjacentHTML('beforeend', `<p class="lib-line hand">${esc(res.reply)}</p>${pins}`);
    log.scrollTop = log.scrollHeight;
  }

  /* ---------------- flyleaf (settings) ---------------- */
  /* the sync state, said plainly */
  function syncLine() {
    const st = NB.sync || { status: 'off' };
    if (!NB.state().settings.gistToken) return 'Not syncing — no token yet.';
    if (st.status === 'syncing') return 'Catching up…';
    if (st.status === 'error') return st.detail || 'Couldn\'t reach GitHub. It\'ll try again.';
    if (st.at) {
      const d = new Date(st.at);
      const mins = Math.round((Date.now() - d.getTime()) / 60000);
      return mins < 1 ? 'Up to date, just now.' : mins < 60 ? `Up to date, ${mins} min ago.` : `Last synced ${D.niceDate(D.toKey(d))}.`;
    }
    return 'Ready to sync.';
  }

  function openSettings() {
    const s = NB.state().settings;
    const ov = $('#overlay');
    ov.hidden = false;
    ov.innerHTML = `
      <div class="sheet settings-sheet">
        <button type="button" class="sheet-x fig" data-act="close">✕</button>
        <h2 class="sheet-title">Settings</h2>
        <div class="set fig">
          <label>Paper
            <select data-set="theme">
              <option value="auto" ${s.theme === 'auto' ? 'selected' : ''}>match the room</option>
              <option value="day" ${s.theme === 'day' ? 'selected' : ''}>daylight</option>
              <option value="night" ${s.theme === 'night' ? 'selected' : ''}>lamplight</option>
            </select>
          </label>
          <label class="autolabel"><input type="checkbox" data-set="plainHand" ${s.plainHand ? 'checked' : ''}> My handwriting, but make it print</label>
          <label>Claude API key <span class="hint">(optional · stays on this device only)</span>
            <input type="password" data-set="apiKey" value="${esc(s.apiKey)}" placeholder="sk-ant-…">
          </label>
          <label>Which brain <span class="hint">(only matters with a key)</span>
            <select data-set="model">
              ${NB.MODELS.map((m) => `<option value="${m.id}"${m.id === (s.model || '') ? ' selected' : ''}>${esc(m.label)} · ${esc(m.note)}</option>`).join('')}
            </select>
          </label>
          <p class="hint">No key? I still sort with my offline brain — just less cleverly. Keys come from console.anthropic.com; a sort costs about a cent.</p>
          <label>This notebook, on all my devices <span class="hint">(optional · a GitHub token, stays on this device)</span>
            <input type="password" data-set="gistToken" value="${esc(s.gistToken || '')}" placeholder="ghp_…">
          </label>
          <p class="hint">Make one at github.com/settings/tokens with the <b>gist</b> scope. Your book lives in a private gist only you can read; paste the same token on another device and the two keep each other up to date.</p>
          <div class="set-acts">
            <button type="button" class="pbtn" data-act="syncnow">Sync now</button>
            <span class="synced hint" id="sync-line">${esc(syncLine())}</span>
          </div>
          <div class="set-acts">
            <button type="button" class="pbtn" data-act="export">Export notebook</button>
            <label class="pbtn filebtn">Import<input type="file" accept=".json" data-act="import" hidden></label>
          </div>
          <div class="set-acts">
            <button type="button" class="pbtn danger" data-act="closebook">Close the notebook</button>
          </div>
          <p class="hint">Close = wipe this device. Export first if you want to carry it. Nothing is left behind — frankly, it was never any of this machine's business.</p>
        </div>
      </div>`;
  }

  function closeOverlay() { const ov = $('#overlay'); ov.hidden = true; ov.innerHTML = ''; }

  /* ---------------- actions ---------------- */
  function tick(it) {
    if (it.kind === 'routine') {
      NB.withUndo(it.done ? 'Un-filled. It happens.' : 'Kept up. Quietly noted.', () => { it.done = !it.done; it.doneAt = it.done ? new Date().toISOString() : null; });
      return;
    }
    if (it.done) { NB.withUndo('Back on the page.', () => { it.done = false; it.doneAt = null; }); return; }
    NB.withUndo(tickLabel(it), () => { it.done = true; it.doneAt = new Date().toISOString(); it.doneKey = D.todayKey(); it.question = null; });
  }
  function tickLabel(it) {
    if (it.kind === 'goal') return 'A goal, reached. Look at you.';
    if (it.kind === 'debt') return 'Settled and crossed out.';
    if (it.kind === 'health') return 'Done. Kindly noted.';
    if (it.kind === 'renewal') return 'Handled. One less quiet thing.';
    const lines = ['Done and inked.', 'Struck through, with feeling.', 'One down.', 'Into Done it goes, proud.'];
    return lines[Math.floor(Math.random() * lines.length)];
  }

  function payBill(it) {
    const cyc = NB.billCycleKey(it);
    const paid = NB.billPaid(it, cyc);
    NB.withUndo(paid ? 'Un-paid. Bills do come back.' : `Paid. ${it.text} and I have no further business this month.`, () => {
      it.bill.paid = it.bill.paid || {};
      if (paid) delete it.bill.paid[cyc]; else it.bill.paid[cyc] = true;
    });
  }

  function whenAct(it, w) {
    const t = D.todayKey();
    NB.withUndo(`Moved to ${w}.`, () => {
      it.carried = 0;
      if (w === 'Today') { it.bucket = 'day'; it.date = t; }
      else if (w === 'Tomorrow') { it.bucket = 'day'; it.date = D.addDays(t, 1); }
      else if (w === 'This week') { it.bucket = 'week'; it.date = null; }
      else if (w === 'Next week') { it.bucket = 'day'; it.date = D.addDays(D.weekOf(t)[0], 7); }
      else if (w === 'Someday') { it.bucket = 'someday'; it.date = null; }
    });
    expandedId = null;
  }

  /* ---------------- event wiring ---------------- */
  document.addEventListener('click', (e) => {
    const tabBtn = e.target.closest('button[data-view]');
    if (tabBtn) { view = tabBtn.dataset.view; expandedId = null; render(); return; }
    const bt = e.target.closest('[data-backtab]');
    if (bt) {
      if (NOTES_TABS.some((t) => t.id === bt.dataset.backtab)) notesTab = bt.dataset.backtab;
      else backTab = bt.dataset.backtab;
      expandedId = null; render(); return;
    }

    if (e.target.closest('#btn-dump')) { openDump(''); return; }
    if (e.target.closest('#btn-settings')) { openSettings(); return; }
    if (e.target.closest('#ribbon')) { openDesk(); return; }

    const act = e.target.closest('[data-act]');
    if (!act) return;
    const a = act.dataset.act;
    const rowEl = act.closest('[data-id]');
    const it = rowEl ? NB.getItem(rowEl.dataset.id) : null;

    if (a === 'close') { closeOverlay(); return; }
    if (a === 'close-rerender') { closeOverlay(); render(); return; }
    if (a === 'sort') { runSort('paste'); return; }
    if (a === 'scrap') {
      const ta = $('#dump-text'); const text = (ta && ta.value.trim()) || '';
      if (text) {
        NB.clearSamples();
        NB.withUndo('Caught it. It\'ll wait in Ideas.', () => {
          NB.addItem({ kind: 'idea', text: text.length > 60 ? text.slice(0, 57) + '…' : text, ink: false, bucket: 'ideas', source: { quote: text.slice(0, 200), at: new Date().toISOString(), via: 'paste' } });
        });
      }
      closeOverlay(); render(); return;
    }
    if (a === 'fold') { NB.state().meta.briefFoldedFor = D.todayKey(); NB.save(); render(); return; }
    if (a === 'unfold') { NB.state().meta.briefFoldedFor = null; NB.save(); render(); return; }
    if (a === 'addday') {
      const date = act.dataset.date;
      const text = window.prompt('Jot it:');
      if (text && text.trim()) {
        NB.withUndo('Inked in.', () => {
          const { time } = NB.parseWhen(text);
          NB.addItem({ kind: 'task', text: text.trim(), date, time, bucket: 'day', source: { quote: text.trim(), at: new Date().toISOString(), via: 'manual' } });
        });
        render();
      }
      return;
    }
    if (a === 'syncnow') {
      NB.syncNow().then(() => { const l = $('#sync-line'); if (l) l.textContent = syncLine(); render(); });
      const l = $('#sync-line'); if (l) l.textContent = 'Catching up…';
      return;
    }
    if (a === 'export') {
      const blob = new Blob([NB.exportJSON()], { type: 'application/json' });
      const aEl = document.createElement('a');
      aEl.href = URL.createObjectURL(blob);
      aEl.download = `notebook-${D.todayKey()}.json`;
      aEl.click();
      return;
    }
    if (a === 'closebook') {
      if (act.dataset.armed) { NB.wipe(); closeOverlay(); location.reload(); }
      else { act.dataset.armed = '1'; act.textContent = 'Tap again to erase everything'; }
      return;
    }
    if (a === 'goback') { view = 'money'; backTab = 'bills'; render(); return; }

    if (!it) return;
    if (a === 'tick') { tick(it); render(); return; }
    if (a === 'paybill') { payBill(it); render(); return; }
    if (a === 'open') { expandedId = expandedId === it.id ? null : it.id; render(); return; }
    if (a === 'toss') { NB.withUndo('Tossed.', () => NB.removeItem(it.id)); expandedId = null; render(); return; }
    if (a === 'restore') { NB.withUndo('Back on the page.', () => { it.done = false; it.doneAt = null; }); render(); return; }
    if (a === 'answer') { NB.answerQuestion(it.id, act.dataset.answer); render(); return; }
    if (a === 'when') { whenAct(it, act.dataset.when); render(); return; }
  });

  /* edits inside detail cards */
  document.addEventListener('change', (e) => {
    const ed = e.target.closest('[data-edit]');
    if (ed) {
      const rowEl = ed.closest('[data-id]');
      const it = rowEl && NB.getItem(rowEl.dataset.id);
      if (!it) return;
      const f = ed.dataset.edit;
      if (f === 'text') { it.text = ed.value.trim() || it.text; if (it.source) it.source.edited = true; }
      if (f === 'amount' && it.bill) { it.bill.amount = ed.value === '' ? null : Number(ed.value); it.bill.estimated = false; it.ink = true; }
      if (f === 'dueDay' && it.bill) { it.bill.dueDay = ed.value === '' ? null : Math.max(1, Math.min(31, Number(ed.value))); }
      if (f === 'anchor' && it.bill) { it.bill.anchor = /^\d{4}-\d{2}-\d{2}$/.test(ed.value) ? ed.value : null; it.ink = true; it.question = null; }
      if (f === 'cadence' && it.bill) {
        /* read the next due date while the OLD rhythm still applies, so changing
           the rhythm keeps the date instead of resetting it to today */
        const wasDue = NB.billDueDate(it);
        it.bill.cadence = NB.CADENCE[ed.value] ? ed.value : 'monthly';
        if (it.bill.cadence === 'monthly') {
          it.bill.anchor = null;
          if (wasDue) it.bill.dueDay = Number(wasDue.slice(8));
        } else {
          it.bill.anchor = wasDue || D.todayKey();
        }
        /* a cycle means something different now, so the old paid keys don't line up */
        it.bill.paid = {};
        it.ink = true;
      }
      if (f === 'autopay' && it.bill) { it.bill.autopay = ed.checked; }
      if (f === 'expires' && it.renewal) { it.renewal.expires = ed.value || null; it.ink = true; it.question = null; }
      NB.save();
      if (f !== 'text') render();   /* don't tear down the DOM while the text field has focus */
      return;
    }
    const st = e.target.closest('[data-set]');
    if (st) {
      const s = NB.state().settings;
      const k = st.dataset.set;
      s[k] = st.type === 'checkbox' ? st.checked : st.value;
      NB.save(); applyTheme();
      if (k === 'gistToken') { const l = $('#sync-line'); if (l) l.textContent = syncLine(); NB.syncNow().then(() => render()); }
      return;
    }
    const imp = e.target.closest('[data-act="import"]');
    if (imp && imp.files && imp.files[0]) {
      imp.files[0].text().then((raw) => {
        try { NB.importJSON(raw); closeOverlay(); render(); NB.onWhisper('Notebook restored.'); }
        catch (err) { NB.onWhisper(err.message); }
      });
    }
  });

  /* live-save the flyleaf as you type, so a half-typed API key survives Escape */
  document.addEventListener('input', (e) => {
    const st = e.target.closest('[data-set]');
    if (!st) return;
    const s = NB.state().settings;
    s[st.dataset.set] = st.type === 'checkbox' ? st.checked : st.value;
    NB.save();
  });

  /* back-page add forms + desk form */
  document.addEventListener('submit', (e) => {
    const form = e.target.closest('form');
    if (!form) return;
    e.preventDefault();
    if (form.id === 'desk-form') {
      const q = $('#desk-q');
      if (q && q.value.trim()) { deskAsk(q.value.trim()); q.value = ''; }
      return;
    }
    const kind = form.dataset.form;
    const fd = new FormData(form);
    const src = { quote: '', at: new Date().toISOString(), via: 'manual' };
    NB.withUndo('One down. Got more? I\'ll rule the lines.', () => {
      if (kind === 'bill') {
        const cad = NB.CADENCE[fd.get('cadence')] ? fd.get('cadence') : 'monthly';
        const first = /^\d{4}-\d{2}-\d{2}$/.test(fd.get('first') || '') ? fd.get('first') : null;
        /* monthly keeps a plain day-of-month; every other rhythm counts from a date */
        const plain = cad === 'monthly';
        NB.addItem({ kind: 'bill', text: fd.get('name'), source: src, bill: {
          amount: fd.get('amount') ? Number(fd.get('amount')) : null, estimated: !fd.get('amount'),
          dueDay: plain && first ? Number(first.slice(8)) : null,
          anchor: plain ? null : first,
          autopay: !!fd.get('autopay'), cadence: cad, paid: {}, since: NB.dates.todayKey(),
        } });
      }
      if (kind === 'renewal') NB.addItem({ kind: 'renewal', text: fd.get('name'), source: src, renewal: { expires: fd.get('date') || null } });
      if (kind === 'debt') {
        /* same reading as a dumped sentence — this form used to need a literal $
           and only understood "i owe", so "I borrowed 50 from Jo" came out backwards */
        const what = fd.get('what') || '';
        const d = NB.readDebt(what);
        NB.addItem({ kind: 'debt', text: what, source: src, debt: { dir: d.dir, amount: d.amount } });
      }
      if (kind === 'health') NB.addItem({ kind: 'health', text: fd.get('name'), source: src, date: fd.get('date') || null, time: fd.get('time') || null });
    });
    render();
  });

  /* close overlay on backdrop click / Escape */
  $('#overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeOverlay(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOverlay(); });

  /* ---------------- boot ---------------- */
  function boot() {
    NB.rollover();

    /* share-target / shared text → fire-and-forget capture */
    const params = new URLSearchParams(location.search);
    const sharedText = [params.get('title'), params.get('text'), params.get('url')].filter(Boolean).join('\n');
    if (sharedText) {
      history.replaceState(null, '', location.pathname);
      openDump(sharedText);
    }

    render();

    /* the day can turn while the app stays open (installed PWAs live for days) */
    NB.onStorageError = () => NB.onWhisper('Out of room on this device — export to be safe.');
    /* keep the flyleaf's line honest while it's open */
    NB.onSync = () => { const l = $('#sync-line'); if (l) l.textContent = syncLine(); };
    /* catch up on open, and again whenever the app comes back to the front */
    NB.syncNow().then((did) => { if (did) render(); });
    window.addEventListener('pagehide', () => NB.flush && NB.flush());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { NB.flush && NB.flush(); return; }
      if (NB.state().meta.lastOpen !== D.todayKey()) { NB.rollover(); render(); }
      NB.syncNow().then((did) => { if (did) render(); });
    });
    setInterval(() => {
      if (!document.hidden && NB.state().meta.lastOpen !== D.todayKey()) { NB.rollover(); render(); }
    }, 60000);

    /* Cache the shell so an installed notebook opens without a signal. The one
       thing that can't live in this file (see sw.js). Relative path so it works
       from a Pages subpath; failure is silent — opened as a bare file, or from
       a browser that says no, the app just runs without the offline shell. */
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  }
  boot();
})();

</script>
